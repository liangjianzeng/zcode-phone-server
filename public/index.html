<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" id="metaTheme" content="#0b0b0e">
<script>
// 主题预应用：脚本主体在 body 末尾才执行，这里先把解析好的主题落到根
// 元素，避免浅色用户每次加载都闪一下深色（偏好存 localStorage，见下方
// "外观主题"模块；auto = 跟随系统 prefers-color-scheme）
(function () {
  try {
    var t = localStorage.getItem('dshTheme') || 'auto';
    var sys = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = (t === 'auto') ? sys : t;
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
})();
</script>
<title>ZCode · 任务会话</title>
<style>
  /* ── ZCode 官方风格设计令牌：近黑底 / 紫点缀 / 扁平行 ──
     深色为默认（无 data-theme 时）；浅色由 html[data-theme=light] 覆盖。
     data-theme 由 JS 解析 localStorage（auto/light/dark，auto=跟随系统
     matchMedia）后落到根元素，head 里的预应用脚本保证首帧不闪错主题。 */
  :root {
    --bg: #0b0b0e; --panel: #111114; --card: #191920; --line: #26262e;
    --fg: #e9e9ee; --dim: #85858f; --faint: #5c5c66;
    --accent: #7c5cff; --ok: #3fb950; --warn: #d29922; --err: #f85149;
    --bubble-user: #1f1f28;
    --code-bg: #08080b; --code-inline: #1c1c24;
    --chip-fg: #b7a5ff; --link: #7cb7ff;
    --btn-muted: #2c2c36; --btn-muted-2: #3a3a46;
    --shadow: 0 10px 34px rgba(0,0,0,.55);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f5f5f7; --panel: #ffffff; --card: #ffffff; --line: #e2e2e9;
    --fg: #1c1c22; --dim: #66666f; --faint: #9a9aa3;
    --accent: #6a4df0; --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
    --bubble-user: #ececf2;
    --code-bg: #f0f0f4; --code-inline: #e8e8ee;
    --chip-fg: #5b3df0; --link: #0b62d6;
    --btn-muted: #e7e7ee; --btn-muted-2: #d9d9e2;
    --shadow: 0 10px 34px rgba(0,0,0,.18);
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  /* 桥哨兵词容器：对用户不可见，但 textContent 仍含哨兵词（旧版 App 桥检测用） */
  .vh { position: absolute; left: -9999px; top: auto; width: 1px; height: 1px; overflow: hidden; }
  svg.ic { width: 20px; height: 20px; flex: none; display: block; }
  svg.ic.sm { width: 15px; height: 15px; }

  /* ── 顶栏已移除（会话名不再占一行，sessTitle 仅作 JS 数据位视觉隐藏）── */
  .vh2 { display: none; }

  /* ── 左侧边栏区：常驻竖排功能按钮（后续新功能图标加在这里）──
     栏体 fixed 贴左缘全高（顶→底），图标按钮仍在原位置；消息区与输入卡让出 46px */
  #mainRow { flex: 1; display: flex; min-height: 0; }
  #sideRail {
    position: fixed; left: 0; top: 0; bottom: 0; z-index: 6;
    width: 46px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: calc(8px + env(safe-area-inset-top)) 0 calc(8px + env(safe-area-inset-bottom));
    background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; overflow-x: hidden;
  }
  #mainRow, footer { margin-left: 46px; }
  footer { border-top-left-radius: 0; }
  .railbtn {
    background: transparent; border: none; color: var(--dim); cursor: pointer;
    width: 36px; height: 36px; border-radius: 10px; padding: 0; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .railbtn:active { background: var(--card); color: var(--fg); }
  #sideRail .mname { display: none; } /* 模型名数据位保留（JS 读写），竖栏里只显示图标 */
  .railsep { flex: none; width: 22px; height: 1px; background: var(--line); margin: 3px 0; }
  #railFuture { flex: 1; min-height: 8px; } /* 弹性占位：后续按钮可顺次排在上方或锚定底部 */

  /* ── 任务计划折叠条（官方桌面版 todo 面板同款：消息区顶部 sticky）── */
  #todoBar {
    position: sticky; top: 0; z-index: 4; display: none;
    margin: -4px -6px 8px; padding: 8px 10px;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 12px;
    cursor: pointer;
  }
  #todoBar .thead { display: flex; align-items: center; gap: 8px; }
  #todoBar .chev { color: var(--faint); flex: none; font-size: 11px; }
  /* 「任务计划」标签：明示组件身份 + 可展开（点击切换） */
  #todoBar .tlabel {
    flex: none; font-size: 11px; font-weight: 650; letter-spacing: .04em;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    border-radius: 6px; padding: 1px 7px;
  }
  #todoBar .thint { flex: none; font-size: 11px; color: var(--faint); }
  #todoBar .tsum { flex: 1; min-width: 0; font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #todoBar .tnum { color: var(--accent); font-weight: 650; font-variant-numeric: tabular-nums; }
  #todoBar .titems { display: none; margin-top: 8px; flex-direction: column; gap: 3px; }
  #todoBar.open .titems { display: flex; }
  #todoBar .ti { display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45; color: var(--dim); }
  #todoBar .ti .mk { flex: none; width: 14px; text-align: center; }
  #todoBar .ti.done { color: var(--faint); text-decoration: line-through; }
  #todoBar .ti.cur { color: var(--fg); }
  #todoBar .ti .mk.done { color: var(--ok); }

  /* ── 消息流 ── */
  main { flex: 1; min-width: 0; overflow-y: auto; padding: calc(14px + env(safe-area-inset-top)) 16px 10px; scroll-behavior: smooth; }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 16vh auto 0; color: var(--dim); }
  .hero .bigz {
    width: 60px; height: 60px; border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    color: #fff; font-size: 32px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 24px rgba(124,92,255,.3);
  }
  .hero .t1 { font-size: 19px; font-weight: 650; color: var(--fg); }
  .hero .t2 { font-size: 13px; }

  .msg { margin: 10px 0; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    max-width: 86%; background: var(--bubble-user); border-radius: 16px 16px 5px 16px;
    padding: 8px 13px; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  }
  .msg.assistant .bubble { word-break: break-word; overflow-wrap: anywhere; }
  .bubble pre {
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; overflow-x: auto; font-size: 12.5px; margin: 8px 0;
    font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; line-height: 1.5;
  }
  .bubble code.inline {
    background: var(--code-inline); padding: 1px 6px; border-radius: 6px; font-size: 13px;
    font-family: ui-monospace, Consolas, monospace;
  }
  /* markdown 渲染（assistant 气泡内）：对齐与间距 */
  .bubble .md-p { margin: 3px 0; line-height: 1.6; }
  .bubble > .md-p:first-child, .bubble > .md-h1:first-child, .bubble > .md-h2:first-child,
  .bubble > .md-h3:first-child, .bubble > .md-h4:first-child { margin-top: 0; }
  .bubble > :last-child { margin-bottom: 0; }
  .bubble .md-h1 { font-size: 17px; font-weight: 700; margin: 11px 0 5px; line-height: 1.35; }
  .bubble .md-h2 { font-size: 15.5px; font-weight: 700; margin: 10px 0 4px; line-height: 1.35; }
  .bubble .md-h3 { font-size: 14px; font-weight: 650; margin: 8px 0 3px; line-height: 1.4; }
  .bubble .md-h4 { font-size: 13.5px; font-weight: 650; margin: 7px 0 3px; color: var(--dim); }
  .bubble .md-list { margin: 3px 0; padding-left: 20px; }
  .bubble .md-list li { margin: 2.5px 0; line-height: 1.55; }
  .bubble .md-list li::marker { color: var(--faint); }
  .bubble .md-quote { margin: 6px 0; padding: 3px 12px; border-left: 3px solid var(--line); color: var(--dim); }
  .bubble .md-quote .md-p { margin: 3px 0; }
  .bubble .md-hr { border: none; border-top: 1px solid var(--line); margin: 10px 0; }
  /* markdown 表格：窄屏横向滚动，表头底色区分；del 用于 ~~删除线~~ */
  .md-tblwrap { overflow-x: auto; margin: 8px 0; border: 1px solid var(--line); border-radius: 10px; }
  .md-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .md-table th, .md-table td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
  .md-table th { background: var(--code-bg); font-weight: 650; white-space: nowrap; }
  .md-table del, .bubble del { color: var(--faint); }
  .bubble .mdlink { color: var(--link); text-decoration: none; word-break: break-all; }
  .bubble strong { font-weight: 650; color: var(--fg); }
  .bubble em { font-style: italic; }

  /* 消息操作行（复制/分享）：助手气泡尾部 + 工具输出体内，弱化样式不抢内容 */
  .msgacts { display: flex; gap: 6px; margin: 4px 0 6px; }
  .msgacts button {
    display: inline-flex; align-items: center; gap: 4px;
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    border-radius: 999px; padding: 3px 10px; font-size: 11.5px; cursor: pointer;
  }
  .msgacts button:active { background: var(--card); color: var(--fg); }

  /* ── 工具行（官方扁平样式：图标 + 名称/状态 + 命令摘要，点击展开输出）── */
  .tool { margin: 2px 0; border-radius: 9px; }
  .tool > summary {
    list-style: none; cursor: pointer; padding: 4px 6px; margin: 0 -6px;
    display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; border-radius: 9px;
  }
  .tool > summary::-webkit-details-marker { display: none; }
  .tool > summary:active { background: var(--card); }
  .tool .tico { color: var(--faint); flex: none; align-self: center; display: flex; }
  .tool .tname { color: var(--dim); flex: none; }
  .tool .tdesc {
    color: var(--dim); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
  }
  .tool.running .tstate, .tool.running .tico { color: var(--fg); }
  .tool.running .tdesc { color: var(--fg); }
  /* 完成后的工具行保留命令/目标摘要（对齐官方桌面：图标+名称+摘要+✓）。
     之前"完成后隐藏摘要"让一回合只剩"终端✓/思考"占位，手机上完全看不出
     智能体在做什么；摘要超长走省略号（.tdesc 基础样式），完整输入仍在
     展开卡片里，完成态整行压暗弱化视觉噪音。 */
  .tool.completed .tdesc { color: var(--faint); }
  .tool.completed .tname { color: var(--faint); }
  .tool.error .tdesc, .tool.error .tname { color: var(--err); }
  .tool .tstate { flex: none; color: var(--faint); display: flex; align-items: center; }
  .tool .tbody { padding: 2px 10px 8px 30px; color: var(--dim); font-size: 12.5px; }
  .tool .tbody pre {
    max-height: 220px; overflow: auto; margin: 4px 0; background: var(--code-bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px;
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
  }
  /* 思考行（官方：🧠 思考 · 持续了几秒） */
  details.think { margin: 2px 0; }
  details.think > summary {
    list-style: none; cursor: pointer; padding: 4px 6px; margin: 0 -6px; border-radius: 9px;
    display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--faint);
  }
  details.think > summary::-webkit-details-marker { display: none; }
  details.think > summary:active { background: var(--card); }
  details.think .tbody {
    padding: 2px 10px 8px 30px; color: var(--faint); font-size: 13px;
    white-space: pre-wrap; word-break: break-word;
  }
  /* 折叠态首行预览：折叠时能看出这段思考大概在想什么，展开后隐藏不重复 */
  details.think .tprev {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 12.5px; color: var(--faint);
  }
  details.think[open] .tprev { display: none; }

  /* 流末尾运行指示（官方：✳ 转圈） */
  .streamspin { padding: 8px 6px; color: var(--dim); display: flex; align-items: center; }

  .fileMention {
    display: inline-block; margin: 3px 6px 1px 0; padding: 3px 11px; border-radius: 999px;
    border: 1px solid rgba(124,92,255,.45); color: var(--chip-fg); background: rgba(124,92,255,.10);
    font-size: 12.5px; cursor: pointer;
  }
  .errline { color: var(--err); font-size: 13.5px; margin: 8px 0; }
  .sysline { color: var(--faint); font-size: 12.5px; text-align: center; margin: 8px 0; }
  /* 回合结束分隔线：转圈消失太不显眼，手机上需要明确的"干完了"视觉终点 */
  .turnend {
    display: flex; align-items: center; gap: 10px;
    color: var(--faint); font-size: 12px; margin: 12px 0 2px;
    user-select: none;
  }
  .turnend::before, .turnend::after { content: ''; flex: 1; border-top: 1px dashed var(--line); }
  /* 本轮产出卡：文档/成果集中排在回合底部；代码/其他太多 → 折叠为计数。
     chip 沿用 .fileMention（App 成果桥按 class+title 接管点击） */
  .turnarts { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; margin: 10px 0 4px; }
  .turnarts .tt { font-size: 12.5px; color: var(--dim); margin-bottom: 8px; }
  .turnarts .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .turnarts summary { cursor: pointer; font-size: 12px; color: var(--faint); margin-bottom: 6px; }

  /* ── 运行状态条：视觉隐藏（官方无此条），但 DOM 保留——旧版 App 桥的
     哨兵词 span 仍随任务运行在此增删，运行态判定不受影响 ── */
  #turnStatus {
    display: none !important;
  }

  /* ── 排队消息气泡（官方：→ 药丸）── */
  #queueBar { padding: 0 14px 6px; display: none; flex-direction: column; gap: 6px; }
  .qpill {
    display: flex; align-items: center; gap: 9px; max-width: 94%;
    margin: 0 auto; background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 8px 7px 14px; font-size: 13px; color: var(--fg);
  }
  .qpill .qarr { color: var(--dim); flex: none; }
  .qpill .qtext { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qpill .qx, .qpill .qact {
    flex: none; background: transparent; border: none; color: var(--faint);
    width: 24px; height: 24px; border-radius: 999px; padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .qpill .qact { color: var(--dim); }
  .qpill .qact:active, .qpill .qx:active { background: var(--bg); color: var(--fg); }

  /* ── 底部输入卡（官方：大圆角卡 + 底行图标/模型名/停止方块）── */
  footer {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .composer { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 10px 12px 8px; }
  textarea#composer {
    width: 100%; resize: none; background: transparent; color: var(--fg);
    border: none; outline: none; font: inherit; min-height: 24px; max-height: 140px; padding: 0;
  }
  textarea#composer::placeholder { color: var(--faint); }
  .crow { display: flex; align-items: center; gap: 3px; margin-top: 8px; }
  .crow .spacer { flex: 1; }
  .crow .cspin { color: var(--dim); display: none; align-items: center; }
  .crow.busy .cspin { display: inline-flex; }
  /* 上下文用量指示环（官方：模型名左侧的圆圈 = KV/上下文占用比，点击看详情。
     它是指标不是忙碌指示器——回合运行时绝不能旋转，避免"不知道在转圈啥意思"） */
  #btnCtx { padding: 0 3px; }
  #btnCtx .ctxsvg { width: 19px; height: 19px; }
  #btnCtx #ctxRing { transition: stroke-dashoffset .4s ease; }
  #btnCtx.hot #ctxRing { stroke: var(--err); }
  /* 上下文/套餐弹卡：审批卡同款风格，锚在 btnCtx 上方（不开侧栏） */
  .ctxpop {
    position: fixed; z-index: 70; width: min(340px, calc(100vw - 20px));
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45); padding: 12px 14px;
    display: none; max-height: 72vh; overflow-y: auto;
  }
  .ctxpop.open { display: block; }
  .ctxpop .s2 { font-size: 12px; color: var(--faint); font-weight: 600; letter-spacing: .03em; margin: 12px 0 6px; }
  .ctxpop .s2:first-child { margin-top: 0; }
  .ctxpop .bignum { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ctxpop .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .ctxpop .row { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 3px 0; color: var(--dim); }
  .ctxpop .row .v { color: var(--fg); font-variant-numeric: tabular-nums; text-align: right; }
  .ctxpop .cbar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; margin: 8px 0 4px; }
  .ctxpop .cbar > div { height: 100%; background: linear-gradient(90deg, #4c8dff, #7c5cff); }
  .ctxpop .note { color: var(--faint); font-size: 11.5px; margin-top: 8px; }
  /* 官方底行按钮组：+ 添加 / 盾牌权限模式 / 模型▾ / 思考档位▎ / 发送-停止 */
  .cbtn {
    background: transparent; border: none; color: var(--dim); cursor: pointer;
    height: 32px; min-width: 30px; padding: 0 5px; border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    font: inherit; font-size: 12.5px;
  }
  .cbtn:active { background: rgba(255,255,255,.07); color: var(--fg); }
  .cbtn svg.ic { width: 19px; height: 19px; }
  #btnMode.warn { color: var(--warn); }
  #btnMode.access { color: #f0883e; }
  #btnMode.ok { color: var(--ok); }
  #btnMode.accent { color: var(--accent); }
  #btnModel .mname { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #btnModel .caret { width: 12px; height: 12px; }
  #btnThink .lvlbar { width: 3px; height: 14px; border-radius: 2px; background: var(--faint); }
  #btnThink.lvl-mid .lvlbar { background: var(--warn); }
  #btnThink.lvl-max .lvlbar { background: var(--ok); }
  #btnSend {
    flex: none; width: 34px; height: 34px; border-radius: 11px; border: none; cursor: pointer;
    background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s ease;
  }
  #btnSend:disabled { background: var(--btn-muted); color: var(--faint); }
  #btnSend.stop { background: var(--btn-muted); color: var(--fg); }
  #btnSend.stop:active { background: var(--btn-muted-2); }

  button {
    background: var(--card); color: var(--fg); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 14px; font: inherit; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: transparent; border-color: rgba(248,81,73,.5); color: var(--err); }
  button:disabled { opacity: .45; }

  /* ── 抽屉（工作区/会话）与信息面板 ── */

  /* 会话行：官方单行布局 —— [✳运行中?] 标题 …… 相对时间，整体随项目缩进 */
  .sess { display: flex; align-items: center; gap: 8px; margin-left: 18px; }
  .sess .t { flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .time { flex: none; color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .sess .time.running { color: var(--ok); }
  .sess .busy { display: flex; color: var(--ok); flex: none; }
  .morebtn {
    display: block; width: calc(100% - 26px); margin: 0 0 4px 18px; padding: 6px 8px;

    flex: none; width: 26px; height: 26px; border-radius: 7px; border: none;

  .sess:hover .smore, .sess:active .smore { display: inline-flex; }
  .smore-pop {
    position: fixed; z-index: 40; display: none; min-width: 128px; left: 0; top: 0;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;

  .smore-pop button {

  .archsect { padding: 6px 12px 2px; display: flex; align-items: center; gap: 6px; }

  .toast {

    padding: 8px 16px; border-radius: 999px; z-index: 50; font-size: 13px; display: none;
    max-width: 86vw; text-align: center;
  }
  /* 会话切换过渡层：点击会话到历史渲染完成之间的即时反馈
     （POST /api/sessions 挂载会话+拉全量历史可能数秒，没有这层就是"点了没反应"）。
     z-index 30：盖住抽屉(20)，低于 toast(50) 与弹层(40+)。 */
  #switching {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.45); backdrop-filter: blur(2px);
  }
  #switching.on { display: flex; }
  #switching .card {

  }
  #switching .card .ic { color: var(--dim); flex: none; }

  /* spinner 通用 */
  .spin { animation: rot 1s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>

  <svg class="ic sm spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-9 9"/></svg>

<script>
'use strict';
// token 通过 URL ?token= 携带，API 调用原样透传。
const TOKEN = new URLSearchParams(location.search).get('token') ?? '';
// 页面构建标记：抽屉底部可见（诊断"手机吃到旧页面"——App WebView 缓存曾致
// 服务端修复长期无法到达终端；新页面有此标记=代码最新）
const PAGE_BUILD = '2026-10-06.23';
const qs = (o) => Object.entries(o).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
const API = (p) => `/api/${p}${p.includes('?') ? '&' : '?'}${qs({token: TOKEN})}`;

const $ = (id) => document.getElementById(id);
const chat = $('chat'), composer = $('composer');

let curSession = null;      // 当前 sessionId
let es = null;              // EventSource
let busy = false;
let busySince = 0;          // 回合开始时间（elapsed 计时）
let elapsedTimer = null;
// 渲染模型：messageId → {role, el, bubble, parts: Map(partId→part数据), partEls: Map(partId→渲染元素)}
const msgEls = new Map();
const toolEls = new Map();  // toolCallId → {el, status, name, desc, body}
const thinkTimers = new Map(); // partId → 起始时间（思考行耗时统计）
// 排队消息（预备任务）：运行中发送 → 服务端入队，回合结束后由服务端自动
// 补发为下一回合。队列数据源在服务端（刷新不丢、页面关着也补发），
// 页面只做展示与取回（GET /queue + __ui:'queue' 事件同步）。

// ── App 桥协议 v2 ──
// 页面主动向 App 上报事件；App 可调用 window.__zcode 上的函数。
// 旧版 App（APK 未升级）仍走 DOM 约定：哨兵词仅在任务运行时出现在 #turnStatus 里。
window.__zcodeBridge = 2;
function notifyApp(handler, payload) {
  try { window.flutter_inappwebview?.callHandler(handler, payload); } catch { /* 非 App 环境忽略 */ }
}
// 任务状态上报：同时携带旧版 App 认识的 state 字段（'running'/'settled'）
// 与 v2 的 running 布尔，两代 App 桥都可用。
function notifyTaskState(running) {
  notifyApp('onTaskState', { state: running ? 'running' : 'settled', running, sessionId: curSession });
}

// ── 待发附件（App 拍照/相册注入 + 页面「+ → 附件」通用文件）──
let pendingImage = null;
function showAttachChip() {
  const bar = $('attachBar');
  if (!pendingImage) { bar.style.display = 'none'; return; }
  $('attachName').textContent = `📎 ${pendingImage.name}（发送时上传到工作区）`;
  bar.style.display = 'flex';
}
function clearAttach() { pendingImage = null; showAttachChip(); }

// ── App 注入函数：新版显式契约 window.__zcode + 旧版 DSH 命名兼容（当前已装 APK 即用）──
// ⚠️ 必须用 defineProperty(writable:false) 挂到 window：App 每次页面加载完成都会
// 无条件注入 DSH 通用版同名桥（photoBridgeJs/composerBridgeJs，裸赋值覆盖）。
// 通用版拍照走"document 合成 drop"——DSH 页面有 drop 监听而本页没有，覆盖后
// 拍照/传图/上传注入全部无声失效（桥还返回 {ok:true}，App 侧不报错）。
// 非可写属性让那次赋值静默失败，页面原生实现始终胜出（App 零改动，后台统一适配）。
const composerBridgeImpl = {
  // 语义对齐 DSH 版：在光标处插入（保留已输入草稿），不整体替换
  insertText(text) {
    const t = String(text ?? '');
    const start = composer.selectionStart ?? composer.value.length;
    const end = composer.selectionEnd ?? composer.value.length;
    composer.value = composer.value.slice(0, start) + t + composer.value.slice(end);
    const pos = start + t.length;
    try { composer.setSelectionRange(pos, pos); } catch { /* 忽略 */ }
    composer.dispatchEvent(new Event('input'));
    composer.focus();
    return { ok: true };
  },
  async send() {
    if (!composer.value.trim() && !pendingImage) return { ok: false, error: 'empty' };
    await send();
    return { ok: true, via: 'zcode' };
  },
};
const photoBridgeImpl = {
  pickImage(base64, name, mime) {
    pendingImage = { base64: String(base64 ?? ''), name: String(name ?? 'image.png'), mime: String(mime ?? 'image/png') };
    showAttachChip();
    return { ok: true };
  },
};
function pinBridge(name, impl) {
  try {
    Object.defineProperty(window, name, { value: impl, writable: false, configurable: false });
  } catch { window[name] = impl; }
}
pinBridge('__dshComposerBridge', composerBridgeImpl);
pinBridge('__dshPhotoBridge', photoBridgeImpl);
window.__zcode = {
  version: 2,
  insert(text) { return window.__dshComposerBridge.insertText(text); },
  send() { return window.__dshComposerBridge.send(); },
  attachImage(base64, name, mime) { return window.__dshPhotoBridge.pickImage(base64, name, mime); },
};

function toast(msg, ms = 2200) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), ms);
}

async function api(p, opts = {}) {
  const r = await fetch(API(p), { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error ?? `HTTP ${r.status}`);
  return data;
}

// 自动滚底：用户上滚阅读历史（离底部 >140px）时不再强行拽回——
// 之前任何事件都无条件拽底，任务结束后往上拉就被弹回来（无法回看）。
// force=true 用于用户主动发送、打开会话这类"应当回到底部"的场景。
function nearBottom() { return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 140; }
function scrollBottom(force = false) {
  if (!force && !nearBottom()) return;
  requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// ── Markdown 子集渲染（安全：全部 DOM 构造，零 innerHTML）──
// 块级：```代码块 / # 标题 / - * + 无序列表 / 1. 有序列表 / > 引用 / | 表格 | / --- 分隔线 / 段落
// 行内：`行内码` / **粗体** / *斜体* / ~~删除线~~ / [文本](http链接) / 裸链接自动识别
function mdInline(parent, text) {
  const re = /`([^`]+)`|\*\*([^*]+)\*\*|\*([^*\s][^*]*)\*|~~([^~]+)~~|\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|(https?:\/\/[^\s<>（）【】，。；！？"'']+)/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
    if (m[1] !== undefined) parent.appendChild(el('code', 'inline', m[1]));
    else if (m[2] !== undefined) parent.appendChild(el('strong', '', m[2]));
    else if (m[3] !== undefined) parent.appendChild(el('em', '', m[3]));
    else if (m[4] !== undefined) parent.appendChild(el('del', '', m[4]));
    else if (m[5] !== undefined) {
      const a = el('a', 'mdlink', m[5]);
      a.href = m[6];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      parent.appendChild(a);
    } else if (m[7] !== undefined) {
      const a = el('a', 'mdlink', m[7]);
      a.href = m[7];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      parent.appendChild(a);
    }
    last = re.lastIndex;
  }
  if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
}

function mdBlocks(container, seg) {
  const lines = String(seg).replace(/\r/g, '').split('\n');
  let para = [];   // 当前段落行
  let list = null; // 当前列表 {el, ordered}
  let quote = null;
  const flushPara = () => {
    if (!para.length) return;
    const p = el('div', 'md-p');
    mdInline(p, para.join('\n'));
    container.appendChild(p);
    para = [];
  };
  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();
    if (!t) { flushPara(); list = null; quote = null; continue; }
    let m = t.match(/^(#{1,4})\s+(.*)$/);
    if (m) {
      flushPara(); list = null; quote = null;
      container.appendChild(el('div', 'md-h' + m[1].length, m[2].replace(/\s*#+\s*$/, '')));
      continue;
    }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) {
      flushPara(); list = null; quote = null;
      container.appendChild(el('hr', 'md-hr'));
      continue;
    }
    m = t.match(/^>\s?(.*)$/);
    if (m) {
      flushPara(); list = null;
      if (!quote) { quote = el('blockquote', 'md-quote'); container.appendChild(quote); }
      const qp = el('div', 'md-p');
      mdInline(qp, m[1]);
      quote.appendChild(qp);
      continue;
    }
    // 表格：| 单元格 | 行 + 下一行 |---|---| 分隔（支持 :--- 对齐标记）
    if (/^\|/.test(t) && /\|/.test(t.slice(1)) &&
        i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1].trim())) {
      flushPara(); list = null; quote = null;
      const rows = [];
      let j = i;
      while (j < lines.length && /^\s*\|/.test(lines[j])) { rows.push(lines[j].trim()); j++; }
      const cellsOf = (r) => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
      const alignOf = (c) => c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : '';
      if (rows.length >= 2) {
        const head = cellsOf(rows[0]);
        const align = cellsOf(rows[1]).map(alignOf);
        const wrap = el('div', 'md-tblwrap');
        const tbl = el('table', 'md-table');
        const thead = el('thead');
        const trh = el('tr');
        head.forEach((c, ci) => {
          const th = el('th');
          if (align[ci]) th.style.textAlign = align[ci];
          mdInline(th, c);
          trh.appendChild(th);
        });
        thead.appendChild(trh);
        tbl.appendChild(thead);
        const tb = el('tbody');
        for (const r of rows.slice(2)) {
          const cs = cellsOf(r);
          const tr = el('tr');
          head.forEach((_, ci) => {
            const td = el('td');
            if (align[ci]) td.style.textAlign = align[ci];
            mdInline(td, cs[ci] ?? '');
            tr.appendChild(td);
          });
          tb.appendChild(tr);
        }
        tbl.appendChild(tb);
        wrap.appendChild(tbl);
        container.appendChild(wrap);
        i = j; // 本块已消费到第 j 行（循环再 i++）
        continue;
      }
    }
    m = t.match(/^[-*+]\s+(.*)$/);
    if (m) {
      flushPara(); quote = null;
      if (!list || list.ordered) { list = { el: el('ul', 'md-list'), ordered: false }; container.appendChild(list.el); }
      const li = el('li');
      mdInline(li, m[1].replace(/\[( |x)\]\s*/i, (mm, c) => (c.toLowerCase() === 'x' ? '✓ ' : '□ ')));
      list.el.appendChild(li);
      continue;
    }
    m = t.match(/^\d+[.)]\s+(.*)$/);
    if (m) {
      flushPara(); quote = null;
      if (!list || !list.ordered) { list = { el: el('ol', 'md-list'), ordered: true }; container.appendChild(list.el); }
      const li = el('li');
      mdInline(li, m[1]);
      list.el.appendChild(li);
      continue;
    }
    para.push(lines[i]);
    if (list) list = null; // 列表后的非列表行结束列表
  }
  flushPara();
}

// 富文本入口：代码块 + markdown 子集（安全优先，不引外部库）
function richText(container, text) {
  const parts = String(text).split(/```/);
  parts.forEach((seg, i) => {
    if (i % 2 === 1) { // 代码块：首行语言名 → pre.language-xxx（App 代码查看器按此识别语言）
      const lang = (seg.match(/^[a-zA-Z0-9_+-]*/) ?? [''])[0];
      const pre = el('pre');
      if (lang) pre.className = 'language-' + lang;
      pre.textContent = seg.replace(/^[a-zA-Z0-9_+-]*\n/, '');
      container.appendChild(pre);
    } else {
      mdBlocks(container, seg);
    }
  });
}

function toolIcon(name) {
  const k = String(name ?? '').toLowerCase();
  if (/bash|shell|terminal|command|exec/.test(k)) return SVG.terminal;
  if (/write|edit|patch|notebook/.test(k)) return SVG.file;
  if (/read|glob|grep|search|find|ls/.test(k)) return SVG.search;
  if (/web|fetch|http|browser/.test(k)) return SVG.globe;
  if (/task|agent|todo|plan/.test(k)) return SVG.brain;
  return SVG.gear;
}

function inputSummary(input) {
  if (!input || typeof input !== 'object') return '';
  // AskUserQuestion 的 questions[].question 也算摘要来源：否则提问行只剩
  // 红色工具名，用户连"问了什么"都看不到
  const q = Array.isArray(input.questions) ? input.questions[0]?.question : input.question;
  const v = input.command ?? q ?? input.file_path ?? input.filePath ?? input.path ?? input.url ?? input.query ?? input.pattern ?? input.prompt ?? '';
  return String(v).replace(/\s+/g, ' ').slice(0, 120);
}

// ── 锚定弹层通用 ──

function closePops() {
  document.querySelectorAll('.pop.open').forEach((p) => p.classList.remove('open'));
  const cp = $('ctxPop');
  if (cp) cp.classList.remove('open');
}

function popRow(opt) {
  const b = el('button', 'mrow' + (opt.cls ? ' ' + opt.cls : '') + (opt.disabled ? ' disabled' : ''));
  if (opt.icon) { const i = el('span', 'mi'); i.innerHTML = opt.icon; b.appendChild(i); }
  const mt = el('div', 'mt');
  mt.appendChild(el('div', 't', opt.title));
  if (opt.desc) mt.appendChild(el('div', 'd', opt.desc));
  b.appendChild(mt);
  if (opt.trailing) b.appendChild(el('span', 'mck', opt.trailing));
  if (opt.checked) { const c = el('span', 'mck'); c.innerHTML = SVG.check; b.appendChild(c); }
  b.addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (opt.disabled) return;
    opt.onClick?.();
  });
  return b;
}

// 在锚点按钮上方弹出（超出屏高则贴底）；再点一次收起
function placePop(pop, anchor) {
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.left = Math.min(Math.max(8, r.left), window.innerWidth - pw - 8) + 'px';
  pop.style.top = 'auto';
  pop.style.bottom = Math.min(window.innerHeight - r.top + 8, Math.max(8, window.innerHeight - ph - 8)) + 'px';
}

function togglePop(pop, anchor, render) {
  const wasOpen = pop.classList.contains('open');
  closePops();
  if (wasOpen) return;
  render?.();
  pop.classList.add('open');
  placePop(pop, anchor);
}

document.addEventListener('click', (e) => {
  if (!(e.target instanceof Element) || !e.target.closest('.pop')) closePops();
});

// ── 权限模式菜单（官方：🛡 → 计划/变更前确认/自动编辑/完全访问）──

function renderModeMenu() {
  const pop = $('modeMenu');
  pop.textContent = '';
  pop.appendChild(el('div', 'phead', '权限模式'));
  for (const m of MODE_ORDER) {
    const meta = MODE_META[m];
    pop.appendChild(popRow({
      icon: SVG.shield, title: meta.label, desc: meta.desc,
      checked: curMode === m,
      onClick: () => pickMode(m),
    }));
  }
}

async function pickMode(m) {
  closePops();
  if (!curSession) { toast('先选择一个会话'); return; }
  try {
    await api(`sessions/${encodeURIComponent(curSession)}/mode`, { method: 'POST', body: JSON.stringify({ mode: m }) });
    curMode = m;
    syncModeUi();
    toast(`已切换：${MODE_META[m].label}`);
  } catch (e) { toast(`切换失败：${e.message}`); }
}

function syncModeUi() {
  const meta = MODE_META[curMode] ?? MODE_META.build;
  const b = $('btnMode');
  b.classList.remove('warn', 'ok', 'accent', 'access');
  if (meta.cls) b.classList.add(meta.cls);

    const opt = (sessionSettings.model.available ?? []).find((o) => currentModelKey(o) === key);

// 上下文用量指示环（官方：模型名左侧圆圈 = 上下文余量，点击看详情）
const CTX_RING_LEN = 56.55;
function updateCtxRing() {
  const ring = $('ctxRing');
  if (!ring) return;
  const proj = sessionSettings?.projection;
  const used = Number(proj?.contextUsed ?? 0);
  const win = Number(proj?.contextWindow ?? 0);
  const pct = win > 0 ? Math.min(100, Math.round((used / win) * 100)) : 0;
  ring.setAttribute('stroke-dashoffset', String(CTX_RING_LEN * (1 - pct / 100)));
  $('btnCtx').classList.toggle('hot', pct > 80);
  $('btnCtx').title = win > 0
    ? `上下文 ${fmtWan(used)} / ${fmtWan(win)}（${pct}%），点击查看`
    : '上下文用量';
}

async function refreshSettings(renderMenus = true) {
  if (!curSession) return;
  try {
    const s = await api(`sessions/${encodeURIComponent(curSession)}/settings`);
    // unavailable（会话未在本进程激活）时服务端仍可能带共享 DB 回退的
    // projection——只吸收 projection，模型/档位保持现有值
    if (s && !s.unavailable) sessionSettings = s;
    else if (s?.projection && sessionSettings) sessionSettings.projection = s.projection;
  } catch { /* 保持现有设置 */ }
  // projection 为 0 时用 goal 快照回退：会话恢复后引擎的 projection 常报 0，
  // 而 goal 快照的 contextUsed/contextWindow 是真实值（用量面板同款回退）
  if (!Number(sessionSettings?.projection?.contextUsed)) {
    try {
      const g = await api(`sessions/${encodeURIComponent(curSession)}/goal`);
      const gs = g?.snapshot ?? {};
      if (Number(gs.contextWindow) > 0 && sessionSettings) {
        sessionSettings.projection = {
          contextUsed: gs.contextUsed ?? 0,
          contextWindow: gs.contextWindow ?? 0,
          totalTokenCount: gs.tokensUsed ?? 0,
          status: sessionSettings.projection?.status ?? '',
        };
      }
    } catch { /* 下次再试 */ }
  }
  syncComposerChrome();
}

// 文件附件：选择后挂到待发槽（发送时统一上传到工作区）
async function handleFilePicked(f) {
  if (!f) return;
  if (f.size > 10 * 1024 * 1024) { toast('文件超过 10MB，暂不支持'); return; }
  const buf = new Uint8Array(await f.arrayBuffer());
  let binary = '';
  for (let i = 0; i < buf.length; i += 0x8000) binary += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  pendingImage = { base64: btoa(binary), name: f.name, mime: f.type || 'application/octet-stream' };
  showAttachChip();
}

// ── 运行状态条 / 计时 ──

function setActivity(text) {
  $('turnActivity').textContent = text || '智能体正在执行任务…';
}
function fmtElapsed(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return `已运行 ${s} 秒`;
  const m = Math.floor(s / 60);
  if (m < 60) return `已运行 ${m} 分 ${s % 60} 秒`;
  return `已运行 ${Math.floor(m / 60)} 时 ${m % 60} 分`;
}
function tickElapsed() {
  $('turnElapsed').textContent = busySince ? fmtElapsed(Date.now() - busySince) : '';
}
function markThinkDurations() {
  // 思考行补时长（回合结束/开始新思考时结算）
  const now = Date.now();
  for (const [partId, t0] of thinkTimers) {
    const lab = document.querySelector(`details.think[data-part="${partId}"] .tdur`);
    if (lab && !lab.textContent) lab.textContent = `持续了 ${Math.max(1, Math.round((now - t0) / 1000))} 秒`;
    thinkTimers.delete(partId);
  }
}

// busy 切换：
// - #turnStatus 显隐 + 哨兵词增删（旧版 App 桥据 DOM 中哨兵词判定运行态，必须随任务出现/消失）
// - 发送按钮三态：空闲=发送；运行中且有输入=排队发送（预备任务）；运行中且空=停止
// - 流末尾转圈指示
// - 已运行时长计时
function updateSendButton() {
  const btnSend = $('btnSend');
  const hasText = !!(composer.value.trim() || pendingImage);
  const mode = busy ? (hasText ? 'queue' : 'stop') : 'send';
  const stopSvg = '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>';
  const sendSvg = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 12l6-6 6 6"/></svg>';
  btnSend.classList.toggle('stop', mode === 'stop');
  const label = mode === 'stop' ? '停止' : mode === 'queue' ? '排队发送' : '发送';
  btnSend.setAttribute('aria-label', label);

// ── 本轮产出：回合内成功写出的文件集中到回合底部展示 ──
// 只突出文档/成果类（手机上点开即看），代码类条目可能太多 → 折叠为计数
let turnArtifacts = new Map(); // path → path（去重）
const DOC_ARTIFACT_RE = /\.(md|markdown|html?|txt|pdf|docx?|xlsx?|pptx?|csv|tsv|rtf|png|jpe?g|gif|webp|svg)$/i;
function addTurnArtifact(p) {
  const s = String(p ?? '');
  if (s && /\.[A-Za-z0-9]{1,8}$/.test(s)) turnArtifacts.set(s, s);
}

let lastTurnFailed = false; // turn.failed 置位：失败回合不画"本轮结束"线（红字 errline 就是终点）
function setBusy(on) {
  const wasBusy = busy; // 回合边界判定：false→true 才是新回合（多个置 busy 路径都先改 busySince，不能拿它当边界）
  busy = on;
  const status = $('turnStatus');
  status.classList.toggle('on', on);
  let sent = document.getElementById('dshSentinel');
  if (on && !sent) {
    sent = el('span', 'vh', 'Deep diving');
    sent.id = 'dshSentinel';
    status.appendChild(sent);
  } else if (!on && sent) {
    sent.remove();
  }
  updateSendButton();
  $('crow').classList.toggle('busy', on);
  let spinRow = document.getElementById('streamSpin');
  if (on && !spinRow) {
    spinRow = el('div', 'streamspin');
    spinRow.id = 'streamSpin';
    spinRow.innerHTML = SVG.spin;
    chat.appendChild(spinRow);
    scrollBottom();
  } else if (!on && spinRow) {
    spinRow.remove();
  }
  if (on) {
    if (!busySince) busySince = Date.now();
    if (!wasBusy) turnArtifacts.clear(); // 新回合开始（false→true 才是边界）：产出只收集当轮，不跨回合积累
    tickElapsed();
    if (!elapsedTimer) elapsedTimer = setInterval(tickElapsed, 1000);
  } else {
    markThinkDurations();
    // 回合收尾（含轮询推断的收尾）：所有思考都已完成，折叠展开中的思考行
    collapseOpenThinks();
    // 本轮产出卡：回合内成功写出的文档/成果集中排在回合最底部（点开即看）；
    // 代码/其他条目可能太多，折叠为计数。失败回合也照常展示（文件已存在）。
    if (busySince && turnArtifacts.size) {
      const docs = []; const code = [];
      for (const p of turnArtifacts.keys()) (DOC_ARTIFACT_RE.test(p) ? docs : code).push(p);
      if (docs.length || code.length) {
        // 产出卡只保留当轮一份：新卡渲染前移除旧回合的卡（不跨回合积累）
        for (const old of chat.querySelectorAll('.turnarts')) old.remove();
        const card = el('div', 'turnarts');
        card.appendChild(el('div', 'tt', `📦 本轮产出${docs.length ? ` · ${docs.length} 个文档/成果` : ''}`));
        const chips = el('div', 'chips');
        for (const p of docs) fileChip(chips, p);
        card.appendChild(chips);
        if (code.length) {
          const d = document.createElement('details');
          d.appendChild(el('summary', '', `另有 ${code.length} 个代码/其他文件，点击展开`));
          const cc = el('div', 'chips');
          for (const p of code) fileChip(cc, p);
          d.appendChild(cc);
          card.appendChild(d);
        }
        chat.appendChild(card);
        scrollBottom();
      }
      turnArtifacts.clear();
    }
    // 回合结束分隔线：转圈消失太不显眼，用户分不清智能体是干完了还是卡了。
    // ≥5 秒的回合在对话流末尾补一条结束线（带用时）；失败回合自带红字
    // errline 不重复画。SSE 收尾与轮询推断收尾（桌面驱动回合）都走这里。
    if (busySince) {
      const durS = Math.max(1, Math.round((Date.now() - busySince) / 1000));
      if (durS >= 5 && !lastTurnFailed) {
        const dur = durS < 60 ? `${durS} 秒` : `${Math.floor(durS / 60)} 分 ${durS % 60} 秒`;
        chat.appendChild(el('div', 'turnend', `✓ 本轮结束 · 用时 ${dur}`));
        scrollBottom();
      }
    }
    lastTurnFailed = false;
    busySince = 0;
    if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
    $('turnElapsed').textContent = '';
    setActivity('');
  }
}

function ensureMsg(messageId, role) {

  m = { el: wrap, bubble, parts: new Map(), partEls: new Map(), role };
  msgEls.set(messageId, m);

// App 桥兼容：文件 chip（class 含 fileMention，title = 完整路径）
function fileChip(container, p) {
  const name = p.split(/[\\/]/).pop() ?? p;
  const b = el('button', 'fileMention', name);
  b.setAttribute('title', p);
  b.addEventListener('click', (ev) => {
    // App 内：原生成果桥（artifactBridgeJs）在 document 冒泡阶段接管本点击
    // （按后缀分流查看器/下载页）。绝不能 stopPropagation——那会拦死桥，
    // chip 点击就"没有任何反应"。
    if (window.__dshArtifactBridge) return;
    ev.stopPropagation();
    // 浏览器环境降级为复制完整路径
    const fallback = () => toast(`文件：${p}`);
    try {
      navigator.clipboard.writeText(p).then(() => toast(`路径已复制：${p}`), fallback);
    } catch { fallback(); }
  });
  container.appendChild(b);
}

// ── 复制 / 分享（助手正文 + 成功的工具输出）──

// WebView 剪贴板：clipboard API 优先，execCommand 兜底（部分 WebView 权限收紧）
async function copyTextToClipboard(t) {
  try { await navigator.clipboard.writeText(t); toast('已复制到剪贴板'); return; } catch { /* 走兜底 */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    toast('已复制到剪贴板');
  } catch { toast('复制失败'); }
}

// Web Share API 优先（Android WebView 可用性不定），失败回落复制
async function shareOrCopy(t) {
  try {
    if (navigator.share) { await navigator.share({ text: t }); return; }
  } catch (e) { if (e?.name === 'AbortError') return; /* 用户取消分享面板 */ }
  await copyTextToClipboard(t);
  toast('当前环境不支持直接分享，已复制到剪贴板');
}

function collectMsgText(m) {
  return [...m.partEls.values()]
    .filter((v) => v.kind === 'text')
    .map((v) => String(v.raw ?? v.full ?? v.el.innerText ?? '').trim())
    .filter(Boolean).join('\n\n');
}

// 助手消息尾部的操作行（复制/分享）：只在"关键输出"上出现——任何时刻仅
// 最新一条带正文的助手消息持有，新正文到达即迁移（回合结束时正好落在
// 最终回复上）；用户气泡不加。
// ⚠️ 两道防抖纪律（违反任意一条 = 页面一抖一抖）：
// ① 只有持有者真正变化才动 DOM；② 轮询会反复带着"旧消息"进来，非最新
// 消息一律不迁移——否则操作行在 10 条消息间被反复搬动。
let actionsHolder = null;
function buildMsgActionsRow(m) {
  const mkBtn = (label, icon, fn) => {
    const b = el('button'); b.innerHTML = icon + `<span>${label}</span>`;
    b.addEventListener('click', (ev) => { ev.stopPropagation(); fn(); });
    return b;
  };
  const row = el('div', 'msgacts');
  row.append(
    mkBtn('复制', SVG.copy, () => {
      const t = collectMsgText(m);
      if (!t.trim()) return toast('没有可复制的正文');
      copyTextToClipboard(t);
    }),
    mkBtn('分享', SVG.share, () => {
      const t = collectMsgText(m);
      if (!t.trim()) return toast('没有可分享的正文');
      shareOrCopy(t);
    }),
  );
  return row;
}
function ensureMsgActions(m) {
  if (m.el.classList.contains('user')) return;
  // 按钮位置 = 紧跟"最后一段正文"之后（挨着复制对象的底部）：
  // 思考/工具行即使 DOM 顺序在其后，也不把按钮顶得远离正文
  const texts = [...m.partEls.values()].filter((v) => v.kind === 'text' && v.el?.isConnected);
  const lastText = texts[texts.length - 1];
  if (!lastText) return;
  let row = (m.el.querySelector('.msgacts')) || null;
  if (actionsHolder === m && row) {
    // 已是持有者：仅当出现了更新的正文段才搬动（未变化不动 DOM，防抖）
    if (row.previousElementSibling !== lastText.el) lastText.el.after(row);
    return;
  }
  const msgs = chat.querySelectorAll('.msg');
  if (!msgs.length || msgs[msgs.length - 1] !== m.el) return;
  for (const r of chat.querySelectorAll('.msgacts')) {
    if (r !== row) r.remove();
  }
  actionsHolder = m;
  lastText.el.after(row || buildMsgActionsRow(m));
}

function renderTextPart(m, partId, text) {
  let pe = m.partEls.get(partId);
  if (pe && pe.raw === String(text ?? '')) return pe; // 内容未变：跳过整段重建（轮询/重复事件的高频入口，无条件重建 = 页面抖动）
  if (!pe) {
    const div = el('div');
    div.__partId = partId;
    m.bubble.appendChild(div);
    pe = { kind: 'text', el: div };
    m.partEls.set(partId, pe);
  }
  // 权威渲染：先冲掉挂起的流式合帧任务（其 pending 可能比本次参数旧/新
  // 半个 delta），以落库参数为准整段重画，最终状态不会被节流吞掉
  flushStreamRich(pe);
  pe.raw = String(text ?? ''); // 原始文本留存：复制/分享取这里而非 DOM（避免混入 chip 文案）
  pe.el.textContent = '';
  richText(pe.el, text);
  if (!m.el.classList.contains('user')) ensureMsgActions(m);
  // 正文里的文件路径 → 可点击 chip
  // 路径字符集排除 CJK 与全角标点：否则"E:\xxx\yyy）中文说明…"会把整段中文
  // 吞进匹配，误渲染成文件 chip（Windows 路径含中文目录名时放弃识别，可接受）
  const found = String(text).match(/[A-Za-z]:\\[^\s"'，。；：！？、（）“”‘’\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]{3,}|(\/[\w.\-]+){2,}(\/[\w.\-]+)/g);
  if (found) for (const f of new Set(found).values()) fileChip(pe.el, f);
  return pe;
}

// 思考行（官方：🧠 思考 · 持续了几秒，可展开看过程）
// 折叠态显示时长 + 首行内容预览（tprev，展开时隐藏）——否则一屏"思考"占位
// 既不知道想了多久、也不知道想了什么
function ensureThink(m, partId) {
  let pe = m.partEls.get(partId);
  if (pe) return pe;
  const details = document.createElement('details');
  details.className = 'think';
  details.dataset.part = partId;
  const summary = document.createElement('summary');
  const ic = el('span'); ic.innerHTML = SVG.brain; ic.style.display = 'flex';
  summary.appendChild(ic);
  summary.appendChild(el('span', '', '思考'));
  summary.appendChild(el('span', 'tdur'));
  const prev = el('span', 'tprev');
  summary.appendChild(prev);
  const body = el('div', 'tbody');
  details.append(summary, body);
  m.bubble.appendChild(details);
  pe = { kind: 'think', el: details, content: body, preview: prev };
  m.partEls.set(partId, pe);
  if (!thinkTimers.has(partId)) thinkTimers.set(partId, Date.now());
  // 最新思考自动展开跟看输出（用户要求：思考进行中要保持打开）；
  // 思考完成（工具/正文部件到达、回合结束）时由 collapseOpenThinks() 折叠。
  details.open = true;
  if (openThinkDetails && openThinkDetails !== details) openThinkDetails.open = false;
  openThinkDetails = details;
  return pe;
}
let openThinkDetails = null;

// 思考首行预览同步：取第一行非空文本截断。内容写入点（渲染/增量/直播）
// 各自调用，折叠态 summary 上能看到这段思考大概在想什么
function updateThinkPreview(pe) {
  if (!pe?.preview || !pe.content) return;
  const t = String(pe.content.textContent ?? '');
  pe.preview.textContent = (t.split('\n').find((l) => l.trim()) ?? '').trim().slice(0, 90);
}

// 折叠所有展开中的思考行：思考完成的时机 = 工具/正文部件到达 或 回合结束
function collapseOpenThinks() {
  for (const d of chat.querySelectorAll('details.think[open]')) d.open = false;
  openThinkDetails = null;
}

// 工具卡片（官方扁平行：[icon] 名称 命令摘要 …… 状态）
function toolCard(toolCallId, toolName, desc) {
  // 描述与工具名相同（无 input 摘要时兜底成了名字）就不重复展示
  if (desc && (desc === toolName || desc === toolLabel(toolName))) desc = '';
  let t = toolEls.get(toolCallId);
  if (t) {
    if (toolName) t.name.textContent = toolLabel(toolName);
    if (desc) t.desc.textContent = desc;
    return t;
  }
  const details = document.createElement('details');
  details.className = 'tool pending';
  const summary = document.createElement('summary');
  const tico = el('span', 'tico');
  tico.innerHTML = toolIcon(toolName);
  const name = el('span', 'tname', toolLabel(toolName));
  const d = el('span', 'tdesc', desc ?? '');
  const state = el('span', 'tstate');
  summary.append(tico, name, d, state);
  const body = el('div', 'tbody');
  details.append(summary, body);
  const spinRow = document.getElementById('streamSpin');
  if (spinRow) chat.insertBefore(details, spinRow); else chat.appendChild(details);
  t = { el: details, state, desc: d, name, body };
  toolEls.set(toolCallId, t);
  scrollBottom();
  return t;
}

function setToolStatus(toolCallId, status, desc, detail) {
  const t = toolEls.get(toolCallId);
  if (!t) return;
  t.el.className = `tool ${status}`;
  if (desc !== undefined && desc !== null && desc !== '') t.desc.textContent = desc;
  t.state.innerHTML =
    status === 'running' ? SVG.spin :
    status === 'completed' ? SVG.check :
    status === 'error' || status === 'failed' ? SVG.cross : '';
  if (detail !== undefined && detail !== null && detail !== '') {
    t.body.textContent = '';
    const pre = el('pre'); pre.textContent = String(detail).slice(0, 4000);
    t.body.appendChild(pre);
  }
  if (status === 'running') setActivity(`正在执行 ${t.name.textContent}`);
  scrollBottom();
}

// ── 外部回合跟随（轮询共享会话存储）──
//
// 手机端引擎只能收到自己驱动的回合的 SSE 事件；桌面端驱动的回合不推事件
// （SSE 是进程内的），这是"页面静态、不同步"的根因。但引擎的会话存储是
// 共享的：回合内的工具/文本片段落盘即可从 session/messages 读到（实测
// 部件粒度实时落盘）。因此用轻量轮询做跟随：小 limit 探测最后一层指纹，
// 有变化才全量拉取重渲染；运行态按"最后部件是否 step-finish"推断。

let lastFingerprint = '';    // 最后渲染的消息尾部指纹（renderHistory 内更新）
// SSE turn.started 回显的用户气泡（{mid, text, at}）：引擎落库后 renderTail/
// renderHistory 会用存储 messageId 重画同一条消息——不清理就是"发出一条回显两条"。
// 存储渲染同文本用户消息时移除对应回显气泡（60 秒窗口，连发两条相同内容也各自对齐）。
let sseUserEchoes = [];

// 最近自己发出的输入（doSend 成功 / turn.started 回显）：part 事件里的用户
// 输入文本部件据此识别并跳过——part 处理器把一切部件当 assistant 画，用户
// 消息会被画成两份（回显 + part 副本），存储接管后还残留一份错的
const recentOwnInputs = []; // {text, at}
function isOwnInput(text) {
  const now = Date.now();
  while (recentOwnInputs.length && now - recentOwnInputs[0].at > 5 * 60000) recentOwnInputs.shift();
  const t = String(text ?? '').replace(/\s+/g, ' ').trim();
  if (!t) return false;
  return recentOwnInputs.some((e) => e.text.replace(/\s+/g, ' ').trim() === t);
}

let busySource = null;       // 'sse' = 本引擎事件驱动；'inferred' = 轮询推断
let lastActivity = 0;        // 推断运行态最近一次见到存储变化的时刻
let lastSseEventAt = 0;      // 最近一次收到 SSE 事件（检测流静默/死亡）
let finishedSince = 0;       // 推断态首次见到"回合已收尾"指纹的时刻
let pollTimer = null;

// 引擎注入的合成消息（模型可见、UI 不可见）判定：TodoWrite 提醒、
// <task-notification>、<subagent-message> 等都带 visibility:"model-only"
// / semantics.uiVisibility:"hidden" 标记，页面上渲染出来就是
// "对话里夹杂大量尖括号命令代码"的来源。
function isHiddenMessage(info) {
  if (!info) return false;
  if (info.visibility === 'model-only' || info.metadata?.visibility === 'model-only') return true;
  if (info.semantics?.uiVisibility === 'hidden') return true;
  return false;
}

function visibleMessages(messages) {
  return (messages ?? []).filter((m) => !isHiddenMessage(m?.info));
}

function lastBusyMessage(messages) {
  for (let i = messages.length - 1; i >= 0; i--) {
    if (isHiddenMessage(messages[i]?.info)) continue; // 合成消息不参与运行态推断
    if ((messages[i].info?.role ?? 'assistant') !== 'user') return messages[i];
  }
  return null;
}

// 尾部指纹：最后一条 assistant 消息的身份 + 末部件类型/状态/文本长度
function fingerprint(messages) {
  const m = lastBusyMessage(messages ?? []);
  const parts = m?.parts ?? [];
  const lp = parts.at(-1);
  return [
    m?.info?.id ?? m?.info?.messageId ?? '?',
    m?.info?.role ?? '',
    parts.length,
    lp?.type ?? '',
    lp?.state?.status ?? '',
    (lp?.text ?? '').length,
  ].join(':');
}

// 回合是否已收尾：最后一条 assistant 消息以 step-finish 部件结尾
function turnLooksFinished(messages) {
  const m = lastBusyMessage(messages ?? []);
  if (!m) return true;
  const parts = m.parts ?? [];
  return parts.at(-1)?.type === 'step-finish';
}

// 最后一条 assistant 消息是否处于进行中（用于打开会话时恢复外部运行态）
function turnLooksRunning(messages) {
  const m = lastBusyMessage(messages ?? []);
  if (!m) return false;
  const parts = m.parts ?? [];
  if (!parts.length) return false;
  return parts.at(-1)?.type !== 'step-finish';
}

// 历史消息（/session/messages 的 MessageWithParts）
// ── 任务计划（官方桌面版 todo 面板）：DB todos 实时状态 + TodoWrite 事件即时刷新 ──
let curTodos = [];
let todoOpen = false;
// todoBar 的持久引用：renderHistory 的 textContent='' 会把节点从文档摘掉，
// getElementById 对 detached 节点返回 null → appendChild(null) 崩溃（实测踩过）
const todoBarEl = document.getElementById('todoBar');

async function refreshTodos(sid) {
  const target = sid ?? curSession;
  if (!target) return;
  try {
    const r = await api(`sessions/${encodeURIComponent(target)}/todos`);
    if (target !== curSession) return; // 会话已切换：丢弃过期结果
    curTodos = (r.todos ?? []).map((t) => ({
      content: String(t.content ?? ''),
      status: String(t.status ?? 'pending'),
    }));
    renderTodoBar();
  } catch { /* 端点缺失/会话未激活：保持现状 */ }
}

function renderTodoBar() {
  const bar = todoBarEl;
  if (!curSession || !curTodos.length) { bar.style.display = 'none'; return; }
  bar.style.display = 'block';
  const done = curTodos.filter((t) => t.status === 'completed').length;
  bar.classList.toggle('open', todoOpen);
  bar.querySelector('.chev').textContent = todoOpen ? '▾' : '▸';
  bar.querySelector('.thint').textContent = todoOpen ? '点击收起' : '点击展开';
  const cur = curTodos.find((t) => t.status === 'in_progress');
  const sum = cur ? `正在：${cur.content}` : (done === curTodos.length ? '全部完成' : '等待执行');
  bar.querySelector('.tsum').textContent = sum;
  bar.querySelector('.tsum').insertAdjacentHTML('beforeend',
    ` <span class="tnum">${done}/${curTodos.length}</span>`);
  const box = bar.querySelector('.titems');
  box.textContent = '';
  for (const t of curTodos) {
    const row = el('div', 'ti' + (t.status === 'completed' ? ' done' : '') + (t.status === 'in_progress' ? ' cur' : ''));
    const mk = el('span', 'mk' + (t.status === 'completed' ? ' done' : ''),
      t.status === 'completed' ? '✓' : t.status === 'in_progress' ? '●' : '○');
    row.appendChild(mk);
    row.appendChild(el('span', '', t.content));
    box.appendChild(row);
  }
}

todoBarEl.addEventListener('click', () => {
  todoOpen = !todoOpen;
  renderTodoBar();
});

// TodoWrite 工具事件到达：短延迟批量刷新（同一回合多次写入只刷一次）
let todoRefreshTimer = null;
function scheduleTodoRefresh() {
  if (todoRefreshTimer) return;
  todoRefreshTimer = setTimeout(() => {
    todoRefreshTimer = null;
    refreshTodos();
  }, 600);
}

function renderHistory(messages, opts = {}) {
  chat.textContent = '';
  // 任务计划条是 chat 的常驻首子节点（sticky），全量重绘后补回
  chat.appendChild(todoBarEl);
  msgEls.clear(); toolEls.clear(); thinkTimers.clear();
  sseUserEchoes = []; // 全量重绘，SSE 回显气泡已随 DOM 清掉
  // 更新尾部指纹：轮询跟随以这里为准（打开会话/重连重同步/轮询全量拉取共用）
  lastFingerprint = fingerprint(messages);
  // 思考块由 ensureThink 渲染（最新一条展开）；重绘收尾时若会话空闲则统一折叠（见函数末尾）
  const vis = visibleMessages(messages);
  if (!vis.length) {
    const hero = el('div', 'hero');
    hero.innerHTML = '<div class="bigz">Z</div><div class="t1">ZCode Phone</div><div class="t2">这个会话还没有消息</div>';
    chat.appendChild(hero);
    return;
  }
  for (const msg of vis) {
    const role = msg.info?.role ?? 'assistant';
    const mid = String(msg.info?.messageId ?? msg.info?.id ?? Math.random());
    const m = ensureMsg(mid, role === 'user' ? 'user' : 'assistant');
    for (const part of msg.parts ?? []) {
      switch (part.type) {
        case 'text': renderTextPart(m, String(part.partId ?? mid + '-t'), part.text ?? ''); break;
        case 'reasoning': {
          const pidR = String(part.partId ?? mid + '-r');
          const existedR = m.partEls.has(pidR);
          const pe = ensureThink(m, pidR);
          pe.content.textContent = part.text ?? '';
          updateThinkPreview(pe);
          if (!existedR) thinkTimers.delete(pidR); // 存储整段落库的思考无真实起始时刻，不冒充"持续了 X 秒"
          break;
        }
        case 'tool': {
          const st = part.state ?? {};
          // TodoWrite 不渲染工具行，但刷新任务计划条
          if (String(part.tool ?? '').toLowerCase() === 'todowrite') { scheduleTodoRefresh(); break; }
          // 工具行到达 = 之前的思考已完成：折叠展开中的思考
          collapseOpenThinks();
          const card = toolCard(part.callId, part.tool, inputSummary(st.input) || st.title || '');
          const status = st.status ?? 'pending';
          const detail = status === 'error' ? st.error : st.output;
          setToolStatus(part.callId, status, undefined, detail);
          // 工具的 Write/Edit 目标文件 → chip
          const fp = st?.input?.file_path ?? st?.input?.filePath ?? st?.input?.path;
          if (fp) fileChip(card.body, String(fp));
          if (fp && status === 'completed') addTurnArtifact(String(fp));
          break;
        }
        default: break;
      }
    }
  }
  // 全量重绘后：空闲会话的历史思考都已完成 → 全部折叠；
  // 忙碌中（打开运行中的会话/断线重同步）则保留"最新思考展开"跟着输出
  if (!busy && !opts.keepThinkOpen) collapseOpenThinks();
  scrollBottom(true); // 打开/重同步会话：回到最新消息（不受用户滚动守卫限制）
}

// ── 计划 / 用量 / 插件（引擎能力，端点容错降级）──

function renderCtxBar(body, snap) {
  const used = snap.contextUsed, win = snap.contextWindow;
  if (!(win > 0)) return;
  const pct = Math.min(100, Math.round((used / win) * 100));
  const bar = el('div', 'ctxbar');
  bar.innerHTML = `<div style="font-size:11.5px;color:var(--faint);margin-bottom:4px;">上下文占用 ${used ?? 0} / ${win} tokens（${pct}%）</div>` +
    `<div style="height:5px;border-radius:3px;background:var(--line);overflow:hidden;"><div style="height:100%;width:${pct}%;background:${pct > 80 ? 'var(--err)' : 'var(--accent)'};"></div></div>`;
  body.appendChild(bar);
}

async function loadPlan() {
  if (!curSession) return;
  try {
    const r = await api(`sessions/${encodeURIComponent(curSession)}/goal`);
    const text = typeof r === 'string' ? r : (r.goal ?? r.response ?? r.text ?? r.plan ?? (r.unavailable ? '' : ''));
    const snap = r.snapshot ?? {};
    const has = (text && !/no goal is set/i.test(text)) || snap.contextUsed > 0;
    if ($('infoTitle').textContent.includes('计划')) {
      const body = $('infoBody');
      body.textContent = '';
      body.appendChild(el('div', 'sect', '目标'));
      body.appendChild(el('div', '', has && text ? text : '（本轮尚未设定目标）'));
      renderCtxBar(body, snap);
    }
  } catch { /* 降级：无计划面板 */ }
}

function renderKvList(obj) {
  // 展平所有层级：嵌套对象以 a.b.c 键名内联展示，不丢任何字段
  const body = $('infoBody');
  body.textContent = '';
  const rows = [];
  const walk = (o, prefix) => {
    for (const [k, v] of Object.entries(o ?? {})) {
      const key = prefix ? `${prefix}.${k}` : k;
      if (v && typeof v === 'object') walk(v, key);
      else rows.push([key, String(v)]);
    }
  };
  walk(obj, '');
  if (!rows.length) { body.appendChild(el('div', 'sysline', '暂无数据')); return; }
  for (const [k, v] of rows) {
    const row = el('div', 'kv');
    row.appendChild(el('div', 'k', k));
    row.appendChild(el('div', 'v', v));
    body.appendChild(row);
  }
}

// 打开信息面板并加载内容（标题由这里统一设置，loader 只填充 body）
function openInfo(title, loader) {
  $('infoTitle').textContent = title;
  const body = $('infoBody');
  body.textContent = '';
  body.appendChild(el('div', 'sysline', '加载中…'));
  $('info').classList.add('open');
  loader?.();
}

// 用量/上下文容量面板（对照官方：容量大卡 + 分类占比 + 统计 + 压缩入口）
// 上下文/套餐弹卡（审批卡风格，锚在模型旁圆圈上方）：
// 上下文容量（KV 占用）+ 账户套餐当前余额。不开侧栏抽屉。
// 打开/关闭由通用 togglePop（btnCtx）负责；这里只负责渲染内容。
async function loadUsage(silent = false) {
  const pop = $('ctxPop');
  if (silent && !pop.classList.contains('open')) return;
  if (!silent) { pop.textContent = ''; pop.appendChild(el('div', 'sysline', '加载中…')); }
  let settings = null, goal = null, plan = null;
  try { settings = curSession ? await api(`sessions/${encodeURIComponent(curSession)}/settings`) : null; } catch { /* 降级 */ }
  // projection 为 0（会话未在本进程激活过）时，goal 快照的 contextUsed 是更可靠来源
  if (!settings?.projection?.contextUsed) {
    try { goal = curSession ? await api(`sessions/${encodeURIComponent(curSession)}/goal`) : null; } catch { /* 降级 */ }
  }
  // 套餐 + 当前余额（z.ai 计费接口，真实数据）
  try { plan = await api('plan'); } catch { /* 降级 */ }
  if (settings && !settings.unavailable) { sessionSettings = settings; syncComposerChrome(); }
  // 回来了弹卡已关（用户点了别处）：不重绘
  if (!pop.classList.contains('open')) return;
  // 行构造（label 左、值右）
  const row = (k, v) => {
    const r = el('div', 'row');
    r.appendChild(el('span', '', k));
    r.appendChild(el('span', 'v', v));
    return r;
  };
  pop.textContent = '';
  // ── 上下文容量（本轮会话 KV 占用）──
  // settings unavailable（会话未在本进程激活）时服务端也会带 projection
  // （共享 DB 回退值），此时不可整包丢弃，只跳过模型/档位同步
  const proj = settings?.projection;
  const gctx = goal?.snapshot ?? {};
  const used = Number(proj?.contextUsed ?? gctx.contextUsed ?? 0);
  const win = Number(proj?.contextWindow ?? gctx.contextWindow ?? 0);
  pop.appendChild(el('div', 's2', '上下文容量'));
  if (win > 0) {
    const pct = Math.min(100, Math.round((used / win) * 100));
    const big = el('div', '', `${fmtWan(used)} / ${fmtWan(win)}`);
    big.className = 'bignum';
    pop.appendChild(big);
    pop.appendChild(el('div', 'sub', `已占用 ${pct}%${pct > 80 ? '，接近上限，建议压缩上下文' : ''}`));
    const bar = el('div', 'cbar');
    const fill = el('div');
    fill.style.width = pct + '%';
    if (pct > 80) fill.style.background = 'linear-gradient(90deg, #f85149, #d29922)';
    bar.appendChild(fill);
    pop.appendChild(bar);
  } else {
    pop.appendChild(el('div', 'sub', '暂无数据（回合开始后统计）'));
  }
  // ── 账户套餐当前余额（billing/balance 的 remaining/total，随推理实时变化）──
  pop.appendChild(el('div', 's2', '账户套餐'));
  const balances = plan?.balances ?? [];
  const plans = plan?.plans ?? [];
  if (balances.length) {
    const sumRem = balances.reduce((a, b) => a + b.remainingUnits, 0);
    const sumTot = balances.reduce((a, b) => a + b.totalUnits, 0);
    const sumUsed = balances.reduce((a, b) => a + b.usedUnits, 0);
    const unit = balances[0].unitType === 'token' ? 'tokens' : (balances[0].unitType || 'tokens');
    const big = el('div', '', `${fmtWan(sumRem)} / ${fmtWan(sumTot)}`);
    big.className = 'bignum';
    pop.appendChild(big);
    const pct = sumTot > 0 ? Math.min(100, Math.round((sumUsed / sumTot) * 100)) : 0;
    pop.appendChild(el('div', 'sub', `剩余 ${unit} · 已用 ${pct}%`));
    const bar = el('div', 'cbar');
    const fill = el('div');
    fill.style.width = pct + '%';
    if (pct > 80) fill.style.background = 'linear-gradient(90deg, #f85149, #d29922)';
    bar.appendChild(fill);
    pop.appendChild(bar);
    // 多个额度桶（如一次性礼包 + 周期额度）时逐桶列出
    if (balances.length > 1) {
      for (const b of balances) {
        pop.appendChild(row(b.showName || '模型额度', `${fmtWan(b.remainingUnits)} / ${fmtWan(b.totalUnits)}`));
      }
    }
  } else if (plans.length) {
    // 余额接口无数据：降级显示 billing/current 的 grant 总额
    for (const pl of plans.filter((p) => p.status === 'active' || p.status)) {
      const nm = el('div', '', `${pl.name}${pl.status !== 'active' ? `（${pl.status}）` : ''}`);
      nm.className = 'bignum';
      pop.appendChild(nm);
      for (const en of pl.entitlements ?? []) {
        pop.appendChild(row(
          `${en.model || '模型额度'}${en.period === 'one_time' ? ' · 一次性' : ''}`,
          `${fmtWan(en.grantUnits)} ${en.unitType === 'token' ? 'tokens' : en.unitType}`));
      }
    }
  } else {
    pop.appendChild(el('div', 'sub', plan?.unavailable ? `套餐余额暂不可用：${plan.unavailable}` : '暂无套餐数据'));
  }
  // 有效期（取 active 套餐最早的到期时间）
  const activePlan = plans.find((p) => p.status === 'active') ?? plans[0];
  if (activePlan?.endsAt > 0) {
    const d = new Date(activePlan.endsAt * 1000);
    pop.appendChild(row('有效期至', `${d.toLocaleDateString()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`));
  }
  // ── 压缩上下文入口 ──
  if (curSession) {
    const cbtn = el('button', 'primary', '压缩上下文');
    cbtn.style.cssText = 'margin:12px 0 2px;width:100%;';
    cbtn.addEventListener('click', async () => {
      cbtn.disabled = true;
      try {
        await api(`sessions/${encodeURIComponent(curSession)}/compact`, { method: 'POST', body: '{}' });
        toast('已请求压缩上下文');
        loadUsage(true);
      } catch (e) { toast(`压缩失败：${e.message}`); }
      cbtn.disabled = false;
    });
    pop.appendChild(cbtn);
  }
}
