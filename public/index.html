<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" id="metaTheme" content="#0b0b0e">
<script>
// 主题预应用：脚本主体在 body 末尾才执行，这里先把解析好的主题落到根
// 元素，避免浅色用户每次加载都闪一下深色（偏好存 localStorage，见下方
// "外观主题"模块；auto = 跟随系统 prefers-color-scheme）
(function () {
  try {
    var t = localStorage.getItem('dshTheme') || 'auto';
    var sys = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = (t === 'auto') ? sys : t;
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
})();
</script>
<title>ZCode · 任务会话</title>
<style>
  /* ── ZCode 官方风格设计令牌：近黑底 / 紫点缀 / 扁平行 ──
     深色为默认（无 data-theme 时）；浅色由 html[data-theme=light] 覆盖。
     data-theme 由 JS 解析 localStorage（auto/light/dark，auto=跟随系统
     matchMedia）后落到根元素，head 里的预应用脚本保证首帧不闪错主题。 */
  :root {
    --bg: #0b0b0e; --panel: #111114; --card: #191920; --line: #26262e;
    --fg: #e9e9ee; --dim: #85858f; --faint: #5c5c66;
    --accent: #7c5cff; --ok: #3fb950; --warn: #d29922; --err: #f85149;
    --bubble-user: #1f1f28;
    --code-bg: #08080b; --code-inline: #1c1c24;
    --chip-fg: #b7a5ff; --link: #7cb7ff;
    --btn-muted: #2c2c36; --btn-muted-2: #3a3a46;
    --tint: rgba(124,92,255,.14);
    --tok-key: #c792ea; --tok-str: #a5d6a5; --tok-num: #f2ae70; --tok-com: #6a6a76;
    --tok-fn: #82aaff; --tok-tag: #7cb7ff;
    --diff-add-bg: rgba(63,185,80,.12); --diff-add-fg: #56d364; --diff-add-bar: #2ea043;
    --diff-del-bg: rgba(248,81,73,.12); --diff-del-fg: #f85149; --diff-del-bar: #da3633;
    --shadow: 0 10px 34px rgba(0,0,0,.55);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f5f5f7; --panel: #ffffff; --card: #ffffff; --line: #e2e2e9;
    --fg: #1c1c22; --dim: #66666f; --faint: #9a9aa3;
    --accent: #6a4df0; --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
    --bubble-user: #ececf2;
    --code-bg: #f0f0f4; --code-inline: #e8e8ee;
    --chip-fg: #5b3df0; --link: #0b62d6;
    --btn-muted: #e7e7ee; --btn-muted-2: #d9d9e2;
    /* 浅色下 --card 与 --panel 同为白——侧栏选中/分组底色必须另有层级色，否则完全隐形 */
    --tint: rgba(106,77,240,.12);
    --tok-key: #7c3aed; --tok-str: #1a7f37; --tok-num: #b45309; --tok-com: #9a9aa3;
    --tok-fn: #1d4ed8; --tok-tag: #0b62d6;
    --diff-add-bg: rgba(26,127,55,.10); --diff-add-fg: #1a7f37; --diff-add-bar: #2da44e;
    --diff-del-bg: rgba(207,34,46,.08); --diff-del-fg: #cf222e; --diff-del-bar: #cf222e;
    --shadow: 0 10px 34px rgba(0,0,0,.18);
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { --kb: 0px; } /* 键盘高度（visualViewport 探测，JS 维护；预留调试/样式用） */
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  /* 桥哨兵词容器：对用户不可见，但 textContent 仍含哨兵词（旧版 App 桥检测用） */
  .vh { position: absolute; left: -9999px; top: auto; width: 1px; height: 1px; overflow: hidden; }
  svg.ic { width: 20px; height: 20px; flex: none; display: block; }
  svg.ic.sm { width: 15px; height: 15px; }

  /* ── 顶栏已移除（会话名不再占一行，sessTitle 仅作 JS 数据位视觉隐藏）── */
  .vh2 { display: none; }

  /* ── 左侧边栏区：常驻竖排功能按钮（后续新功能图标加在这里）──
     栏体 fixed 贴左缘全高（顶→底），图标按钮仍在原位置；消息区与输入卡让出 46px */
  #mainRow { flex: 1; display: flex; min-height: 0; }
  #sideRail {
    position: fixed; left: 0; top: 0; bottom: 0; z-index: 6;
    width: 46px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    /* 顶部不加 env(safe-area-inset-top)：App 端 WebView 位于原生顶栏之下，
       而 Android WebView 上报的是窗口级（状态栏）inset，再加一次就是双重
       避让——实测图标列被整体压下约 48px，悬在消息区半空（2026-11-03）。
       本页顶边永远不进状态栏，桌面浏览器 env() 本就是 0，写死即可。 */
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; overflow-x: hidden;
  }
  #mainRow, footer { margin-left: 46px; }
  footer { border-top-left-radius: 0; }
  .railbtn {
    background: transparent; border: none; color: var(--dim); cursor: pointer;
    width: 36px; height: 36px; border-radius: 10px; padding: 0; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .railbtn:active { background: var(--card); color: var(--fg); }
  #sideRail .mname { display: none; } /* 模型名数据位保留（JS 读写），竖栏里只显示图标 */
  .railsep { flex: none; width: 22px; height: 1px; background: var(--line); margin: 3px 0; }
  #railFuture { flex: 1; min-height: 8px; } /* 弹性占位：后续按钮可顺次排在上方或锚定底部 */

  /* 消息列：任务计划条 + 消息流（todoBar 不放进滚动容器） */
  #chatCol { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

  /* ── 任务计划折叠条（官方桌面版 todo 面板同款：常驻消息区顶部）──
     顶部为真实文档流位置（main 的前一个兄弟节点），不用 position:sticky：
     滚动容器 padding 变化 / WebView 实现差异都会让 sticky 固定在 padding
     缘而非可视顶部，上方的缝隙会漏出滚动经过的正文（实测顶部 padding 被
     safe-area 双重避让撑到 62px 时整个计划条"悬空"错位）。挪出滚动容器
     后无此依赖，WebView 与桌面渲染完全一致。 */
  #todoBar {
    position: relative; z-index: 4; flex: none; display: none;
    margin: 6px 16px 0; padding: 8px 10px;
    /* 必须完全不透明：安卓 WebView 大多不支持 backdrop-filter，磨砂失效后
       半透明底会让滚动经过的正文渗出来，视觉上就是"文字被夹断/错位"。
       （曾用 88% 透明 + blur 的毛玻璃方案，实测渗字，2026-11-03 改实底） */
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px;
    cursor: pointer;
  }
  #todoBar .thead { display: flex; align-items: center; gap: 8px; }
  #todoBar .chev { color: var(--faint); flex: none; font-size: 11px; }
  /* 「任务计划」标签：明示组件身份 + 可展开（点击切换） */
  #todoBar .tlabel {
    flex: none; font-size: 11px; font-weight: 650; letter-spacing: .04em;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    border-radius: 6px; padding: 1px 7px;
  }
  #todoBar .thint { flex: none; font-size: 11px; color: var(--faint); }
  #todoBar .tsum { flex: 1; min-width: 0; font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #todoBar .tnum { color: var(--accent); font-weight: 650; font-variant-numeric: tabular-nums; }
  #todoBar .titems { display: none; margin-top: 8px; flex-direction: column; gap: 3px; }
  #todoBar.open .titems { display: flex; }
  #todoBar .ti { display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45; color: var(--dim); }
  #todoBar .ti .mk { flex: none; width: 14px; text-align: center; }
  #todoBar .ti.done { color: var(--faint); text-decoration: line-through; }
  #todoBar .ti.cur { color: var(--fg); }
  #todoBar .ti .mk.done { color: var(--ok); }

  /* ── 消息流 ── */
  /* 不用 scroll-behavior:smooth：流式输出时 scrollBottom 每帧都设新目标，
     平滑动画被反复打断 = 滚动永远追不上内容增长，消息区抖动、内容错位观感。
     移动端聊天页标准做法是即时滚动（官方桌面版同款）。 */
  main { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 10px 16px 10px; }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 16vh auto 0; color: var(--dim); }
  .hero .bigz {
    width: 60px; height: 60px; border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    color: #fff; font-size: 32px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 24px rgba(124,92,255,.3);
  }
  .hero .t1 { font-size: 19px; font-weight: 650; color: var(--fg); }
  .hero .t2 { font-size: 13px; }

  .msg { margin: 10px 0; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    max-width: 86%; background: var(--bubble-user); border-radius: 16px 16px 5px 16px;
    padding: 8px 13px; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  }
  .msg.assistant .bubble { word-break: break-word; overflow-wrap: anywhere; }
  /* 一条消息里的多个正文段（被思考/工具行隔开）之间留一点呼吸感 */
  .msg.assistant .bubble + .bubble { margin-top: 4px; }
  .bubble pre {
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; overflow-x: auto; font-size: 12.5px; margin: 8px 0;
    font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; line-height: 1.5;
  }
  /* 代码块容器：头部（语言标签 + 复制按钮）+ 横向滚动的 pre（对照官方 codeBlock） */
  .codeblock { margin: 8px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
  .codeblock .cbhead {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 11px;
    border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--line) 35%, transparent);
  }
  .codeblock .cblang { flex: 1; min-width: 0; font-size: 11px; color: var(--faint); font-family: ui-monospace, Consolas, monospace; letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .codeblock .cbcopy {
    flex: none; background: transparent; border: none; color: var(--dim); cursor: pointer;
    padding: 3px 8px; border-radius: 7px; font: inherit; font-size: 11px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .codeblock .cbcopy:active { background: var(--card); color: var(--fg); }
  .codeblock pre { margin: 0; border: none; border-radius: 0; }
  /* 轻量语法高亮：全部走 CSS 变量（深浅主题各自定义，新增硬编码颜色视为回归） */
  .bubble pre .tk-key { color: var(--tok-key); }
  .bubble pre .tk-str { color: var(--tok-str); }
  .bubble pre .tk-num { color: var(--tok-num); }
  .bubble pre .tk-com { color: var(--tok-com); font-style: italic; }
  .bubble pre .tk-fn  { color: var(--tok-fn); }
  .bubble pre .tk-tag { color: var(--tok-tag); }
  .bubble pre .tk-bool { color: var(--tok-num); }
  /* markdown 图片：窄屏限宽，点击放大（新开/降级 toast） */
  .bubble .md-img { max-width: 100%; max-height: 320px; border-radius: 10px; border: 1px solid var(--line); display: block; margin: 6px 0; cursor: pointer; }
  /* @ 文件引用候选菜单：锚在 composer 上方 */
  #atMenu { max-height: 46vh; }
  #atMenu .mrow.at-active { background: rgba(124,92,255,.14); }
  .bubble code.inline {
    background: var(--code-inline); padding: 1px 6px; border-radius: 6px; font-size: 13px;
    font-family: ui-monospace, Consolas, monospace;
  }
  /* markdown 渲染（assistant 气泡内）：对齐与间距 */
  .bubble .md-p { margin: 3px 0; line-height: 1.6; }
  .bubble > .md-p:first-child, .bubble > .md-h1:first-child, .bubble > .md-h2:first-child,
  .bubble > .md-h3:first-child, .bubble > .md-h4:first-child { margin-top: 0; }
  .bubble > :last-child { margin-bottom: 0; }
  .bubble .md-h1 { font-size: 17px; font-weight: 700; margin: 11px 0 5px; line-height: 1.35; }
  .bubble .md-h2 { font-size: 15.5px; font-weight: 700; margin: 10px 0 4px; line-height: 1.35; }
  .bubble .md-h3 { font-size: 14px; font-weight: 650; margin: 8px 0 3px; line-height: 1.4; }
  .bubble .md-h4 { font-size: 13.5px; font-weight: 650; margin: 7px 0 3px; color: var(--dim); }
  .bubble .md-list { margin: 3px 0; padding-left: 20px; }
  .bubble .md-list li { margin: 2.5px 0; line-height: 1.55; }
  .bubble .md-list li::marker { color: var(--faint); }
  .bubble .md-quote { margin: 6px 0; padding: 3px 12px; border-left: 3px solid var(--line); color: var(--dim); }
  .bubble .md-quote .md-p { margin: 3px 0; }
  .bubble .md-hr { border: none; border-top: 1px solid var(--line); margin: 10px 0; }
  /* markdown 表格：窄屏横向滚动，表头底色区分；del 用于 ~~删除线~~ */
  .md-tblwrap { overflow-x: auto; margin: 8px 0; border: 1px solid var(--line); border-radius: 10px; }
  .md-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .md-table th, .md-table td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
  .md-table th { background: var(--code-bg); font-weight: 650; white-space: nowrap; }
  .md-table del, .bubble del { color: var(--faint); }
  .bubble .mdlink { color: var(--link); text-decoration: none; word-break: break-all; }
  .bubble strong { font-weight: 650; color: var(--fg); }
  .bubble em { font-style: italic; }

  /* 消息操作行（复制/分享）：助手气泡尾部 + 工具输出体内，弱化样式不抢内容 */
  .msgacts { display: flex; gap: 6px; margin: 4px 0 6px; }
  .msgacts button {
    display: inline-flex; align-items: center; gap: 4px;
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    border-radius: 999px; padding: 3px 10px; font-size: 11.5px; cursor: pointer;
  }
  .msgacts button:active { background: var(--card); color: var(--fg); }

  /* ── 工具行（官方扁平样式：图标 + 名称/状态 + 命令摘要，点击展开输出）── */
  .tool { margin: 2px 0; border-radius: 9px; }
  .tool > summary {
    list-style: none; cursor: pointer; padding: 4px 6px; margin: 0 -6px;
    display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; border-radius: 9px;
  }
  .tool > summary::-webkit-details-marker { display: none; }
  .tool > summary:active { background: var(--card); }
  .tool .tico { color: var(--faint); flex: none; align-self: center; display: flex; }
  .tool .tname { color: var(--dim); flex: none; }
  .tool .tdesc {
    color: var(--dim); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
  }
  .tool.running .tstate, .tool.running .tico { color: var(--fg); }
  .tool.running .tdesc { color: var(--fg); }
  /* 完成后的工具行保留命令/目标摘要（对齐官方桌面：图标+名称+摘要+✓）。
     之前"完成后隐藏摘要"让一回合只剩"终端✓/思考"占位，手机上完全看不出
     智能体在做什么；摘要超长走省略号（.tdesc 基础样式），完整输入仍在
     展开卡片里，完成态整行压暗弱化视觉噪音。 */
  .tool.completed .tdesc { color: var(--faint); }
  .tool.completed .tname { color: var(--faint); }
  .tool.error .tdesc, .tool.error .tname { color: var(--err); }
  .tool .tstate { flex: none; color: var(--faint); display: flex; align-items: center; }
  .tool .tbody { padding: 2px 10px 8px 30px; color: var(--dim); font-size: 12.5px; }
  .tool .tbody pre {
    max-height: 220px; overflow: auto; margin: 4px 0; background: var(--code-bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px;
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
  }
  /* 思考行（官方：🧠 思考 · 持续了几秒） */
  details.think { margin: 2px 0; }
  details.think > summary {
    list-style: none; cursor: pointer; padding: 4px 6px; margin: 0 -6px; border-radius: 9px;
    display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--faint);
  }
  details.think > summary::-webkit-details-marker { display: none; }
  details.think > summary:active { background: var(--card); }
  details.think .tbody {
    padding: 2px 10px 8px 30px; color: var(--faint); font-size: 13px;
    white-space: pre-wrap; word-break: break-word;
  }
  /* 折叠态首行预览：折叠时能看出这段思考大概在想什么，展开后隐藏不重复 */
  details.think .tprev {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 12.5px; color: var(--faint);
  }
  details.think[open] .tprev { display: none; }

  /* 流末尾运行指示（官方：✳ 转圈） */
  /* 回合状态行（对照桌面 ChatLoading：spinner + 活动标签 + 秒表）——
     之前只有孤零零一个转圈，"在干什么/跑了多久"全藏在视觉隐藏的桥接条里 */
  .streamspin { padding: 8px 6px; color: var(--dim); display: flex; align-items: center; gap: 8px; font-size: 12.5px; min-height: 34px; }
  .streamspin .sa-act { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .streamspin .sa-el { color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* 流式尾部光标：挂在流式文本元素之后的独立兄弟节点（不进每帧重建的
     DOM → 眨眼不闪断），settle 后移除；系统减弱动效时静态半透明 */
  .scaret { display: inline-block; width: 7px; height: 14px; margin-left: 2px; background: var(--accent); border-radius: 2px; vertical-align: -2px; animation: caretblink 1s step-end infinite; }
  @keyframes caretblink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .scaret { animation: none; opacity: .55; } }
  /* 回到底部悬浮按钮（对照桌面 ConversationBackToBottomButton）：
     上滑离底出现，居中悬在输入区上方；直播期间有新内容亮小圆点 */
  #chatCol { position: relative; }
  .b2b {
    position: absolute; left: 50%; transform: translateX(-50%) translateY(6px);
    bottom: 12px; z-index: 30;
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--card); color: var(--dim);
    border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.18);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
  }
  .b2b.on { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .b2b .ic { width: 18px; height: 18px; }
  .b2b.dot::after { content: ''; position: absolute; top: -1px; right: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 2px solid var(--card); }
  /* 长会话渲染瘦身（>80 条挂 .cvchat）：屏外消息跳过布局/绘制 */
  #chat.cvchat .msg { content-visibility: auto; contain-intrinsic-size: auto 140px; }

  .fileMention {
    display: inline-block; margin: 3px 6px 1px 0; padding: 3px 11px; border-radius: 999px;
    border: 1px solid rgba(124,92,255,.45); color: var(--chip-fg); background: rgba(124,92,255,.10);
    font-size: 12.5px; cursor: pointer;
  }
  .errline { color: var(--err); font-size: 13.5px; margin: 8px 0; }
  .sysline { color: var(--faint); font-size: 12.5px; text-align: center; margin: 8px 0; }
  /* 回合结束分隔线：转圈消失太不显眼，手机上需要明确的"干完了"视觉终点 */
  .turnend {
    display: flex; align-items: center; gap: 10px;
    color: var(--faint); font-size: 12px; margin: 12px 0 2px;
    user-select: none;
  }
  .turnend::before, .turnend::after { content: ''; flex: 1; border-top: 1px dashed var(--line); }
  /* 本轮产出卡：文档/成果集中排在回合底部；代码/其他太多 → 折叠为计数。
     chip 沿用 .fileMention（App 成果桥按 class+title 接管点击） */
  .turnarts { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; margin: 10px 0 4px; }
  .turnarts .tt { font-size: 12.5px; color: var(--dim); margin-bottom: 8px; }
  .turnarts .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .turnarts summary { cursor: pointer; font-size: 12px; color: var(--faint); margin-bottom: 6px; }
  /* 本回合更改文件卡（对照官方 changeSummary）：✏️ 标题 + 可点开的文件 chip */
  .turnchanges { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; margin: 10px 0 4px; }
  .turnchanges .tt { font-size: 12.5px; color: var(--dim); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .turnchanges .tt .n { color: var(--accent); font-weight: 650; font-variant-numeric: tabular-nums; }
  .turnchanges .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .turnchanges summary { cursor: pointer; font-size: 12px; color: var(--faint); margin-bottom: 6px; }

  /* ── 运行状态条：视觉隐藏（官方无此条），但 DOM 保留——旧版 App 桥的
     哨兵词 span 仍随任务运行在此增删，运行态判定不受影响 ── */
  #turnStatus {
    display: none !important;
  }

  /* ── 排队消息气泡（官方：→ 药丸）── */
  #queueBar { padding: 0 14px 6px; display: none; flex-direction: column; gap: 6px; }
  .qpill {
    display: flex; align-items: center; gap: 9px; max-width: 94%;
    margin: 0 auto; background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 8px 7px 14px; font-size: 13px; color: var(--fg);
  }
  .qpill .qarr { color: var(--dim); flex: none; }
  .qpill .qtext { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qpill .qx, .qpill .qact {
    flex: none; background: transparent; border: none; color: var(--faint);
    width: 24px; height: 24px; border-radius: 999px; padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .qpill .qact { color: var(--dim); }
  .qpill .qact:active, .qpill .qx:active { background: var(--bg); color: var(--fg); }

  /* ── 底部输入卡（官方：大圆角卡 + 底行图标/模型名/停止方块）── */
  footer {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .composer { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 10px 12px 8px; }
  textarea#composer {
    width: 100%; resize: none; background: transparent; color: var(--fg);
    border: none; outline: none; font: inherit; min-height: 24px; max-height: 140px; padding: 0;
  }
  textarea#composer::placeholder { color: var(--faint); }
  .crow { display: flex; align-items: center; gap: 3px; margin-top: 8px; }
  .crow .spacer { flex: 1; }
  .crow .cspin { color: var(--dim); display: none; align-items: center; }
  .crow.busy .cspin { display: inline-flex; }
  /* 上下文用量指示环（官方：模型名左侧的圆圈 = KV/上下文占用比，点击看详情。
     它是指标不是忙碌指示器——回合运行时绝不能旋转，避免"不知道在转圈啥意思"） */
  #btnCtx { padding: 0 3px; }
  #btnCtx .ctxsvg { width: 19px; height: 19px; }
  #btnCtx #ctxRing { transition: stroke-dashoffset .4s ease; }
  #btnCtx.hot #ctxRing { stroke: var(--err); }
  /* 上下文/套餐弹卡：审批卡同款风格，锚在 btnCtx 上方（不开侧栏） */
  .ctxpop {
    position: fixed; z-index: 70; width: min(340px, calc(100vw - 20px));
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45); padding: 12px 14px;
    display: none; max-height: 72vh; overflow-y: auto;
  }
  .ctxpop.open { display: block; }
  .ctxpop .s2 { font-size: 12px; color: var(--faint); font-weight: 600; letter-spacing: .03em; margin: 12px 0 6px; }
  .ctxpop .s2:first-child { margin-top: 0; }
  .ctxpop .bignum { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ctxpop .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .ctxpop .row { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 3px 0; color: var(--dim); }
  .ctxpop .row .v { color: var(--fg); font-variant-numeric: tabular-nums; text-align: right; }
  .ctxpop .cbar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; margin: 8px 0 4px; }
  .ctxpop .cbar > div { height: 100%; background: linear-gradient(90deg, #4c8dff, #7c5cff); }
  .ctxpop .note { color: var(--faint); font-size: 11.5px; margin-top: 8px; }
  /* 官方底行按钮组：+ 添加 / 盾牌权限模式 / 模型▾ / 思考档位▎ / 发送-停止 */
  .cbtn {
    background: transparent; border: none; color: var(--dim); cursor: pointer;
    height: 32px; min-width: 30px; padding: 0 5px; border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    font: inherit; font-size: 12.5px;
  }
  .cbtn:active { background: rgba(255,255,255,.07); color: var(--fg); }
  .cbtn svg.ic { width: 19px; height: 19px; }
  #btnMode.warn { color: var(--warn); }
  #btnMode.access { color: #f0883e; }
  #btnMode.ok { color: var(--ok); }
  #btnMode.accent { color: var(--accent); }
  #btnModel .mname { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #btnModel .caret { width: 12px; height: 12px; }
  #btnThink .lvlbar { width: 3px; height: 14px; border-radius: 2px; background: var(--faint); }
  #btnThink.lvl-mid .lvlbar { background: var(--warn); }
  #btnThink.lvl-max .lvlbar { background: var(--ok); }
  #btnSend {
    flex: none; width: 34px; height: 34px; border-radius: 11px; border: none; cursor: pointer;
    background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s ease;
  }
  #btnSend:disabled { background: var(--btn-muted); color: var(--faint); }
  #btnSend.stop { background: var(--btn-muted); color: var(--fg); }
  #btnSend.stop:active { background: var(--btn-muted-2); }

  button {
    background: var(--card); color: var(--fg); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 14px; font: inherit; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: transparent; border-color: rgba(248,81,73,.5); color: var(--err); }
  button:disabled { opacity: .45; }

  /* ── 抽屉（工作区/会话）与信息面板 ── */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 20; }
  .overlay.open { display: block; }
  #drawer .sheet {
    position: absolute; left: 0; top: 0; bottom: 0; width: min(72vw, 280px);
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  #drawer .sheet .head { padding: 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  #drawer .sheet .head b { flex: 1; }
  #info .sheet {
    position: absolute; right: 0; top: 0; bottom: 0; width: min(84vw, 360px);
    background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  #info .sheet .head { padding: 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  #info .sheet .head b { flex: 1; }
  .sheetbody { flex: 1; overflow-y: auto; padding: 8px; }
  /* 分组头无底色（用户拍板 2026-11-03：底色只用于当前会话行，项目不需要）；
     层级感靠 加粗字重 + 条数 + 下方导轨线 完成 */
  .wsrow {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px;
    margin: 3px 0; cursor: pointer; border: 1px solid transparent; font-size: 13.5px;
  }
  /* 分组头与会话行字体分层：项目加粗收紧、会话维持常规正文字号——同字号同字重时一锅粥 */
  .wsrow .plabel {
    flex: 1; min-width: 0; font-weight: 600; font-size: 13px; letter-spacing: .03em;
    color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* 当前项目行不加底色——底色是"正在查看的会话"专属信号，项目用圆点标记即可 */
  .wsrow.cur { border-color: transparent; }
  /* 主机行下的项目行缩半格（远程 主机→项目→会话 三级层级） */
  .wsrow.sub { margin-left: 16px; }
  .wsrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .wsrow.cur .dot { background: var(--ok); }
  .wsrow .p { color: var(--faint); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wsrow .mi { color: var(--dim); display: flex; flex: none; }
  /* 项目行内「＋」：一键把新会话建到该项目（新建会话不再落地不明项目） */
  .wsrow .wsadd {
    flex: none; width: 26px; height: 26px; margin-left: auto;
    border-radius: 8px; border: none; background: transparent; color: var(--accent);
    font: inherit; font-size: 15px; line-height: 1; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .wsrow .wsadd:active { background: var(--card); }
  /* 会话行：官方单行布局 —— [✳运行中?] 标题 …… 相对时间。
     层级缩进由 .gkids 容器负责（会话行自己不再各排各的左距——此前后段
     重复规则覆盖了缩进，项目与会话齐宽平铺，看得眼花） */
  .sess {
    display: flex; align-items: center; gap: 8px; margin: 1px 0;
    padding: 6px 8px; border-radius: 10px; border: 1px solid transparent;
  }
  /* 分组子树容器：整块右缩 + 竖向导轨线，一眼看出"这几条属于上面那个项目" */
  .gkids {
    margin: 1px 10px 9px 20px; padding-left: 11px;
    border-left: 2px solid var(--line);
  }
  .gkids .sess { margin-left: 0; }
  .gkids .morebtn { margin-left: 0; width: 100%; }
  /* 项目头行右侧会话条数（层级观感的锚点） */
  .wsrow .cnt { flex: none; color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  /* 未读圆点（对照桌面任务行 unread 标记）：蓝点置于行首标题前 */
  .sess .udot {
    flex: none; width: 7px; height: 7px; margin: 0 2px 0 1px; border-radius: 50%;
    background: var(--link); box-shadow: 0 0 0 2px color-mix(in srgb, var(--link) 22%, transparent);
  }
  /* 置顶分区头行：图钉图标随强调色，弱化行身可点感（行身不切工作区） */
  .wsrow.pinrow .mi { color: var(--accent); }
  .wsrow.pinrow .plabel { color: var(--fg); }
  /* Token 构成分段条（对照桌面 context.tsx）：五段按占比横排，图例行沿用 .row */
  .tkseg {
    display: flex; height: 10px; border-radius: 5px; overflow: hidden;
    margin: 4px 0 8px; background: var(--btn-muted); gap: 1px;
  }
  .tkseg i { display: block; height: 100%; }
  /* mermaid 图与公式（vendor 增强，见 enhanceChatRich）：图随气泡宽缩放，
     原码折叠可查（保留语言 class 供 App 查看器识别）；KaTeX 字号微调贴合正文 */
  .mmbox { margin: 6px 0; overflow-x: auto; text-align: center; }
  .mmbox svg { max-width: 100%; height: auto; }
  .mmbox[data-mm-wait] { min-height: 24px; }
  .mmsrc { margin: 2px 0 6px; }
  .mmsrc summary { color: var(--faint); font-size: 12px; cursor: pointer; user-select: none; }
  .bubble .katex { font-size: 1.06em; }
  /* 分组折叠手柄（▾/▸）：组级折叠与组内「显示更多」是两层语义，各有状态 */
  .wsrow .twist {
    flex: none; width: 24px; height: 24px; margin-left: -4px; padding: 0;
    border: none; background: transparent; color: var(--faint);
    font: inherit; font-size: 12px; line-height: 1; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; border-radius: 7px;
  }
  .wsrow .twist:active { background: var(--card); color: var(--fg); }
  .sess .t { flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .time { flex: none; color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .sess .time.running { color: var(--ok); }
  .sess .busy { display: flex; color: var(--ok); flex: none; }
  .morebtn {
    display: block; width: calc(100% - 26px); margin: 0 0 4px 18px; padding: 6px 8px;
    background: transparent; border: none; color: var(--accent);
    font: inherit; font-size: 12.5px; text-align: left; cursor: pointer; border-radius: 8px;
  }
  .morebtn:active { background: var(--card); }
  /* 会话行 ⋯ 菜单按钮 + 弹出操作单（打开/归档/删除） */
  .sess .smore {
    flex: none; width: 26px; height: 26px; border-radius: 7px; border: none;
    background: transparent; color: var(--faint); cursor: pointer;
    display: none; align-items: center; justify-content: center; padding: 0;
    font-size: 15px; line-height: 1;
  }
  .sess:hover .smore, .sess:active .smore { display: inline-flex; }
  .smore-pop {
    position: fixed; z-index: 40; display: none; min-width: 128px; left: 0; top: 0;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 5px; box-shadow: 0 8px 28px rgba(0,0,0,.5);
  }
  .smore-pop.open { display: block; }
  .smore-pop button {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    background: transparent; border: none; padding: 9px 11px; border-radius: 8px;
    font-size: 13.5px; color: var(--fg); cursor: pointer;
  }
  .smore-pop button:active { background: var(--panel); }
  .smore-pop button.danger { color: var(--err); }
  .archsect { padding: 6px 12px 2px; display: flex; align-items: center; gap: 6px; }
  .archsect b { color: var(--faint); font-size: 11.5px; font-weight: 600; letter-spacing: .05em; flex: 1; }
  /* 会话搜索框（抽屉头部下方，sticky 随滚区顶部常驻） */
  .sesssearch {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 6px;
    margin: 8px 8px 2px; padding: 4px 6px 4px 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  }
  .sesssearch .ic { color: var(--faint); }
  .sesssearch input {
    flex: 1; min-width: 0; background: transparent; border: none; outline: none;
    color: var(--fg); font: inherit; font-size: 13.5px; padding: 5px 0;
  }
  .sesssearch input::placeholder { color: var(--faint); }
  .sesssearch input::-webkit-search-cancel-button { display: none; }
  .sesssearch button {
    flex: none; background: transparent; border: none; color: var(--faint);
    width: 26px; height: 26px; border-radius: 8px; padding: 0; cursor: pointer;
    font: inherit; font-size: 12px; display: inline-flex; align-items: center; justify-content: center;
  }
  .sesssearch button:active { background: var(--card); color: var(--fg); }
  .sect { padding: 12px 12px 4px; font-size: 12px; color: var(--faint); font-weight: 600; letter-spacing: .05em; }
  .sess { padding: 9px 10px; border-radius: 10px; margin: 2px 0; cursor: pointer; border: 1px solid transparent; }
  .sess:active { background: var(--card); }
  /* 主界面正在查看/流式的会话：浅紫底 + 描边——侧栏一眼认出"现在聊的是哪条" */
  .sess.cur { background: var(--tint); border-color: rgba(124,92,255,.55); }
  .sess .t { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .m { font-size: 12px; color: var(--faint); display: flex; gap: 8px; }
  .sess .busy { color: var(--ok); }
  .kv { display: flex; gap: 10px; padding: 7px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
  .kv .k { color: var(--dim); width: 42%; flex: none; overflow: hidden; text-overflow: ellipsis; }
  .kv .v { flex: 1; word-break: break-all; }
  .plug { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .plug .n { flex: 1; min-width: 0; }
  .plug .d { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctxbar { margin: 8px 12px 4px; }

  /* ── 锚定弹层（添加 / 权限模式 / 模型 / 思考档位，对照官方浮层交互）── */
  .pop {
    position: fixed; z-index: 40; display: none; min-width: 216px; max-width: min(88vw, 340px);
    max-height: 62vh; overflow-y: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 6px; box-shadow: var(--shadow);
  }
  .pop.open { display: block; }
  .pop .phead { padding: 8px 10px 4px; font-size: 12px; color: var(--faint); font-weight: 600; letter-spacing: .03em; }
  .mrow {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: transparent; border: none; padding: 9px 10px; border-radius: 11px;
    font: inherit; font-size: 13.5px; color: var(--fg); cursor: pointer;
  }
  .mrow:active { background: rgba(255,255,255,.05); }
  .mrow .mi { color: var(--dim); flex: none; display: flex; }
  .mrow .mt { flex: 1; min-width: 0; }
  .mrow .mt .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow .mt .d { color: var(--faint); font-size: 11.5px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrow .mck { color: var(--fg); flex: none; display: flex; }
  .mrow.disabled { opacity: .45; }
  /* 模型菜单紧凑行：条目多（官方+本地），行距收小、单行更密 */
  .mrow.compact { padding: 5px 10px; }

  /* ── 上下文容量卡（对照官方：总量 + 百分比 + 渐变进度条 + 分类占比）── */
  .ctxcard { margin: 10px 12px 4px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--card); }
  .ctxcard .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .ctxcard .hd .t { font-size: 14px; font-weight: 650; }
  .ctxcard .hd .n { font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .ctxcard .bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; margin: 10px 0 6px; }
  .ctxcard .bar > div { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #4c8dff, #7c5cff); transition: width .4s ease; }
  .bdrow { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12.5px; }
  .bdrow .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .bdrow .k { color: var(--dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bdrow .v { font-variant-numeric: tabular-nums; }

  /* 提问卡片（AskUserQuestion / 权限请求） */
  .ask {
    border: 1px solid rgba(210,153,34,.55); border-radius: 14px; background: rgba(210,153,34,.07);
    padding: 11px 13px; margin: 10px 0; font-size: 13.5px;
  }
  .ask .q { margin: 2px 0 9px; }
  .ask button { margin: 3px 7px 3px 0; padding: 6px 14px; border-radius: 999px; font-size: 12.5px; }
  /* AskUserQuestion 提问卡增强（对照桌面 ElicitationDialog）：分区/选项行/复选/自定义输入 */
  .ask .askq { margin: 8px 0; padding: 8px 0 2px; border-top: 1px dashed var(--line); }
  .ask .askq:first-of-type { border-top: 0; }
  .ask .askhead { display: flex; align-items: center; gap: 7px; margin: 2px 0 7px; flex-wrap: wrap; }
  .ask .askhead b { font-size: 13.5px; }
  .ask .asktag {
    font-size: 10.5px; color: var(--dim); border: 1px solid var(--line);
    padding: 1px 7px; border-radius: 999px; background: var(--card);
  }
  .ask .askopt {
    display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left;
    margin: 4px 0; padding: 7px 10px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--line); font-size: 13px;
  }
  .ask .askopt.on { border-color: var(--accent); background: var(--tint); }
  .ask .askbox {
    flex: none; width: 14px; height: 14px; margin-top: 3px; border-radius: 4px;
    border: 1.5px solid var(--dim);
  }
  .ask .askopt.on .askbox { background: var(--accent); border-color: var(--accent); }
  .ask .askoptw { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ask .askoptl { font-weight: 500; }
  .ask .askoptd { color: var(--dim); font-size: 12px; }
  .ask .askinput {
    width: 100%; margin: 6px 0 2px; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 13px;
  }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px;
    background: var(--card); border: 1px solid var(--line); color: var(--fg);
    padding: 8px 16px; border-radius: 999px; z-index: 50; font-size: 13px; display: none;
    max-width: 86vw; text-align: center;
  }
  /* 会话切换过渡层：点击会话到历史渲染完成之间的即时反馈
     （POST /api/sessions 挂载会话+拉全量历史可能数秒，没有这层就是"点了没反应"）。
     z-index 30：盖住抽屉(20)，低于 toast(50) 与弹层(40+)。 */
  #switching {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.45); backdrop-filter: blur(2px);
  }
  #switching.on { display: flex; }
  #switching .card {
    background: var(--card); border: 1px solid var(--line); color: var(--fg);
    border-radius: 14px; padding: 14px 22px; font-size: 14px;
    display: flex; align-items: center; gap: 10px; max-width: 86vw;
  }
  #switching .card .ic { color: var(--dim); flex: none; }

  /* spinner 通用 */
  .spin { animation: rot 1s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ── Edit/Write 工具 diff 视图（对照桌面 ToolCallBlocks/renderers/edit.tsx 的
     inline diff 卡）：行级红绿 + 统计头。色彩走变量，浅色主题自动切换。 ── */
  .filediff {
    margin: 6px 0 2px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--code-bg); overflow: hidden;
  }
  .filediff .dhead {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 10px; border-bottom: 1px solid var(--line);
    font-size: 11.5px; color: var(--dim);
    background: color-mix(in srgb, var(--card) 55%, transparent);
  }
  .filediff .dhead .dstat-add { color: var(--diff-add-fg); font-weight: 600; }
  .filediff .dhead .dstat-del { color: var(--diff-del-fg); font-weight: 600; }
  .filediff .dbody { overflow-x: auto; }
  .filediff .dl {
    display: flex; align-items: stretch; font: 12px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace;
    white-space: pre;
  }
  .filediff .dl .ds {
    flex: none; width: 18px; text-align: center; user-select: none;
    color: var(--faint); background: color-mix(in srgb, var(--fg) 4%, transparent);
  }
  .filediff .dl .dc { flex: 1; padding: 0 8px; overflow-x: auto; }
  .filediff .dl.add { background: var(--diff-add-bg); }
  .filediff .dl.add .ds { color: var(--diff-add-fg); }
  .filediff .dl.add .dc { box-shadow: inset 2px 0 0 var(--diff-add-bar); }
  .filediff .dl.del { background: var(--diff-del-bg); }
  .filediff .dl.del .ds { color: var(--diff-del-fg); }
  .filediff .dl.del .dc { box-shadow: inset 2px 0 0 var(--diff-del-bar); text-decoration: none; }
  .filediff .dl.more { color: var(--faint); font-size: 11px; }
  /* 子代理嵌套工具行（对照桌面 agent.tsx 的缩进子卡）：挂在父工具展开体内 */
  details.tool.nested { margin: 4px 0 4px 10px; border-left: 2px solid var(--line); }

  /* ── 会话内查找栏（对照桌面 TaskFindDialog）── */
  #findBar {
    display: none; position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    z-index: 46; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 7px 10px; box-shadow: var(--shadow); width: min(560px, 94vw);
  }
  #findBar.on { display: flex; }
  #findBar .ic { color: var(--dim); flex: none; }
  #findBar input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    color: var(--fg); font-size: 13.5px; padding: 2px 0;
  }
  #findBar span { color: var(--dim); font-size: 12px; flex: none; }
  #findBar button {
    flex: none; border: 0; background: var(--btn-muted); color: var(--fg);

</style>

<script>
'use strict';
// token 通过 URL ?token= 携带，API 调用原样透传。
const TOKEN = new URLSearchParams(location.search).get('token') ?? '';
// 页面构建标记：抽屉底部可见（诊断"手机吃到旧页面"——App WebView 缓存曾致
// 服务端修复长期无法到达终端；新页面有此标记=代码最新）
const PAGE_BUILD = '2026-11-06.1';
const qs = (o) => Object.entries(o).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
const API = (p) => `/api/${p}${p.includes('?') ? '&' : '?'}${qs({token: TOKEN})}`;

const $ = (id) => document.getElementById(id);
const chat = $('chat'), composer = $('composer');

let curSession = null;      // 当前 sessionId
let es = null;              // EventSource
let busy = false;
let busySince = 0;          // 回合开始时间（elapsed 计时）
let elapsedTimer = null;
// 渲染模型：messageId → {role, el, bubble, parts: Map(partId→part数据), partEls: Map(partId→渲染元素)}
const msgEls = new Map();
const toolEls = new Map();  // toolCallId → {el, status, name, desc, body}
const thinkTimers = new Map(); // partId → 起始时间（思考行耗时统计）
// 排队消息（预备任务）：运行中发送 → 服务端入队，回合结束后由服务端自动
// 补发为下一回合。队列数据源在服务端（刷新不丢、页面关着也补发），
// 页面只做展示与取回（GET /queue + __ui:'queue' 事件同步）。

// ── App 桥协议 v2 ──
// 页面主动向 App 上报事件；App 可调用 window.__zcode 上的函数。
// 旧版 App（APK 未升级）仍走 DOM 约定：哨兵词仅在任务运行时出现在 #turnStatus 里。
window.__zcodeBridge = 2;
function notifyApp(handler, payload) {
  try { window.flutter_inappwebview?.callHandler(handler, payload); } catch { /* 非 App 环境忽略 */ }
}
// 任务状态上报：同时携带旧版 App 认识的 state 字段（'running'/'settled'）
// 与 v2 的 running 布尔，两代 App 桥都可用。
// v2.1（G14）：结算区分失败——lastTurnFailed 置位时 state='failed'（官方推送
// 五类事件的 task_failed 语义）。旧版 APK 的 handler switch 无 default，
// 'failed' 静默忽略 = 失败回合不再误报「任务已完成」（改善而非回退）；
// 新版 APK 走 showFailed 专属通知。DOM 桥（taskBridgeJs）同步升级双通道兜底。
function notifyTaskState(running) {
  notifyApp('onTaskState', { state: running ? 'running' : (lastTurnFailed ? 'failed' : 'settled'), running, sessionId: curSession });
}

// ── 待发附件（App 拍照/相册注入 + 页面「+ → 附件」通用文件）──
let pendingImage = null;
function showAttachChip() {
  const bar = $('attachBar');
  if (!pendingImage) { bar.style.display = 'none'; return; }
  $('attachName').textContent = `📎 ${pendingImage.name}（发送时上传到工作区）`;
  bar.style.display = 'flex';

// 自动滚底：用户上滚阅读历史（离底部 >140px）时不再强行拽回——
// 之前任何事件都无条件拽底，任务结束后往上拉就被弹回来（无法回看）。
// force=true 用于用户主动发送、打开会话这类"应当回到底部"的场景。
function nearBottom() { return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 140; }
// 回到底部悬浮按钮（对照桌面 ConversationBackToBottomButton）：上滑离底出现；
// 直播事件照常入流但不再拽用户回来，点按钮一键回直播尾部。不贴底期间
// 持续有新内容 → 亮小圆点（桌面同款无角标，手机端补的感知增强）
const b2b = $('b2b');
function updateB2B() {
  const scrollable = chat.scrollHeight > chat.clientHeight + 120;
  const away = scrollable && !nearBottom();
  b2b.classList.toggle('on', away);
  if (!away) b2b.classList.remove('dot');
}
function scrollBottom(force = false) {
  if (!force && !nearBottom()) {
    if (b2b.classList.contains('on')) b2b.classList.add('dot'); // 你在看别处，下面又长了新内容
    return;
  }
  requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
}
chat.addEventListener('scroll', updateB2B, { passive: true });
b2b.addEventListener('click', () => { b2b.classList.remove('dot'); scrollBottom(true); });

// 切会话滚动记忆（对照桌面 chatSessionScrollMemory）：非贴底阅读位在
// 切回来时恢复（按高度增量映射），贴底则照常跟最新。LRU 50 防增长。
const sessScrollMem = new Map(); // sessionId → { top, h, follow }
function rememberScroll(sid) {
  if (!sid || remoteView) return;
  if (chat.scrollHeight <= chat.clientHeight + 100) return; // 空会话/没滚动的无位可记
  sessScrollMem.delete(sid);
  sessScrollMem.set(sid, { top: chat.scrollTop, h: chat.scrollHeight, follow: nearBottom() });
  if (sessScrollMem.size > 50) sessScrollMem.delete(sessScrollMem.keys().next().value);
}
function restoreScroll(sid) {
  const mem = sessScrollMem.get(sid);
  if (!mem || mem.follow) return false;
  requestAnimationFrame(() => { // renderHistory 的 rAF 强滚底先注册先执行，这里后到覆盖
    const over = chat.scrollHeight - mem.h; // 两次渲染间新增的内容高度
    chat.scrollTop = Math.max(0, Math.min(mem.top + over, chat.scrollHeight - chat.clientHeight));
  });
  return true;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// ── Markdown 子集渲染（安全：全部 DOM 构造，零 innerHTML）──
// 块级：```代码块 / # 标题 / - * + 无序列表 / 1. 有序列表 / > 引用 / | 表格 | / --- 分隔线 / 段落
// 行内：`行内码` / **粗体** / *斜体* / ~~删除线~~ / ![图片](链接) / [文本](http链接) / 裸链接自动识别
function mdBlocks(container, seg) {
  const lines = String(seg).replace(/\r/g, '').split('\n');
  let para = [];   // 当前段落行
  let list = null; // 当前列表 {el, ordered}
  let quote = null;
  const flushPara = () => {
    if (!para.length) return;
    const p = el('div', 'md-p');
    mdInline(p, para.join('\n'));
    container.appendChild(p);
    para = [];
  };
  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();
    if (!t) { flushPara(); list = null; quote = null; continue; }
    let m = t.match(/^(#{1,4})\s+(.*)$/);
    if (m) {
      flushPara(); list = null; quote = null;
      container.appendChild(el('div', 'md-h' + m[1].length, m[2].replace(/\s*#+\s*$/, '')));
      continue;
    }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) {
      flushPara(); list = null; quote = null;
      container.appendChild(el('hr', 'md-hr'));
      continue;
    }
    m = t.match(/^>\s?(.*)$/);
    if (m) {
      flushPara(); list = null;
      if (!quote) { quote = el('blockquote', 'md-quote'); container.appendChild(quote); }
      const qp = el('div', 'md-p');
      mdInline(qp, m[1]);
      quote.appendChild(qp);
      continue;
    }
    // 表格：| 单元格 | 行 + 下一行 |---|---| 分隔（支持 :--- 对齐标记）
    if (/^\|/.test(t) && /\|/.test(t.slice(1)) &&
        i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1].trim())) {
      flushPara(); list = null; quote = null;
      const rows = [];
      let j = i;
      while (j < lines.length && /^\s*\|/.test(lines[j])) { rows.push(lines[j].trim()); j++; }
      const cellsOf = (r) => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
      const alignOf = (c) => c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : '';
      if (rows.length >= 2) {
        const head = cellsOf(rows[0]);
        const align = cellsOf(rows[1]).map(alignOf);
        const wrap = el('div', 'md-tblwrap');
        const tbl = el('table', 'md-table');
        const thead = el('thead');
        const trh = el('tr');
        head.forEach((c, ci) => {
          const th = el('th');
          if (align[ci]) th.style.textAlign = align[ci];
          mdInline(th, c);
          trh.appendChild(th);
        });
        thead.appendChild(trh);
        tbl.appendChild(thead);
        const tb = el('tbody');
        for (const r of rows.slice(2)) {
          const cs = cellsOf(r);
          const tr = el('tr');
          head.forEach((_, ci) => {
            const td = el('td');
            if (align[ci]) td.style.textAlign = align[ci];
            mdInline(td, cs[ci] ?? '');
            tr.appendChild(td);
          });
          tb.appendChild(tr);
        }
        tbl.appendChild(tb);
        wrap.appendChild(tbl);
        container.appendChild(wrap);
        i = j; // 本块已消费到第 j 行（循环再 i++）
        continue;
      }
    }
    m = t.match(/^[-*+]\s+(.*)$/);
    if (m) {
      flushPara(); quote = null;
      if (!list || list.ordered) { list = { el: el('ul', 'md-list'), ordered: false }; container.appendChild(list.el); }
      const li = el('li');
      mdInline(li, m[1].replace(/\[( |x)\]\s*/i, (mm, c) => (c.toLowerCase() === 'x' ? '✓ ' : '□ ')));
      list.el.appendChild(li);
      continue;
    }
    m = t.match(/^\d+[.)]\s+(.*)$/);
    if (m) {
      flushPara(); quote = null;
      if (!list || !list.ordered) { list = { el: el('ol', 'md-list'), ordered: true }; container.appendChild(list.el); }
      const li = el('li');
      mdInline(li, m[1]);
      list.el.appendChild(li);
      continue;
    }
    para.push(lines[i]);
    if (list) list = null; // 列表后的非列表行结束列表
  }
  flushPara();
}

// ── 轻量语法高亮（零依赖，对照官方代码高亮的移动端取舍版）──
// 只做 注释/字符串/数字/关键字/函数名/标签 六类着色，常见语言族共用一套扫描器；

const HL_KEYWORDS = new Set(('break case catch class const continue debugger default delete do else export extends ' +

  'return set static super switch this throw try typeof var void while with yield async await enum namespace ' +
  'def elif except lambda pass raise global nonlocal assert del as is not and or in ' +
  'func go defer chan map struct type select package range fallthrough ' +
  'fn mut impl trait pub use mod match where dyn crate move box ' +
  'int float double char bool boolean string long short byte public class extends implements final abstract ' +

  if (/^(py|python|python3)$/.test(l)) return 'hash';
  if (/^(sh|bash|shell|zsh|console|powershell|ps1|dockerfile)$/.test(l)) return 'hash';
  if (/^(html|xml|svg|vue|svelte|htm)$/.test(l)) return 'markup';
  if (/^(css|scss|less)$/.test(l)) return 'css';
  if (/^(c|cpp|c\+\+|h|hpp|java|cs|csharp|go|rust|rs|kt|kotlin|swift|dart|php|rb|ruby|scala)$/.test(l)) return 'clike';
  if (/^sql$/.test(l)) return 'sql';

  hash: /#[^\n]*|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|\b\d+(?:\.\d+)?\b|[A-Za-z_$][\w$-]*/g,
  css: /\/\*[\s\S]*?\*\/|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|#[0-9a-fA-F]{3,8}\b|\b\d+(?:\.\d+)?(?:px|em|rem|%|vh|vw|s|ms|fr)?\b|@[a-zA-Z-]+|[.#]?[A-Za-z_-][\w-]*(?=\s*\{)|[A-Za-z_-][\w-]*(?=\s*:)/g,

  const frag = document.createDocumentFragment();
  let last = 0, m;
  const re = HL_RE[kind];
  re.lastIndex = 0;
  while ((m = re.exec(code)) !== null) {
    if (m.index > last) frag.appendChild(document.createTextNode(code.slice(last, m.index)));
    const tok = m[0], c = tok[0];

    } else if (c === '"' || c === "'" || c === '`') {

    } else if (kind === 'css' && (c === '#' || c === '@')) {

    last = re.lastIndex;

// 代码块构造：头部（语言标签 + 复制按钮）+ pre（保留 language-xxx class——
// App 代码查看器按此识别语言，见 richText 契约）
function buildCodeBlock(container, lang, code) {
  const wrap = el('div', 'codeblock');
  const head = el('div', 'cbhead');
  head.appendChild(el('span', 'cblang', lang || ''));
  const cp = el('button', 'cbcopy');
  cp.innerHTML = SVG.copy + '<span>复制</span>';
  cp.addEventListener('click', (ev) => {
    ev.stopPropagation();
    copyTextToClipboard(code);
    const lab = cp.querySelector('span');
    if (lab) { lab.textContent = '已复制'; setTimeout(() => { lab.textContent = '复制'; }, 1500); }
  });
  head.appendChild(cp);
  const pre = el('pre');
  if (lang) pre.className = 'language-' + lang;
  highlightCode(pre, code, lang);
  wrap.append(head, pre);
  container.appendChild(wrap);
}

// 富文本入口：代码块 + markdown 子集（安全优先，不引外部库）
// 行内新增 ![alt](图片链接) —— 图片在聊天流里直接渲染（官方同款）
function mdInline(parent, text) {
  const re = /`([^`]+)`|\*\*([^*]+)\*\*|\*([^*\s][^*]*)\*|~~([^~]+)~~|!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)|\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|(https?:\/\/[^\s<>（）【】，。；！？"'']+)/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
    if (m[1] !== undefined) parent.appendChild(el('code', 'inline', m[1]));
    else if (m[2] !== undefined) parent.appendChild(el('strong', '', m[2]));
    else if (m[3] !== undefined) parent.appendChild(el('em', '', m[3]));
    else if (m[4] !== undefined) parent.appendChild(el('del', '', m[4]));
    else if (m[5] !== undefined) {

      const img = el('img', 'md-img');
      img.src = m[6];
      img.alt = m[5] ?? '';

      parent.appendChild(img);
    } else if (m[7] !== undefined) {
      const a = el('a', 'mdlink', m[7]);
      a.href = m[8];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      parent.appendChild(a);
    } else if (m[9] !== undefined) {
      const a = el('a', 'mdlink', m[9]);
      a.href = m[9];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      parent.appendChild(a);
    }
    last = re.lastIndex;
  }
  if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));

// 富文本总入口：``` 代码块（带头部/复制/高亮）+ markdown 块级子集
function richText(container, text) {
  if (!chatMayHaveMath && (/\$\$[^$]/.test(String(text)) || /\\\(|\\\[/.test(String(text)))) chatMayHaveMath = true;
  const parts = String(text).split(/```/);
  parts.forEach((seg, i) => {
    if (i % 2 === 1) { // 代码块：首行语言名 → pre.language-xxx（App 代码查看器按此识别语言）
      const lang = (seg.match(/^[a-zA-Z0-9_+-]*/) ?? [''])[0];
      const code = seg.replace(/^[a-zA-Z0-9_+-]*\n/, '').replace(/\n$/, '');
      buildCodeBlock(container, lang, code);
    } else {
      mdBlocks(container, seg);
    }
  });
  scheduleEnhRich(); // mermaid/KaTeX 惰性增强（防抖，见下）
}

function toolIcon(name) {
  const k = String(name ?? '').toLowerCase();
  if (/bash|shell|terminal|command|exec/.test(k)) return SVG.terminal;
  if (/write|edit|patch|notebook/.test(k)) return SVG.file;
  if (/read|glob|grep|search|find|ls/.test(k)) return SVG.search;
  if (/web|fetch|http|browser/.test(k)) return SVG.globe;
  if (/task|agent|todo|plan/.test(k)) return SVG.brain;
  return SVG.gear;
}
const TOOL_LABELS = {
  bash: '终端', shell: '终端', terminal: '终端', command: '终端',
  write: '写入', edit: '编辑', multiedit: '编辑', 'multi-edit': '编辑', applypatch: '补丁', patch: '补丁',
  read: '读取', glob: '搜索', grep: '搜索', ls: '列表',
  webfetch: '网络', websearch: '网络', browser: '浏览器',
  task: '子任务', agent: '子任务', todowrite: '计划', todo: '计划',
};
function toolLabel(name) {
  const k = String(name ?? '').toLowerCase();
  return TOOL_LABELS[k] || (name || '工具');
}
function inputSummary(input) {
  if (!input || typeof input !== 'object') return '';
  // AskUserQuestion 的 questions[].question 也算摘要来源：否则提问行只剩
  // 红色工具名，用户连"问了什么"都看不到
  const q = Array.isArray(input.questions) ? input.questions[0]?.question : input.question;
  const v = input.command ?? q ?? input.file_path ?? input.filePath ?? input.path ?? input.url ?? input.query ?? input.pattern ?? input.prompt ?? '';
  return String(v).replace(/\s+/g, ' ').slice(0, 120);
}

// token 数格式化（官方：22.2万 / 100万）
function fmtWan(n) {
  n = Number(n) || 0;
  if (n >= 1e8) return (n / 1e8).toFixed(2) + '亿';
  if (n >= 1e4) return (n / 1e4).toFixed(1) + '万';
  return String(Math.round(n));
}

// ── 锚定弹层通用 ──

function closePops() {
  document.querySelectorAll('.pop.open').forEach((p) => p.classList.remove('open'));
  const cp = $('ctxPop');
  if (cp) cp.classList.remove('open');
}

function popRow(opt) {
  const b = el('button', 'mrow' + (opt.cls ? ' ' + opt.cls : '') + (opt.disabled ? ' disabled' : ''));
  if (opt.icon) { const i = el('span', 'mi'); i.innerHTML = opt.icon; b.appendChild(i); }
  const mt = el('div', 'mt');
  mt.appendChild(el('div', 't', opt.title));
  if (opt.desc) mt.appendChild(el('div', 'd', opt.desc));
  b.appendChild(mt);
  if (opt.trailing) b.appendChild(el('span', 'mck', opt.trailing));
  if (opt.checked) { const c = el('span', 'mck'); c.innerHTML = SVG.check; b.appendChild(c); }
  b.addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (opt.disabled) return;
    opt.onClick?.();
  });
  return b;
}

// 在锚点按钮上方弹出（超出屏高则贴底）；再点一次收起
function placePop(pop, anchor) {
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.left = Math.min(Math.max(8, r.left), window.innerWidth - pw - 8) + 'px';
  pop.style.top = 'auto';
  pop.style.bottom = Math.min(window.innerHeight - r.top + 8, Math.max(8, window.innerHeight - ph - 8)) + 'px';
}

function togglePop(pop, anchor, render) {
  const wasOpen = pop.classList.contains('open');
  closePops();
  if (wasOpen) return;
  render?.();
  pop.classList.add('open');
  placePop(pop, anchor);
}

document.addEventListener('click', (e) => {
  if (!(e.target instanceof Element) || !e.target.closest('.pop')) closePops();
});

// 当前模型信息面板：手机端没有模型管理界面（添加/管理在桌面端 ZCode 设置），
// 这里给出真实信息与复制入口，替代原先只弹 toast 的占位项
function showModelInfo() {
  openInfo('模型信息', () => {
    const body = $('infoBody');
    body.textContent = '';
    const cur = sessionSettings?.model?.current ?? {};
    const pid = String(cur.providerId ?? '');
    const mid = String(cur.modelId ?? '');
    const lvl = String(cur.reasoningLevel ?? '');
    const rows = [['显示名', $('modelName').textContent || mid || '未知'], ['Provider', pid], ['模型 ID', mid]];
    if (lvl) rows.push(['思考档位', lvl]);
    for (const [k, v] of rows) {
      const row = el('div', 'kv');
      row.appendChild(el('div', 'k', k));
      row.appendChild(el('div', 'v', v || '—'));
      body.appendChild(row);
    }
    if (pid || mid) {
      const wrap = el('div', 'kv');
      const btn = el('button', 'primary', '复制完整模型 ID');
      btn.addEventListener('click', async () => {
        const full = [pid, mid].filter(Boolean).join('/') + (lvl ? `\$${lvl}` : '');
        try { await navigator.clipboard.writeText(full); toast('已复制：' + full); }
        catch { toast(full); }
      });
      wrap.appendChild(btn);
      body.appendChild(wrap);
    }
    body.appendChild(el('div', 'sysline', '添加/管理模型请在桌面端 ZCode 设置中操作，手机端与引擎的模型列表实时同步。'));
  });
}
