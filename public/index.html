// ── 实时事件处理 ──

function handleZcodeEvent(ev) {
  lastSseEventAt = Date.now();
  // 会话守卫：切换会话瞬间旧流的在途事件不得渲染进新会话视图（串台）
  if (ev.sessionId && curSession && ev.sessionId !== curSession) return;
  // 页面中途打开/刷新时可能错过 turn.started（回合由桌面端等外部驱动）：
  // 收到任何回合内活动事件就恢复运行态，保证进度条/停止按钮/计时可见
  if (!busy && (ev.type === 'part.started' || ev.type === 'part.upserted' ||
      ev.type === 'part.delta' || ev.type === 'tool.updated')) {
    busySince = Date.now();
    setBusy(true);
    notifyTaskState(true);
    startLiveTimers();
  }
  switch (ev.type) {
    case 'turn.started': {
      const input = ev.payload?.input;
      // 限流自动重试的重发（inputId 带 __retry 标记）：同一内容的用户气泡
      // 首次失败前已渲染过，跳过回显避免"一条消息连发两个"
      const isRetryEcho = String(ev.payload?.inputId ?? '').startsWith('__retry');
      if (input && ev.payload?.inputVisibility !== 'hidden' && !isRetryEcho) {
        const mid = `user-${ev.seq}`;
        const m = ensureMsg(mid, 'user');
        m.bubble.textContent = String(input);
        sseUserEchoes.push({ mid, text: String(input), at: Date.now() });
        recentOwnInputs.push({ text: String(input), at: Date.now() });
        scrollBottom();
      }
      busySince = Date.now();
      busySource = 'sse';
      setBusy(true);
      notifyTaskState(true);
      startLiveTimers();
      break;
    }
    case 'part.started':
    case 'part.upserted': {
      const part = ev.payload?.part;
      if (!part?.messageId) break;
      let m = msgEls.get(String(part.messageId));
      const isNewMsg = !m;
      m = ensureMsg(String(part.messageId), 'assistant');
      // 用户输入的文本部件：不渲染。part 处理器把一切部件当 assistant 画，
      // 会把用户消息画成第二份（回显之外再多一个）；标记 ownPart 后由
      // dropMatchingUserEcho 在存储渲染时按文本对齐清理
      if (part.type === 'text' && (m.role === 'user' || (isNewMsg && isOwnInput(part.text)))) {
        m.role = 'user'; m.el.className = 'msg user'; m.ownPart = true;
        m.parts.set(part.partId, part);
        break;
      }
      const isNewPart = !m.parts.has(part.partId);
      m.parts.set(part.partId, part);
      // 思考完成 = 同一回合的下一个非思考部件到达：折叠所有展开中的思考
      if (isNewPart && part.type !== 'reasoning') collapseOpenThinks();
      if (part.type === 'text') {
        // 直播正文去重（与思考行同款，见 settleLiveText）：落库副本追平
        // 直播块前只记数据不渲染，否则同一段正文两块同步增长直到回合结束
        if (!settleLiveText(m)) break;
        const pid = String(part.partId);
        const pe = m.partEls.get(pid);
        if (pe && pe.raw === String(part.text ?? '')) break; // 未变化：不动 DOM
        if (pe) { streamRich(pe, part.text ?? ''); ensureMsgActions(m); } // 增长：走合帧，不整段重建
        else renderTextPart(m, pid, part.text ?? '');
      }
      else if (part.type === 'reasoning') {
        // 直播思考还在增长、落库副本未追平：只记录数据不渲染副本，
        // 否则同一思考出现两块（直播一块 + 落库一块），轮询清理前一直重复
        const live = m.partEls.get('__live-think');
        const liveLen = live ? (live.content?.textContent ?? '').length : 0;
        const t = String(part.text ?? '');
        if (live && t.length < liveLen) break;
        if (live) {
          live.el.remove();
          m.partEls.delete('__live-think');
          thinkTimers.delete('__live-think');
        }
        const pe = ensureThink(m, String(part.partId));
        if (t) pe.content.textContent = t;
        updateThinkPreview(pe);
      }
      else if (part.type === 'tool') {
        const st = part.state ?? {};
        if (String(part.tool ?? '').toLowerCase() === 'todowrite') {
          scheduleTodoRefresh();
        } else {
          toolCard(part.callId, part.tool, inputSummary(st.input) || st.title || '');
          setToolStatus(part.callId, st.status ?? 'pending', undefined, st.status === 'error' ? st.error : st.output);
        }
      }
      scrollBottom();
      break;
    }
    case 'part.delta': {
      const { messageId, partId, field, delta } = ev.payload ?? {};
      if (!delta) break;
      const m = msgEls.get(String(messageId));
      if (!m || m.role === 'user') break; // 用户消息部件不走 delta 渲染
      const p = { ...(m.parts.get(partId) ?? {}) };
      if (field === 'text' || field === undefined) p.text = (p.text ?? '') + delta;
      p.partId = partId;
      m.parts.set(partId, p);
      const pe = m.partEls.get(String(partId));
      if (pe?.kind === 'text') {
        streamRich(pe, p.text ?? '');
      } else if (pe?.kind === 'think') {
        pe.content.textContent = p.text ?? '';
        updateThinkPreview(pe);
      } else if (!pe && p.type === 'text') {
        if (!settleLiveText(m)) break;
        renderTextPart(m, String(partId), p.text ?? '');
      } else if (!pe && p.type === 'reasoning') {
        // 与思考行 upserted 分支同款去重：落库思考追平直播块才接管渲染
        const live = m.partEls.get('__live-think');
        const liveLen = live ? (live.content?.textContent ?? '').length : 0;
        const t = String(p.text ?? '');
        if (live && t.length < liveLen) break;
        if (live) { live.el.remove(); m.partEls.delete('__live-think'); thinkTimers.delete('__live-think'); }
        const peR = ensureThink(m, String(partId));
        peR.content.textContent = t;
        updateThinkPreview(peR);
      }
      scrollBottom();
      break;
    }
    case 'tool.updated': {
      const p = ev.payload ?? {};
      if (p.kind === 'batch') break;
      // TodoWrite 不渲染工具行，但刷新任务计划条
      if (String(p.toolName ?? '').toLowerCase() === 'todowrite') { scheduleTodoRefresh(); break; }
      // 工具开始执行 = 之前的思考已完成：折叠展开中的思考
      collapseOpenThinks();
      const id = p.toolCallId;
      const desc = inputSummary(p.input) || (p.toolName ?? '');
      toolCard(id, p.toolName, desc);
      if (p.kind === 'scheduled') setToolStatus(id, 'pending', undefined, p.input ? JSON.stringify(p.input, null, 1) : undefined);
      if (p.kind === 'started') setToolStatus(id, 'running', undefined, p.input ? JSON.stringify(p.input, null, 1) : undefined);
      if (p.kind === 'progress') setToolStatus(id, 'running', undefined, p.stdoutTail ?? p.stderrTail ?? p.outputPreview);
      if (p.kind === 'result') {
        setToolStatus(id, 'completed', undefined, typeof p.result === 'string' ? p.result : JSON.stringify(p.result, null, 1));
        // Write/Edit 结果带文件路径 → chip
        const s = JSON.stringify(p.result ?? {});
        const fp = s.match(/"(?:file_path|filePath|path)":"([^"]+)"/);
        if (fp) fileChip(toolEls.get(id)?.body ?? chat, fp[1]);
        if (fp) addTurnArtifact(fp[1]);
      }
      if (p.kind === 'error') setToolStatus(id, 'error', undefined, p.error ? JSON.stringify(p.error, null, 1) : undefined);
      break;
    }
    case 'turn.completed':
      purgeLiveStream();
      busySource = null;
      setBusy(false);
      stopLiveTimers();
      notifyTaskState(false);
      // 断流期间工具行可能停在 running：从存储补一次最终状态重绘。
      // 异步竞态守卫：await 期间用户切到别的会话时，旧会话的消息不得
      // 渲染进新会话视图（串台）——回调里校验会话未变才补绘。
      {
        const sidForRedraw = curSession;
        api(`sessions/${encodeURIComponent(curSession)}/messages?limit=10`)
          .then((r) => { if (curSession === sidForRedraw) renderTail(r.messages ?? []); })
          .catch(() => {});
      }
      loadPlan();
      loadUsage(true);
      refreshSettings(false); // 回合结束后上下文占用变了：刷新模型旁的容量环
      loadAllSessions();
      refreshQueue();
      break;
    case 'turn.failed': {
      purgeLiveStream();
      busySource = null;
      lastTurnFailed = true;
      setBusy(false);
      stopLiveTimers();
      notifyTaskState(false);
      loadAllSessions();
      // 429/余额类错误给人话提示（账户被占用或资源包耗尽是移动端最常见失败）
      const raw = String(ev.payload?.error ?? '未知错误');
      const friendly = /1113|insufficient balance|resource package|\b429\b/i.test(raw)
        ? '模型账户额度不足或资源包耗尽（HTTP 429）。同一账户的任务正在跑时新会话可能被限流——等当前任务完成、前往平台充值，或在模型菜单切换其他模型后重试。'
        : raw;
      const e = el('div', 'errline', `回合失败：${friendly}`);
      chat.appendChild(e); scrollBottom();
      break;
    }
    case 'permission.requested': {
      // autoAnswer=ask 时才会看到；渲染批准卡片（按钮文案匹配 App 审批检测）
      const card = el('div', 'ask');
      card.appendChild(el('div', 'q', `请求权限：${ev.payload?.toolName ?? ''}（${ev.payload?.riskLevel ?? ''}） ${ev.payload?.reason ?? ''}`));
      const ok = el('button', 'primary', '批准');
      const no = el('button', 'danger', '拒绝');
      ok.addEventListener('click', () => answerInteraction(ev.payload?.requestId, { decision: 'allow' }, card));
      no.addEventListener('click', () => answerInteraction(ev.payload?.requestId, { decision: 'deny', reason: '用户拒绝' }, card));
      card.append(ok, no);
      chat.appendChild(card); scrollBottom();
      break;
    }
    case 'userInput.requested': {
      const p = ev.payload ?? {};
      const card = el('div', 'ask');
      card.appendChild(el('div', 'q', p.prompt ?? p.questions?.[0]?.question ?? 'Agent 提问'));
      for (const q of p.questions ?? []) {
        for (const opt of q.options ?? []) {
          const b = el('button', '', opt.label ?? opt.value);
          b.addEventListener('click', () => answerInteraction(p.requestId, { action: 'accept', content: { answer: opt.value } }, card));
          card.appendChild(b);
        }
      }
      chat.appendChild(card); scrollBottom();
      break;
    }
    case 'model.streaming': {
      // 官方同款逐字流式：引擎的 token 级直播 chunk（legacy 通道只透传该事件，
      // 文本部件要到回合结束才持久化）。text_delta → 正文直播累积；
      // reasoning_delta → 思考行直播。回合结束 purgeLiveStream 清理直播元素，
      // 由存储渲染的真实部件接管。
      // ⚠️ 只认 text_delta / reasoning_delta：tool_input_delta 等其余 kind 是
      // 工具参数 JSON 直播（引擎 kind 全集含 tool_input_start/delta/end、
      // tool_call 等），落进正文就是对话流里的 {"command":...} 夹杂。
      const p = ev.payload ?? {};
      const delta = String(p.delta ?? '');
      const mid = String(p.assistantMessageId ?? '');
      if (!delta || !mid) break;
      const kind = String(p.kind ?? 'text_delta');
      if (kind !== 'text_delta' && kind !== 'reasoning_delta') break;
      const m = ensureMsg(mid, 'assistant');
      // 部件通道是唯一事实来源（对齐桌面官方）：引擎已推送同类真实部件
      // （DOM 已渲染、或数据已落 m.parts 但渲染被 settle 押后）时，token
      // 直播块一律不再创建/增长——冻结等 settle 追平交接。直播块只剩
      // legacy 引擎（只发 token 流、部件回合末才落库）兜底这一条路。
      const liveKey = kind === 'reasoning_delta' ? '__live-think' : '__live-text';
      const domKind = kind === 'reasoning_delta' ? 'think' : 'text';
      const dataKind = kind === 'reasoning_delta' ? 'reasoning' : 'text';
      let hasReal = false;
      for (const [k, v] of m.partEls) {
        if (k !== liveKey && v.kind === domKind) { hasReal = true; break; }
      }
      if (!hasReal) {
        for (const pt of m.parts.values()) {
          if (pt?.type === dataKind) { hasReal = true; break; }
        }
      }
      if (hasReal) break;
      if (kind === 'reasoning_delta') {
        const pe = ensureThink(m, '__live-think');
        pe.content.textContent += delta;
        updateThinkPreview(pe);
      } else {
        let pe = m.partEls.get('__live-text');
        if (!pe) {
          const div = el('div');
          div.__partId = '__live-text';
          m.bubble.appendChild(div);
          pe = { kind: 'text', el: div, full: '' };
          m.partEls.set('__live-text', pe);
        }
        pe.full = (pe.full ?? '') + delta;
        streamRich(pe, pe.full);
        ensureMsgActions(m);
      }
      scrollBottom();
      break;
    }
    case 'session.titleUpdated': {
      const t = ev.payload?.title ?? ev.payload?.session?.title;
      if (t) setSessionTitle(t);
      break;
    }    case 'session.closed': {
      busySource = null;
      setBusy(false);
      toast('会话已关闭');
      break;
    }
    default: break;
  }
}

// 清理 token 流式直播元素：回合结束后由存储渲染的真实部件接管
function purgeLiveStream() {
  for (const m of msgEls.values()) {
    for (const key of ['__live-text', '__live-think']) {
      const pe = m.partEls.get(key);
      if (pe) { pe.el.remove(); m.partEls.delete(key); }
    }
  }
  thinkTimers.delete('__live-think');
}

// 直播正文去重：引擎对同一回合同时发 token 直播（model.streaming →
// __live-text 累积块）与部件落库（part.upserted/delta → 真实 partId），
// 两路都渲染就是同一段正文出现两块、同步增长直到回合结束（思考行早有
// 同款去重，正文漏了——这就是"对话过程大量重复输出"的根因）。
// 落库文本总长追平直播块前返回 false（调用方只记数据不渲染副本），
// 追平后移除直播块、返回 true 由真实部件接管。
function settleLiveText(m) {
  const live = m.partEls.get('__live-text');
  if (!live) return true;
  const liveLen = String(live.full ?? '').length;
  if (!liveLen) { live.el.remove(); m.partEls.delete('__live-text'); return true; }
  let done = 0;
  for (const p of m.parts.values()) {
    if (p?.type === 'text') done += String(p.text ?? '').length;
  }
  if (done < liveLen) return false;
  live.el.remove();
  m.partEls.delete('__live-text');
  return true;
}

// 流式正文合帧：每来一个 token 就对整段累积文本重跑 markdown 解析是 O(n²)
// （长回复在手机 WebView 上肉眼可见卡顿）。60ms 合并多次增量渲染一次；
// 权威渲染（renderTextPart）与直播块清理会取消挂起任务，最终状态以落库
// 部件为准，节流不会吞尾字。
const richTimers = new Map(); // pe → setTimeout 句柄
function streamRich(pe, text) {
  pe.__pending = text;
  if (richTimers.has(pe)) return;
  richTimers.set(pe, setTimeout(() => {
    richTimers.delete(pe);
    const t = pe.__pending;
    pe.__pending = null;
    if (t != null && pe.el.isConnected) { pe.el.textContent = ''; richText(pe.el, t); scrollBottom(); }
  }, 60));
}
function flushStreamRich(pe) {
  const t = richTimers.get(pe);
  if (t) { clearTimeout(t); richTimers.delete(pe); }
  pe.__pending = null;
}

function handleUiEvent(p) {
  // 会话守卫：异会话的交互事件不渲染进当前视图（串台）
  if (p.sessionId && curSession && p.sessionId !== curSession) return;
  // 服务端 ui 推送以 __ui 标记类型（历史字段 kind 仅权限事件携带，两者都查）
  if (p.kind === 'permission' && p.pending) {
    const card = el('div', 'ask');
    card.appendChild(el('div', 'q', `权限请求：${p.toolName ?? ''} ${p.reason ?? ''}`));
    const ok = el('button', 'primary', '批准');
    const no = el('button', 'danger', '拒绝');
    ok.addEventListener('click', () => answerInteraction(p.requestId, { decision: 'allow' }, card));
    no.addEventListener('click', () => answerInteraction(p.requestId, { decision: 'deny', reason: '用户拒绝' }, card));
    card.append(ok, no);
    chat.appendChild(card); scrollBottom();
  }
  // 服务端自动重试提示（429 限流退避等）
  if ((p.kind === 'note' || p.__ui === 'note') && p.text) {
    chat.querySelectorAll('.sysline[data-retry]').forEach((n) => n.remove());
    const note = el('div', 'sysline', p.text);
    note.dataset.retry = '1';
    chat.appendChild(note); scrollBottom();
    toast(p.text);
  }
  // 队列状态对齐（入队/补发/取回/删除都由服务端推送 __ui:'queue'）
  if (p.kind === 'queue' || p.__ui === 'queue') renderQueue(p.queue ?? []);
  if (p.expired) toast('交互请求已超时自动拒绝');
}

async function answerInteraction(requestId, answer, card) {
  try {
    await api(`interactions/${encodeURIComponent(requestId)}`, { method: 'POST', body: JSON.stringify(answer) });
    if (card) card.remove();
  } catch (e) { toast(`应答失败：${e.message}`); }
}

// ── SSE 连接 ──
// afterSeq：首连从服务端 lastSeq 起只收新事件（历史已由 /messages 渲染，避免重放
// 造成文本重复）；断线自动重连后做一次全量重同步（历史重渲染对齐状态）。

let streamEverOpened = false;

function connectStream(sessionId, afterSeq = -1) {
  if (es) { es.close(); es = null; }
  streamEverOpened = false;
  es = new EventSource(`/api/sessions/${encodeURIComponent(sessionId)}/stream?afterSeq=${afterSeq}&token=${encodeURIComponent(TOKEN)}`);
  es.onopen = () => {
    if (streamEverOpened) resync();
    streamEverOpened = true;
  };
  es.addEventListener('zcode', (e) => { try { handleZcodeEvent(JSON.parse(e.data)); } catch {} });
  es.addEventListener('ui', (e) => { try { handleUiEvent(JSON.parse(e.data)); } catch {} });
  es.addEventListener('reset', () => {
    // 服务重启：引擎会话全部失效，自动 resume 恢复（轮询兜底）
    busySource = null;
    setBusy(false);
    ensureResumed();
  });
  es.onerror = () => { /* EventSource 自动重连，onopen 里重同步 */ };
}

async function resync() {
  if (!curSession) return;
  const sid = curSession;
  try {
    const r = await api(`sessions/${encodeURIComponent(sid)}/messages`);
    // 异步竞态守卫：await 期间用户已切换会话 → 旧会话全量历史不得渲染进
    // 新会话视图（串台）。SSE 断线重连瞬间正好叠加快速切换会话时必现。
    if (curSession !== sid) return;
    renderHistory(r.messages ?? []);
  } catch { /* 下次重连再试 */ }
}

// 增量渲染消息尾部：复用既有消息/部件元素（与 SSE 流式路径同一套更新器），
// 不清空历史、不丢滚动位置。轮询跟随专用——整页重建是「刷新滞后」的主因。
// 消息全文（user 去重对齐用）：text 部件按序拼接
function messageText(msg) {
  return (msg.parts ?? []).filter((p) => p.type === 'text').map((p) => p.text ?? '').join('\n');
}

// 落库渲染用户消息前，移除同文本的 SSE 回显气泡（60 秒窗口内）与
// part 事件误建的用户消息副本（ownPart），消除"一条消息多个气泡"
function dropMatchingUserEcho(text) {
  const now = Date.now();
  sseUserEchoes = sseUserEchoes.filter((e) => now - e.at < 60000);
  const idx = sseUserEchoes.findIndex((e) => e.text === text);
  if (idx >= 0) {
    const e = sseUserEchoes.splice(idx, 1)[0];
    const m = msgEls.get(e.mid);
    if (m) { m.el.remove(); msgEls.delete(e.mid); }
  }
  const norm = String(text ?? '').replace(/\s+/g, ' ').trim();
  if (!norm) return;
  for (const [id, mm] of [...msgEls]) {
    if (!mm.ownPart) continue;
    const t = [...mm.parts.values()].filter((p) => p.type === 'text').map((p) => p.text ?? '').join('\n');
    if (t.replace(/\s+/g, ' ').trim() === norm) { mm.el.remove(); msgEls.delete(id); }
  }
}

function renderTail(messages) {
  let changed = false;
  for (const msg of messages) {
    // 合成消息（TodoWrite 提醒/<task-notification>/<subagent-message>）：
    // 跳过渲染，并移除可能已被 SSE 实时路径画出来的气泡（自愈）
    if (isHiddenMessage(msg?.info)) {
      const hid = String(msg.info?.messageId ?? msg.info?.id ?? '');
      const hm = hid && msgEls.get(hid);
      if (hm) { hm.el.remove(); msgEls.delete(hid); changed = true; }
      continue;
    }
    const role = msg.info?.role ?? 'assistant';
    const mid = String(msg.info?.messageId ?? msg.info?.id ?? Math.random());
    if (role === 'user') dropMatchingUserEcho(messageText(msg));
    const m = ensureMsg(mid, role === 'user' ? 'user' : 'assistant');
    // 直播思考块去重：存储里的思考"追平"了直播内容（同一段思考已完成落库）
    // 才移除直播块——按内容长度比较而非"存在 reasoning 段就删"，否则多段
    // 思考回合（思考→工具→思考…）里后续直播思考会被每次轮询误删（闪烁丢字）
    const liveThink = m.partEls.get('__live-think');
    if (liveThink) {
      const liveLen = (liveThink.content?.textContent ?? '').length;
      const storageLen = Math.max(0, ...(msg.parts ?? [])
        .filter((p) => p.type === 'reasoning')
        .map((p) => (p.text ?? '').length));
      if (storageLen >= liveLen && storageLen > 0) {
        liveThink.el.remove();
        m.partEls.delete('__live-think');
        thinkTimers.delete('__live-think');
      }
    }
    // 直播正文去重（与思考块同款）：存储文本总长追平直播块前不渲染落库正文，
    // 否则直播块 + 落库副本两份同步增长（对话过程大量重复输出的根因之一）
    const liveTextOk = settleLiveText(m);
    for (const part of msg.parts ?? []) {
      switch (part.type) {
        case 'text': {
          if (!liveTextOk) break;
          const pid = String(part.partId ?? mid + '-t');
          const pe = m.partEls.get(pid);
          if (pe && pe.raw === String(part.text ?? '')) break; // 未变化：跳过整段重建（轮询高频入口）
          if (pe) { streamRich(pe, part.text ?? ''); ensureMsgActions(m); } // 增长：合帧渲染，权威重建由回合收尾兜底
          else renderTextPart(m, pid, part.text ?? '');
          changed = true;
          break;
        }
        case 'reasoning': {
          const pidR = String(part.partId ?? mid + '-r');
          const existedR = m.partEls.has(pidR);
          const pe = ensureThink(m, pidR);
          pe.content.textContent = part.text ?? '';
          updateThinkPreview(pe);
          if (!existedR) thinkTimers.delete(pidR); // 存储整段落库的思考无真实起始时刻，不冒充"持续了 X 秒"
          changed = true;
          break;
        }
        case 'tool': {
          const st = part.state ?? {};
          // TodoWrite 不渲染工具行，但刷新任务计划条
          if (String(part.tool ?? '').toLowerCase() === 'todowrite') { scheduleTodoRefresh(); break; }
          // 工具行到达 = 之前的思考已完成：折叠展开中的思考
          collapseOpenThinks();
          const card = toolCard(part.callId, part.tool, inputSummary(st.input) || st.title || '');
          const status = st.status ?? 'pending';
          const detail = status === 'error' ? st.error : st.output;
          setToolStatus(part.callId, status, undefined, detail);
          const fp = st?.input?.file_path ?? st?.input?.filePath ?? st?.input?.path;
          if (fp) fileChip(card.body, String(fp));
          if (fp && status === 'completed') addTurnArtifact(String(fp));
          changed = true;
          break;
        }
        default: break;
      }
    }
  }
  if (changed) scrollBottom();
}

// 轮询跟随：探测最近几条消息的指纹，变化才增量渲染尾部。
// 桌面端驱动的回合没有 SSE 事件，靠这里实现手机端近实时同步（1.2s 探测）。
//
// 收敛自愈（以存储为准，任何运行态都必须能退出，否则就是"永久转圈"）：
// - busy 期间存储显示回合已收尾（最后部件 step-finish）且无任何活动
//   （SSE 静默 + 存储无变化）超过 30 秒 → 强制复位。
//   覆盖 SSE 断流后 turn.completed 丢失导致的不收敛。
// - SSE 存活时事件持续刷新 lastSseEventAt，步骤间隙不会误判
//   （工具执行期事件也在流，且存储里工具部件停在 running，finished=false）。
async function pollTick() {
  if (!curSession) return;
  // 本次探测的目标会话快照：await 之后凡是渲染/复位类副作用都必须确认
  // 用户没有切走（切换会话后旧会话的探测结果落到新会话视图 = 串台）
  const sid = curSession;
  if (document.hidden) return; // WebView 后台会暂停定时器，回前台自然补一次
  // 版本漂移检测（每 ~20 次探测一次，约 25 秒）：服务端页面更新后自动刷新，
  // 否则手机一直跑内存里的旧 JS，页面级修复永远到不了终端
  if (++pollCount % 20 === 0) {
    try {
      const st = await api('state');
      if (serverBuildHash === null) serverBuildHash = st.pageBuild;
      else if (st.pageBuild && st.pageBuild !== serverBuildHash) {
        toast('页面已更新，正在刷新…');
        setTimeout(() => location.reload(), 600);
        return;
      }
    } catch { /* 下次再试 */ }
  }
  try {
    const probe = await api(`sessions/${encodeURIComponent(sid)}/messages?limit=10`);
    if (curSession !== sid) return; // await 期间已切换会话：本次探测作废（防串台）
    const msgs = probe.messages ?? [];
    const fp = fingerprint(msgs);
    const finished = turnLooksFinished(msgs);
    const quietMs = Date.now() - Math.max(lastActivity, lastSseEventAt);
    if (fp === lastFingerprint) {
      // 无存储变化。收敛主路径：step-finish 稳定 6 秒 → 复位（对 sse/inferred
      // 一视同仁——SSE 断流后 turn.completed 丢失时同样 6 秒自愈，不必等 30 秒。
      // 此前该逻辑写在「指纹变化」分支里，指纹一稳定就永远走不到——
      // turn.completed 复位后 pollTick 又把 busy 拉回来，实际收敛全靠
      // 30 秒静默兜底，实测转圈拖到 72 秒。）
      if (busy && finished) {
        if (!finishedSince) finishedSince = Date.now();
        if (Date.now() - finishedSince >= 6000) {
          finishedSince = 0;
          renderTail(msgs);
          purgeLiveStream(); // SSE 断流错过 turn.completed：直播残留（如误渲染的工具参数）在此清掉
          busySource = null;
          setBusy(false);
          notifyTaskState(false);
          refreshQueue();
          loadAllSessions();
          return;
        }
      }
      // busy 超过 30 秒且回合已收尾 → 兜底复位（补一次尾部重绘，
      // 修正断流期间停留在 running 的工具行）
      if (busy && finished && quietMs > 30000) {
        renderTail(msgs);
        purgeLiveStream();
        busySource = null;
        setBusy(false);
        notifyTaskState(false);
        refreshQueue();
        loadAllSessions();
        return;
      }
      // 收敛兜底：存储指纹稳定 45 秒仍 busy → 复位。覆盖"被取消/中断的
      // 回合最后部件永远停在 tool:running"的场景（取消不写 step-finish，
      // finished 永远 false）。代价：桌面驱动回合里超 45 秒无存储写入的
      // 长工具会短暂显示空闲——下一条存储写入即恢复运行态，可自愈
      if (busy && quietMs > 45000) {
        renderTail(msgs);
        purgeLiveStream();
        busySource = null;
        setBusy(false);
        notifyTaskState(false);
        refreshQueue();
        loadAllSessions();
        return;
      }
      return;
    }
    lastActivity = Date.now();
    // 指纹变化但回合已收尾：不进入运行态（回合结束落库的那次指纹变化
    // 若触发置 busy，会与 turn.completed 的复位打架，转圈永不停止）
    if (!finished) finishedSince = 0;
    if (!busySource && !busy && !finished) {
      busySource = 'inferred';
      busySince = Date.now();
      setBusy(true);
      notifyTaskState(true);
      startLiveTimers();
    }
    renderTail(msgs);
    // SSE 驱动的回合也可能断流：存储已收尾且流静默 30 秒 → 兜底复位
    if (busy && busySource === 'sse' && finished && Date.now() - lastSseEventAt > 30000) {
      busySource = null;
      setBusy(false);
      notifyTaskState(false);
      refreshQueue();
      loadAllSessions();
    }
  } catch (e) {
    if (curSession !== sid) return; // 旧会话探测的异常不驱动新会话的 resume/复位
    // 服务端重启后引擎里没有这个会话（未 resume）：自动重新打开恢复
    if (/not active/i.test(String(e?.message ?? e))) {
      ensureResumed();
      // resume 窗口/失败期间 probe 全部抛异常，上方各"静默复位"分支根本
      // 执行不到——busy 会永久卡死（看桌面驱动会话、桥重启后必经此路径）。
      // 兜底：busy 且无任何活动超过 45 秒直接复位；resume 成功且会话复活
      // 后指纹变化会重新进入运行态，不会误伤真实运行中的任务
      if (busy && Date.now() - Math.max(lastActivity, lastSseEventAt) > 45000) {
        busySource = null;
        setBusy(false);
        notifyTaskState(false);
        refreshQueue();
      }
    }
  }
}

// 服务重启/引擎丢会话后自动 resume 当前会话（30 秒冷却防循环）
let resumingSession = false;
let lastResumeAt = 0;
let pollCount = 0;          // 轮询计数（版本漂移检测分频用）
let serverBuildHash = null; // 首次探测到的服务端页面指纹，变化即自动刷新
async function ensureResumed() {
  if (resumingSession || !curSession) return;
  if (Date.now() - lastResumeAt < 30000) return;
  resumingSession = true;
  lastResumeAt = Date.now();
  try {
    toast('服务已重启，正在重新连接会话…');
    await openSession(curSession);
  } catch { /* 下次轮询再试 */ } finally {
    resumingSession = false;
  }
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(pollTick, 1200);
}

// ── 排队消息（预备任务：运行中发送 → 服务端入队 → 回合结束自动补发）──

// ✎ 编辑取回的原条目：重发时按原位置插回（queue/replace），而不是追加到队尾。
// 取回会把条目从队列摘掉（避免回合结束被补发），所以位置要在取回前记住。
let queueEditId = null;
let queueEditIndex = 0;

function renderQueue(queue) {
  const bar = $('queueBar');
  bar.textContent = '';
  bar.style.display = queue?.length ? 'flex' : 'none';
  for (const item of queue ?? []) {
    const pill = el('div', 'qpill');
    pill.appendChild(el('span', 'qarr', '→'));
    pill.appendChild(el('span', 'qtext', item.text));
    // ✎：取回到输入框编辑（取消自动发送），改完重发按原位置插回
    const edit = el('button', 'qact', '✎');
    edit.title = '编辑：取回到输入框，重发后回到原位置';
    edit.addEventListener('click', async () => {
      let removed = true;
      try {
        await api(`sessions/${encodeURIComponent(curSession)}/queue/remove`, { method: 'POST', body: JSON.stringify({ id: item.id }) });
      } catch {
        removed = false; // 已不在队列（可能刚被发出）：同步药丸，避免残留死状态
        refreshQueue();
      }
      if (removed) {
        queueEditId = item.id;
        queueEditIndex = (queue ?? []).findIndex((q) => q.id === item.id); // 取回前的原始位置
      }
      composer.value = composer.value ? composer.value + '\n' + item.text : item.text;
      composer.dispatchEvent(new Event('input'));
      composer.focus();
    });
    pill.appendChild(edit);
    // ⚡：立即发出——先停当前回合，服务端停止完成后补发该项（其余队列保留）
    const zap = el('button', 'qact', '⚡');
    zap.title = '立即发送：打断当前任务，优先发出这条';
    zap.addEventListener('click', async () => {
      try {
        await api(`sessions/${encodeURIComponent(curSession)}/queue/send-now`, { method: 'POST', body: JSON.stringify({ id: item.id }) });
        toast('已请求停止当前任务，将立即发出该消息');
      } catch (e) {
        toast(`立即发送失败：${e.message}`);
        refreshQueue(); // 404=药丸已过期：立即对齐，别让用户对着幽灵条目点
      }
    });
    pill.appendChild(zap);
    // ✕：直接丢弃该排队项
    const x = el('button', 'qx', '✕');
    x.title = '删除该排队项';
    x.addEventListener('click', async () => {
      try {
        await api(`sessions/${encodeURIComponent(curSession)}/queue/remove`, { method: 'POST', body: JSON.stringify({ id: item.id }) });
      } catch { refreshQueue(); /* 药丸过期：同步服务端真实队列 */ }
    });
    pill.appendChild(x);
    bar.appendChild(pill);
  }
}

async function refreshQueue(sid) {
  const target = sid ?? curSession;
  if (!target) return;
  try {
    const r = await api(`sessions/${encodeURIComponent(target)}/queue`);
    if (target === curSession) renderQueue(r.queue ?? []);
  } catch { /* 服务端旧版本无此端点：忽略 */ }
}

async function doSend(text, sid) {
  const target = sid ?? curSession;
  // ✎ 编辑取回后的重发：原位替换原排队项（位置不变），而不是追加到队尾。
  // 原条目已不在队列（回合刚好结束把它发出了）→ 降级为普通发送路径。
  if (queueEditId && !sid) {
    const editId = queueEditId;
    const editIdx = queueEditIndex;
    queueEditId = null;
    try {
      const r = await api(`sessions/${encodeURIComponent(target)}/queue/replace`, { method: 'POST', body: JSON.stringify({ id: editId, text, index: editIdx }) });
      renderQueue(r.queue ?? []);
      toast('已替换原排队项（位置不变）');
      return true;
    } catch (e) {
      // 服务端异常才走这里（位置插回逻辑在服务端永远成功）：降级普通排队
      toast(`替换失败，已按新消息排队：${e.message}`);
    }
  }
  try {
    const r = await api(`sessions/${encodeURIComponent(target)}/send`, { method: 'POST', body: JSON.stringify({ content: text }) });
    if (r?.queued) {
      renderQueue(r.queue ?? []);
      toast('已排队：当前任务结束后自动发送（点击队列可取回）');
      return true;
    }
    busySince = Date.now();
    setBusy(true);
    recentOwnInputs.push({ text, at: Date.now() }); // part 事件里识别自己的输入部件用
    return true;
  } catch (e) {
    toast(`发送失败：${e.message}`);
    return false;
  }
}

// ── 发送 ──

async function send() {
  if (!curSession) { toast('先选择一个会话'); return; }
  let text = composer.value.trim();
  if (!text && !pendingImage) return;
  composer.value = '';
  composer.style.height = 'auto';
  updateSendButton(); // 已清空：运行中按钮回到停止态
  // 待发附件：先上传到当前工作区，消息里带上文件路径（模型工具可直接读取该文件）
  if (pendingImage) {
    const img = pendingImage;
    clearAttach();
    try {
      const r = await api('upload', { method: 'POST', body: JSON.stringify({ name: img.name, dataBase64: img.base64, workspace: curWs }) });
      const kind = /\.(png|jpe?g|webp|gif|bmp)$/i.test(img.name) ? '图片' : '文件';
      text = text ? `${text}\n\n[${kind}已保存到 ${r.path}]` : `请查看${kind} ${r.path}`;
    } catch (e) {
      toast(`附件上传失败：${e.message}`);
      return;
    }
  }
  // 忙碌与否都直接走服务端：服务端运行中自动入队（引擎 -32010 也会转排队）
  const ok = await doSend(text);
  if (ok) scrollBottom(true); // 用户主动发送：无论如何回到最新消息
  if (!ok) {
    composer.value = text;
    composer.dispatchEvent(new Event('input'));
  }
}

// data-theme 只存 'light'/'dark'（已解析），'auto' 跟随 matchMedia 实时切换；
// head 里的预应用脚本负责首帧不闪错主题，本模块负责交互与系统切换跟手。
const THEME_KEY = 'dshTheme';
const sysLightMQ = matchMedia('(prefers-color-scheme: light)');
function currentThemePref() {
  try {
    const v = localStorage.getItem(THEME_KEY);
    return v === 'light' || v === 'dark' ? v : 'auto';
  } catch { return 'auto'; }
}
function applyTheme() {
  const pref = currentThemePref();
  const resolved = pref === 'auto' ? (sysLightMQ.matches ? 'light' : 'dark') : pref;
  document.documentElement.dataset.theme = resolved;
  const mt = document.getElementById('metaTheme');
  if (mt) mt.content = resolved === 'light' ? '#f5f5f7' : '#0b0b0e';
}
sysLightMQ.addEventListener('change', () => {
  if (currentThemePref() === 'auto') applyTheme();
});
function renderThemeMenu() {
  const pop = $('themeMenu');
  pop.textContent = '';
  pop.appendChild(el('div', 'phead', '外观'));
  const cur = currentThemePref();
  for (const [v, t, d] of [
    ['auto', '跟随系统', '深浅色随系统昼夜切换'],
    ['light', '浅色', '始终使用浅色'],
    ['dark', '深色', '始终使用深色'],
  ]) {
    pop.appendChild(popRow({ title: t, desc: d, checked: cur === v, onClick: () => {
      try { localStorage.setItem(THEME_KEY, v); } catch { /* 隐私模式等：本次生效不持久 */ }
      applyTheme();
      closePops();
      toast(`外观：${t}`);

}

const FOLDER_SVG = '<svg class="ic sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4l2 2.5h8A1.5 1.5 0 0 1 20.5 9v8.5a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5v-11z"/></svg>';

// 相对时间（官方：刚刚 / 6分 / 1小时 / 4天）
function fmtRel(ts) {
  const diff = Date.now() - Number(ts ?? 0);
  if (!ts || diff < 0) return '';
  if (diff < 60e3) return '刚刚';
  if (diff < 3600e3) return `${Math.floor(diff / 60e3)}分`;
  if (diff < 86400e3) return `${Math.floor(diff / 3600e3)}小时`;
  return `${Math.floor(diff / 86400e3)}天`;
}

// 会话行操作单：锚定 ⋯ 按钮弹出（打开 / 归档或恢复 / 删除）
function closeSessPop() { $('sessPop').classList.remove('open'); }
function openSessPop(anchor, s) {
  const pop = $('sessPop');
  pop.textContent = '';
  const mk = (label, fn, cls) => {
    const b = el('button', cls ?? '', label);
    b.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      closeSessPop();
      await fn();
    });
    pop.appendChild(b);
  };
  mk('打开', () => openSession(s.sessionId, s.workspacePath));
  if (s.archived) mk('恢复', () => archiveSession(s.sessionId, false));
  else mk('归档', () => archiveSession(s.sessionId, true));
  mk('删除', async () => {
    if (!confirm(`删除会话「${s.title || '未命名'}」？\n消息与记录将一并删除，不可恢复。`)) return;
    if (s.sessionId === curSession) { openSession(null); }
    try {
      await api(`sessions/${encodeURIComponent(s.sessionId)}/delete`, { method: 'POST', body: '{}' });
      toast('已删除');
    } catch (e) { toast(`删除失败：${e.message}`); }
    loadAllSessions();
  }, 'danger');
  const r = anchor.getBoundingClientRect();
  // 视口内夹紧：drawer 内按钮也适用（fixed 相对视口）
  const w = 138, h = 140;
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
  pop.style.top = Math.max(8, Math.min(r.bottom + 4, window.innerHeight - h - 8)) + 'px';
  pop.classList.add('open');
}

    if (sid === curSession && archived) openSession(null);

function sessRow(s, projectPath) {
  const running = s.busy || s.status === 'running';
  const item = el('div', 'sess' + (s.sessionId === curSession ? ' cur' : ''));
  if (running) {
    const sp = el('span', 'busy'); sp.innerHTML = SVG.spin; sp.title = '任务运行中'; item.appendChild(sp);
  }
  const t = el('div', 't', s.title || '未命名会话');
  if (running) t.style.color = 'var(--fg)';
  item.appendChild(t);
  const time = el('span', 'time' + (running ? ' running' : ''), running ? '运行中' : fmtRel(s.updatedAt));
  item.appendChild(time);
  const more = el('button', 'smore', '⋯');
  more.title = '会话操作';
  more.addEventListener('click', (ev) => { ev.stopPropagation(); openSessPop(more, s); });
  item.appendChild(more);
  item.addEventListener('click', () => openSession(s.sessionId, projectPath));
  return item;
}

function renderProjectList() {
  const box = $('projList');
  box.textContent = '';
  // 分组：workspacePath → sessions[]（接口已按 updatedAt 降序）
  const groups = new Map();
  for (const s of allSessions) {
    const key = s.workspacePath ?? '';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  }
  // 项目全集 = 有会话的项目 ∪ config.workspaces，按最近会话时间排序（官方布局）
  const entries = [...groups.entries()];
  for (const w of workspaces) {
    const p = String(w.path ?? '');
    if (!entries.some(([k]) => k === p)) entries.push([p, []]);
  }
  entries.sort((a, b) => (b[1][0]?.updatedAt ?? 0) - (a[1][0]?.updatedAt ?? 0));
  if (!entries.length) { box.appendChild(el('div', 'sysline', '还没有项目和会话')); return; }
  for (const [p, sessions] of entries) {
    const isCur = p === curWs;
    const row = el('div', 'wsrow' + (isCur ? ' cur' : ''));
    const fi = el('span', 'mi'); fi.innerHTML = FOLDER_SVG; row.appendChild(fi);
    row.appendChild(el('div', '', projName(p)));
    if (isCur) { const d = el('span', 'dot'); d.style.marginLeft = 'auto'; row.appendChild(d); }
    row.addEventListener('click', () => switchWorkspace(p));
    box.appendChild(row);
    // 每个项目平铺最近 3 条会话，「显示更多」展开全量（官方交互）
    const expanded = !!projExpanded.get(p);
    const list = expanded ? sessions : sessions.slice(0, 3);
    for (const s of list) box.appendChild(sessRow(s, p));
    if (sessions.length > list.length) {
      const more = el('button', 'morebtn', `显示更多（还有 ${sessions.length - list.length} 条）`);
      more.addEventListener('click', () => { projExpanded.set(p, true); renderProjectList(); });
      box.appendChild(more);
    } else if (expanded && sessions.length > 3) {
      const less = el('button', 'morebtn', '收起');
      less.addEventListener('click', () => { projExpanded.set(p, false); renderProjectList(); });
      box.appendChild(less);
    }
  }
  // 已归档会话：折叠分组（官方交互），恢复/删除走行内 ⋯ 菜单
  if (archivedSessions.length) {
    const head = el('div', 'archsect');
    const chev = el('span', '', archExpanded ? '▾' : '▸');
    chev.style.color = 'var(--faint)';
    head.appendChild(chev);
    head.appendChild(el('b', '', `已归档（${archivedSessions.length}）`));
    head.style.cursor = 'pointer';
    head.addEventListener('click', () => { archExpanded = !archExpanded; renderProjectList(); });
    box.appendChild(head);
    if (archExpanded) {
      for (const s of archivedSessions.slice(0, 20)) {
        const row = sessRow({ ...s, archived: true }, s.workspacePath);
        box.appendChild(row);
      }
    }
  }
}

// ── 会话管理 ──

function setSessionTitle(t) {
  $('sessTitle').textContent = t || '未命名会话';
}

let openSeq = 0; // openSession 代际号：引擎 resume 可达分钟级，快速切换会话时
                 // 慢响应后到会把别的会话的消息渲染进来（串台），过期结果直接丢弃
// ── 会话切换过渡：点击即给反馈 ──
// openSession 的 POST /api/sessions 要挂载会话 + 拉全量历史，可能数秒；
// 没有过渡层时抽屉停在原地，用户以为"点了没反应"。
// openSeq 防串台纪律：只有最新一次 openSession 负责过渡层的展示与收起。
const switchingEl = $('switching');
const switchingText = $('switchingText');
function showSwitching(text) {
  switchingText.textContent = text;
  switchingEl.classList.add('on');
}
function hideSwitching() {
  switchingEl.classList.remove('on');
}

async function openSession(sessionId, wsPath) {
  const mySeq = ++openSeq;
  // 即时反馈：收抽屉/弹层 + 显示过渡层（成功失败都会收起，见下）
  const drawerWasOpen = $('drawer').classList.contains('open');
  $('drawer').classList.remove('open');
  closePops();
  showSwitching(sessionId ? '切换会话…' : '创建新会话…');
  try {
    // 打开已有会话：不传 workspace（引擎沿用会话自身所属项目，避免改绑）；
    // 新会话：落点为指定项目/当前项目。
    if (wsPath) {
      curWs = wsPath;
      try { localStorage.setItem('zcode.ws', curWs); } catch { /* 忽略 */ }
    }
    const body = sessionId ? { sessionId } : { sessionId: null, workspace: curWs };
    const r = await api('sessions', { method: 'POST', body: JSON.stringify(body) });
    if (mySeq !== openSeq) return; // 已有更新的打开请求，本次结果作废（防串台）
    curSession = r.sessionId;
    // 记录本页面最后查看的会话：下次启动优先恢复它（连续性，见 boot）
    try { localStorage.setItem('zcode.lastSession', curSession); } catch { /* 忽略 */ }
    // 计时基准全部按新会话重置，避免上一会话的静默/收尾状态串线
    lastSseEventAt = Date.now();
    lastActivity = Date.now();
    finishedSince = 0;
    setSessionTitle(r.title);
    // 切换会话：清掉上一个会话残留的运行文案（运行态在下面按新会话实况恢复）
    setActivity('');
    // 会话设置（模型/思考档位/权限模式）：快照里直接带出，立即同步底行按钮
    if (r.settings && !r.settings.unavailable) {
      sessionSettings = r.settings;
      curMode = r.settings.mode?.current ?? curMode;
    }
    syncComposerChrome();
    refreshSettings(false); // 异步补齐上下文环数据（projection 为 0 时走 goal 回退）
    // 运行态判断提前到 renderHistory 之前：全量重绘要据此决定是否保留
    // "最新思考展开"（忙碌回合的思考要跟着输出，不能折叠）
    const st = String(r.status ?? '').toLowerCase();
    const running = r.busy === true || st === 'running' || st === 'busy' || st === 'executing';
    // 外部（桌面端）驱动的回合：引擎 status 恒为 idle，但从存储里
    // 最后一条消息未以 step-finish 收尾可推断出"运行中"
    const foreignRunning = !running && turnLooksRunning(r.messages ?? []);
    renderHistory(r.messages ?? [], { keepThinkOpen: running || foreignRunning });
    // 恢复会话时对齐运行态：服务端 ring 为空（重启过）也能正确显示"运行中"
    if (running && !busy) {
      busySource = 'sse';
      busySince = r.busySince ?? Date.now();
      setBusy(true);
      notifyTaskState(true);
      startLiveTimers();
    } else if (foreignRunning && !busy) {
      busySource = 'inferred';
      busySince = Date.now();
      lastActivity = Date.now();
      setBusy(true);
      notifyTaskState(true);
      startLiveTimers();
    } else if (!running && !foreignRunning && busy && !sessionId) {
      busySource = null;
      setBusy(false);
    }
    // 只收新事件：历史已渲染，避免全量重放导致文本重复
    connectStream(curSession, r.lastSeq ?? -1);
    refreshQueue(curSession); // 排队消息（预备任务）随会话对齐
    curTodos = []; todoOpen = false; renderTodoBar(); refreshTodos(); // 任务计划随会话对齐
    queueEditId = null; // 编辑取回的原条目属于旧会话：清空替换追踪
    hideSwitching(); // 历史已渲染：过渡层在此收起（同帧呈现新会话内容）
    if (sessionId) toast('已恢复会话');
    renderProjectList();
    loadAllSessions();
    loadPlan();
  } catch (e) {
    if (mySeq !== openSeq) return; // 已被更新的打开请求接管：UI 由它负责
    hideSwitching();
    const msg = String(e?.message ?? e);
    // 会话已不存在（被清理/数据库重置）：清掉失效记忆并自动切换到其他会话，
    // 否则轮询会在这个死会话上 1.2s 一次无限打转（2026-10-04 实测）
    if (sessionId && /not found|not active/i.test(msg)) {
      allSessions = allSessions.filter((s) => s.sessionId !== sessionId);
      try { localStorage.removeItem('zcode.lastSession'); } catch { /* 忽略 */ }
      const fb = allSessions.find((s) => s.busy) ?? allSessions[0];
      if (fb && mySeq === openSeq) {
        toast('该会话已不存在，已切换到其他会话');
        await openSession(fb.sessionId, fb.workspacePath);
        return;
      }
    }
    // 打开失败：恢复抽屉让用户另选（过渡层已收起）
    if (drawerWasOpen) $('drawer').classList.add('open');
    toast(`打开会话失败：${msg}`);
  }
}

// ── 启动：自动恢复最近会话（优先运行中的会话，刷新后进度不丢）──

(async function boot() {
  try {
    const state = await api('state');
    // 输入卡模型名（官方：GLM-5.3-Flash ▾）
    const model = String(state.model ?? '');
    const mm = model.match(/\/([^$/]+)(?:\$|$)/);
    $('modelName').textContent = mm ? mm[1] : (model || 'ZCode');
    // 权限模式初始色（会话打开后以会话设置为准）
    curMode = String(state.mode ?? '');
    syncModeUi();
    await loadWorkspaces();
    await loadAllSessions();
    // 校正 localStorage 里的项目：已不存在时回落到最近会话的项目
    const knownPaths = new Set([
      ...allSessions.map((s) => s.workspacePath ?? ''),
      ...workspaces.map((w) => String(w.path ?? '')),
    ]);
    if (!knownPaths.has(curWs)) {
      curWs = allSessions[0]?.workspacePath ?? workspaces[0]?.path ?? '';
      try { localStorage.setItem('zcode.ws', curWs); } catch { /* 忽略 */ }
    }
    // 优先级：运行中的会话（任务进度必须可见，最高优先）>
    // 上次本页面查看的会话（连续性）> 最近一个（跨项目兜底）
    let lastSid = '';
    try { lastSid = localStorage.getItem('zcode.lastSession') ?? ''; } catch { /* 忽略 */ }
    const target =
      allSessions.find((s) => s.busy) ??
      allSessions.find((s) => s.sessionId === lastSid) ??
      allSessions[0];
    if (target) await openSession(target.sessionId, target.workspacePath);
    // 目标会话打开失败（如已被清理）：清掉失效记忆并回退到最近会话
    if (curSession !== (target?.sessionId ?? '')) {
      try { localStorage.removeItem('zcode.lastSession'); } catch { /* 忽略 */ }
      const fallback = allSessions.find((s) => s.sessionId !== target?.sessionId);
      if (fallback) await openSession(fallback.sessionId, fallback.workspacePath);
    }
    if (!curSession) $('drawer').classList.add('open');
    const pb = $('pageBuild');
    if (pb) pb.textContent = '页面版本 ' + PAGE_BUILD;
    startPolling();
  } catch (e) {
    toast(`初始化失败：${e.message}`);
    $('drawer').classList.add('open');
  }
})();
</script>
