<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ZCode · 任务会话</title>
<style>
  /* ── ZCode 官方风格设计令牌：近黑底 / 紫点缀 / 扁平行 ── */
  :root {
    --bg: #0b0b0e; --panel: #111114; --card: #191920; --line: #26262e;
    --fg: #e9e9ee; --dim: #85858f; --faint: #5c5c66;
    --accent: #7c5cff; --ok: #3fb950; --warn: #d29922; --err: #f85149;
    --bubble-user: #1f1f28;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  /* 桥哨兵词容器：对用户不可见，但 textContent 仍含哨兵词（旧版 App 桥检测用） */
  .vh { position: absolute; left: -9999px; top: auto; width: 1px; height: 1px; overflow: hidden; }
  svg.ic { width: 20px; height: 20px; flex: none; display: block; }
  svg.ic.sm { width: 15px; height: 15px; }

  /* ── 顶栏单行：菜单 + 会话名 + 用量 + 更多（对齐官方 zcode.z.ai 布局）── */
  header { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .navrow {
    display: flex; align-items: center; gap: 4px;
    padding: 6px 10px; padding-top: calc(6px + env(safe-area-inset-top));
  }
  .navrow .title {
    flex: 1; min-width: 0; font-size: 16px; font-weight: 650; letter-spacing: .01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .iconbtn {
    background: transparent; border: none; color: var(--dim);
    width: 36px; height: 36px; border-radius: 10px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .iconbtn:active { background: var(--card); color: var(--fg); }

  /* ── 消息流 ── */
  main { flex: 1; overflow-y: auto; padding: 14px 16px 10px; scroll-behavior: smooth; }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 16vh auto 0; color: var(--dim); }
  .hero .bigz {
    width: 60px; height: 60px; border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    color: #fff; font-size: 32px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 24px rgba(124,92,255,.3);
  }
  .hero .t1 { font-size: 19px; font-weight: 650; color: var(--fg); }
  .hero .t2 { font-size: 13px; }

  .msg { margin: 10px 0; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    max-width: 86%; background: var(--bubble-user); border-radius: 16px 16px 5px 16px;
    padding: 8px 13px; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  }
  .msg.assistant .bubble { word-break: break-word; overflow-wrap: anywhere; }
  .bubble pre {
    background: #08080b; border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; overflow-x: auto; font-size: 12.5px; margin: 8px 0;
    font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; line-height: 1.5;
  }
  .bubble code.inline {
    background: #1c1c24; padding: 1px 6px; border-radius: 6px; font-size: 13px;
    font-family: ui-monospace, Consolas, monospace;
  }

  /* ── 工具行（官方扁平样式：图标 + 名称/状态 + 命令摘要，点击展开输出）── */
  .tool { margin: 2px 0; border-radius: 9px; }
  .tool > summary {
    list-style: none; cursor: pointer; padding: 4px 6px; margin: 0 -6px;
    display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; border-radius: 9px;
  }
  .tool > summary::-webkit-details-marker { display: none; }
  .tool > summary:active { background: var(--card); }
  .tool .tico { color: var(--faint); flex: none; align-self: center; display: flex; }
  .tool .tname { color: var(--dim); flex: none; }
  .tool .tdesc {
    color: var(--dim); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
  }
  .tool.running .tstate, .tool.running .tico { color: var(--fg); }
  .tool.running .tdesc { color: var(--fg); }
  .tool.completed .tdesc, .tool.completed .tname { color: var(--faint); }
  .tool.error .tdesc, .tool.error .tname { color: var(--err); }
  .tool .tstate { flex: none; color: var(--faint); display: flex; align-items: center; }
  .tool .tbody { padding: 2px 10px 8px 30px; color: var(--dim); font-size: 12.5px; }
  .tool .tbody pre {
    max-height: 220px; overflow: auto; margin: 4px 0; background: #08080b;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px;
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
  }
  /* 思考行（官方：🧠 思考 · 持续了几秒） */
  details.think { margin: 2px 0; }
  details.think > summary {
    list-style: none; cursor: pointer; padding: 4px 6px; margin: 0 -6px; border-radius: 9px;
    display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--faint);
  }
  details.think > summary::-webkit-details-marker { display: none; }
  details.think > summary:active { background: var(--card); }
  details.think .tbody {
    padding: 2px 10px 8px 30px; color: var(--faint); font-size: 13px;
    white-space: pre-wrap; word-break: break-word;
  }

  /* 流末尾运行指示（官方：✳ 转圈） */
  .streamspin { padding: 8px 6px; color: var(--dim); display: flex; align-items: center; }

  .fileMention {
    display: inline-block; margin: 3px 6px 1px 0; padding: 3px 11px; border-radius: 999px;
    border: 1px solid rgba(124,92,255,.45); color: #b7a5ff; background: rgba(124,92,255,.10);
    font-size: 12.5px; cursor: pointer;
  }
  .errline { color: var(--err); font-size: 13.5px; margin: 8px 0; }
  .sysline { color: var(--faint); font-size: 12.5px; text-align: center; margin: 8px 0; }

  /* ── 运行状态条：视觉隐藏（官方无此条），但 DOM 保留——旧版 App 桥的
     哨兵词 span 仍随任务运行在此增删，运行态判定不受影响 ── */
  #turnStatus {
    display: none !important;
  }

  /* ── 排队消息气泡（官方：→ 药丸）── */
  #queueBar { padding: 0 14px 6px; display: none; flex-direction: column; gap: 6px; }
  .qpill {
    display: flex; align-items: center; gap: 9px; max-width: 94%;
    margin: 0 auto; background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 8px 7px 14px; font-size: 13px; color: var(--fg);
  }
  .qpill .qarr { color: var(--dim); flex: none; }
  .qpill .qtext { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qpill .qx {
    flex: none; background: transparent; border: none; color: var(--faint);
    width: 24px; height: 24px; border-radius: 999px; padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* ── 底部输入卡（官方：大圆角卡 + 底行图标/模型名/停止方块）── */
  footer {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .composer { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 10px 12px 8px; }
  textarea#composer {
    width: 100%; resize: none; background: transparent; color: var(--fg);
    border: none; outline: none; font: inherit; min-height: 24px; max-height: 140px; padding: 0;
  }
  textarea#composer::placeholder { color: var(--faint); }
  .crow { display: flex; align-items: center; gap: 3px; margin-top: 8px; }
  .crow .spacer { flex: 1; }
  .crow .cspin { color: var(--dim); display: none; align-items: center; }
  .crow.busy .cspin { display: inline-flex; }
  /* 上下文用量指示环（官方：模型名左侧的圆圈，点击看容量；busy 时旋转） */
  #btnCtx { padding: 0 3px; }
  #btnCtx .ctxsvg { width: 19px; height: 19px; }
  .crow.busy #btnCtx .ctxsvg { animation: rot 1.1s linear infinite; }
  #btnCtx.hot #ctxRing { stroke: var(--err); }
  /* 官方底行按钮组：+ 添加 / 盾牌权限模式 / 模型▾ / 思考档位▎ / 发送-停止 */
  .cbtn {
    background: transparent; border: none; color: var(--dim); cursor: pointer;
    height: 32px; min-width: 30px; padding: 0 5px; border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    font: inherit; font-size: 12.5px;
  }
  .cbtn:active { background: rgba(255,255,255,.07); color: var(--fg); }
  .cbtn svg.ic { width: 19px; height: 19px; }
  #btnMode.warn { color: var(--warn); }
  #btnMode.access { color: #f0883e; }
  #btnMode.ok { color: var(--ok); }
  #btnMode.accent { color: var(--accent); }
  #btnModel .mname { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #btnModel .caret { width: 12px; height: 12px; }
  #btnThink .lvlbar { width: 3px; height: 14px; border-radius: 2px; background: var(--faint); }
  #btnThink.lvl-mid .lvlbar { background: var(--warn); }
  #btnThink.lvl-max .lvlbar { background: var(--ok); }
  #btnSend {
    flex: none; width: 34px; height: 34px; border-radius: 11px; border: none; cursor: pointer;
    background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s ease;
  }
  #btnSend:disabled { background: #2c2c36; color: var(--faint); }
  #btnSend.stop { background: #2e2e38; color: var(--fg); }
  #btnSend.stop:active { background: #3a3a46; }

  button {
    background: var(--card); color: var(--fg); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 14px; font: inherit; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: transparent; border-color: rgba(248,81,73,.5); color: var(--err); }
  button:disabled { opacity: .45; }

  /* ── 抽屉（工作区/会话）与信息面板 ── */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 20; }
  .overlay.open { display: block; }
  #drawer .sheet {
    position: absolute; left: 0; top: 0; bottom: 0; width: min(82vw, 340px);
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  #drawer .sheet .head { padding: 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  #drawer .sheet .head b { flex: 1; }
  #info .sheet {
    position: absolute; right: 0; top: 0; bottom: 0; width: min(94vw, 440px);
    background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  #info .sheet .head { padding: 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  #info .sheet .head b { flex: 1; }
  .sheetbody { flex: 1; overflow-y: auto; padding: 8px; }
  .wsrow {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px;
    margin: 3px 0; cursor: pointer; border: 1px solid transparent; font-size: 13.5px;
  }
  .wsrow.cur { background: var(--card); border-color: rgba(124,92,255,.5); }
  .wsrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .wsrow.cur .dot { background: var(--ok); }
  .wsrow .p { color: var(--faint); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wsrow .mi { color: var(--dim); display: flex; flex: none; }
  /* 会话行：官方单行布局 —— [✳运行中?] 标题 …… 相对时间，整体随项目缩进 */
  .sess { display: flex; align-items: center; gap: 8px; margin-left: 18px; }
  .sess .t { flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .time { flex: none; color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .sess .busy { display: flex; color: var(--ok); flex: none; }
  .morebtn {
    display: block; width: calc(100% - 26px); margin: 0 0 4px 18px; padding: 6px 8px;
    background: transparent; border: none; color: var(--accent);
    font: inherit; font-size: 12.5px; text-align: left; cursor: pointer; border-radius: 8px;
  }
  .morebtn:active { background: var(--card); }
  .sect { padding: 12px 12px 4px; font-size: 12px; color: var(--faint); font-weight: 600; letter-spacing: .05em; }
  .sess { padding: 10px 12px; border-radius: 10px; margin: 4px 0; cursor: pointer; border: 1px solid transparent; }
  .sess:active, .sess.cur { background: var(--card); border-color: var(--line); }
  .sess .t { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .m { font-size: 12px; color: var(--faint); display: flex; gap: 8px; }
  .sess .busy { color: var(--ok); }
  .kv { display: flex; gap: 10px; padding: 7px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
  .kv .k { color: var(--dim); width: 42%; flex: none; overflow: hidden; text-overflow: ellipsis; }
  .kv .v { flex: 1; word-break: break-all; }
  .plug { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .plug .n { flex: 1; min-width: 0; }
  .plug .d { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctxbar { margin: 8px 12px 4px; }

  /* ⋯ 溢出菜单 */
  #moreMenu {
    position: fixed; z-index: 30; display: none; min-width: 148px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 5px; box-shadow: 0 8px 28px rgba(0,0,0,.5);
  }
  #moreMenu.open { display: block; }
  #moreMenu button {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    background: transparent; border: none; padding: 9px 11px; border-radius: 8px;
    font-size: 13.5px; color: var(--fg);
  }
  #moreMenu button:active { background: var(--panel); }
  #moreMenu svg.ic { color: var(--dim); }

  /* ── 锚定弹层（添加 / 权限模式 / 模型 / 思考档位，对照官方浮层交互）── */
  .pop {
    position: fixed; z-index: 40; display: none; min-width: 216px; max-width: min(88vw, 340px);
    max-height: 62vh; overflow-y: auto;
    background: #1c1c22; border: 1px solid var(--line); border-radius: 16px;
    padding: 6px; box-shadow: 0 10px 34px rgba(0,0,0,.55);
  }
  .pop.open { display: block; }
  .pop .phead { padding: 8px 10px 4px; font-size: 12px; color: var(--faint); font-weight: 600; letter-spacing: .03em; }
  .mrow {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: transparent; border: none; padding: 9px 10px; border-radius: 11px;
    font: inherit; font-size: 13.5px; color: var(--fg); cursor: pointer;
  }
  .mrow:active { background: rgba(255,255,255,.05); }
  .mrow .mi { color: var(--dim); flex: none; display: flex; }
  .mrow .mt { flex: 1; min-width: 0; }
  .mrow .mt .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow .mt .d { color: var(--faint); font-size: 11.5px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrow .mck { color: var(--fg); flex: none; display: flex; }
  .mrow.disabled { opacity: .45; }

  /* ── 上下文容量卡（对照官方：总量 + 百分比 + 渐变进度条 + 分类占比）── */
  .ctxcard { margin: 10px 12px 4px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--card); }
  .ctxcard .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .ctxcard .hd .t { font-size: 14px; font-weight: 650; }
  .ctxcard .hd .n { font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .ctxcard .bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; margin: 10px 0 6px; }
  .ctxcard .bar > div { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #4c8dff, #7c5cff); transition: width .4s ease; }
  .bdrow { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12.5px; }
  .bdrow .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .bdrow .k { color: var(--dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bdrow .v { font-variant-numeric: tabular-nums; }

  /* 提问卡片（AskUserQuestion / 权限请求） */
  .ask {
    border: 1px solid rgba(210,153,34,.55); border-radius: 14px; background: rgba(210,153,34,.07);
    padding: 11px 13px; margin: 10px 0; font-size: 13.5px;
  }
  .ask .q { margin: 2px 0 9px; }
  .ask button { margin: 3px 7px 3px 0; padding: 6px 14px; border-radius: 999px; font-size: 12.5px; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px;
    background: #23232c; border: 1px solid var(--line); color: var(--fg);
    padding: 8px 16px; border-radius: 999px; z-index: 50; font-size: 13px; display: none;
    max-width: 86vw; text-align: center;
  }

  /* spinner 通用 */
  .spin { animation: rot 1s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>
<header>
  <div class="navrow">
    <button id="btnMenu" class="iconbtn" title="会话与工作区" aria-label="会话与工作区">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="title" id="sessTitle">选择会话</div>
    <button id="btnUsage" class="iconbtn" title="用量 / 缓存" aria-label="用量">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2z"/></svg>
    </button>
    <button id="btnMore" class="iconbtn" title="更多" aria-label="更多">
      <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
    </button>
  </div>
</header>

<!-- ⋯ 溢出菜单：新会话 / 插件 / 计划 -->
<div id="moreMenu">
  <button id="miNew"><svg class="ic sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新会话</button>
  <button id="miPlugins"><svg class="ic sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V6h3.5A1.5 1.5 0 0 1 20 7.5V11h-1.5a1.5 1.5 0 0 0 0 3H20v3.5a1.5 1.5 0 0 1-1.5 1.5H15v-1.5a1.5 1.5 0 0 0-3 0V20H8.5A1.5 1.5 0 0 1 7 18.5V15H5.5a1.5 1.5 0 0 1 0-3H7V7.5A1.5 1.5 0 0 1 8.5 6H9V4.5z"/></svg>插件</button>
  <button id="miPlan"><svg class="ic sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1.1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.1" fill="currentColor" stroke="none"/></svg>计划 / 上下文</button>
</div>

<!-- 锚定弹层：添加 / 权限模式 / 模型 / 思考档位（内容由 JS 渲染） -->
<div id="addMenu" class="pop"></div>
<div id="modeMenu" class="pop"></div>
<div id="modelMenu" class="pop"></div>
<div id="thinkMenu" class="pop"></div>
<input type="file" id="fileInput" multiple style="display:none">

<!-- 运行状态条：任务运行期间可见；哨兵词 span 仅在运行时存在（旧版 App 桥据此判定运行态） -->
<div id="turnStatus" role="status" aria-live="polite">
  <svg class="ic sm spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-9 9"/></svg>
  <span class="act" id="turnActivity">智能体正在执行任务…</span>
  <span class="elapsed" id="turnElapsed"></span>
</div>

<script>
'use strict';
// token 通过 URL ?token= 携带，API 调用原样透传。
const TOKEN = new URLSearchParams(location.search).get('token') ?? '';
const qs = (o) => Object.entries(o).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
const API = (p) => `/api/${p}${p.includes('?') ? '&' : '?'}${qs({token: TOKEN})}`;

const $ = (id) => document.getElementById(id);
const chat = $('chat'), composer = $('composer');

// 渲染模型：messageId → {role, el, bubble, parts: Map(partId→part数据), partEls: Map(partId→渲染元素)}
const msgEls = new Map();
const toolEls = new Map();  // toolCallId → {el, status, name, desc, body}
const thinkTimers = new Map(); // partId → 起始时间（思考行耗时统计）
// 排队消息：运行中输入先入队，回合结束后自动发出（官方「排队后续修改」交互）
const sendQueue = [];

// ── App 桥协议 v2 ──

// 旧版 App（APK 未升级）仍走 DOM 约定：哨兵词仅在任务运行时出现在 #turnStatus 里。
window.__zcodeBridge = 2;
function notifyApp(handler, payload) {
  try { window.flutter_inappwebview?.callHandler(handler, payload); } catch { /* 非 App 环境忽略 */ }
}
// 任务状态上报：同时携带旧版 App 认识的 state 字段（'running'/'settled'）
// 与 v2 的 running 布尔，两代 App 桥都可用。
function notifyTaskState(running) {
  notifyApp('onTaskState', { state: running ? 'running' : 'settled', running, sessionId: curSession });
}

// ── 待发附件（App 拍照/相册注入 + 页面「+ → 附件」通用文件）──
let pendingImage = null;
function showAttachChip() {
  const bar = $('attachBar');
  if (!pendingImage) { bar.style.display = 'none'; return; }
  $('attachName').textContent = `📎 ${pendingImage.name}（发送时上传到工作区）`;
  bar.style.display = 'flex';
}
function clearAttach() { pendingImage = null; showAttachChip(); }

// ── App 注入函数：新版显式契约 window.__zcode + 旧版 DSH 命名兼容（当前已装 APK 即用）──
window.__dshComposerBridge = {
  insertText(text) {
    composer.value = String(text ?? '');
    composer.dispatchEvent(new Event('input'));
    return { ok: true };
  },
  async send() {
    if (!composer.value.trim() && !pendingImage) return { ok: false, error: 'empty' };
    await send();
    return { ok: true, via: 'zcode' };
  },
};
window.__dshPhotoBridge = {
  pickImage(base64, name, mime) {
    pendingImage = { base64: String(base64 ?? ''), name: String(name ?? 'image.png'), mime: String(mime ?? 'image/png') };
    showAttachChip();
    return { ok: true };
  },
};
window.__zcode = {
  version: 2,
  insert(text) { return window.__dshComposerBridge.insertText(text); },
  send() { return window.__dshComposerBridge.send(); },
  attachImage(base64, name, mime) { return window.__dshPhotoBridge.pickImage(base64, name, mime); },
};

function toast(msg, ms = 2200) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), ms);
}

async function api(p, opts = {}) {
  const r = await fetch(API(p), { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error ?? `HTTP ${r.status}`);
  return data;
}

function scrollBottom() { requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; }); }

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// 极简富文本：转义 + 反引号代码块/行内码，其余纯文本（安全优先，不引外部库）
function richText(container, text) {
  const parts = String(text).split(/```/);
  parts.forEach((seg, i) => {
    if (i % 2 === 1) { // 代码块：首行语言名丢弃
      const pre = el('pre');
      pre.textContent = seg.replace(/^[a-zA-Z0-9_+-]*\n/, '');
      container.appendChild(pre);
    } else {
      const lines = seg.split('\n');
      lines.forEach((line, j) => {
        if (j) container.appendChild(document.createElement('br'));
        // 行内代码
        const pieces = line.split(/`([^`]+)`/);
        pieces.forEach((pc, k) => {
          if (k % 2 === 1) { const c = el('code', 'inline', pc); container.appendChild(c); }
          else container.appendChild(document.createTextNode(pc));
        });
      });
    }
  });
}

function toolIcon(name) {
  const k = String(name ?? '').toLowerCase();
  if (/bash|shell|terminal|command|exec/.test(k)) return SVG.terminal;
  if (/write|edit|patch|notebook/.test(k)) return SVG.file;
  if (/read|glob|grep|search|find|ls/.test(k)) return SVG.search;
  if (/web|fetch|http|browser/.test(k)) return SVG.globe;
  if (/task|agent|todo|plan/.test(k)) return SVG.brain;
  return SVG.gear;
}
const TOOL_LABELS = {
  bash: '终端', shell: '终端', terminal: '终端', command: '终端',
  write: '写入', edit: '编辑', multiedit: '编辑', 'multi-edit': '编辑', applypatch: '补丁', patch: '补丁',
  read: '读取', glob: '搜索', grep: '搜索', ls: '列表',
  webfetch: '网络', websearch: '网络', browser: '浏览器',
  task: '子任务', agent: '子任务', todowrite: '计划', todo: '计划',
};
function toolLabel(name) {
  const k = String(name ?? '').toLowerCase();
  return TOOL_LABELS[k] || (name || '工具');
}
function inputSummary(input) {
  if (!input || typeof input !== 'object') return '';
  const v = input.command ?? input.file_path ?? input.filePath ?? input.path ?? input.url ?? input.query ?? input.pattern ?? input.prompt ?? '';
  return String(v).replace(/\s+/g, ' ').slice(0, 120);

function currentModelKey(m) { return m ? `${m.providerId ?? ''}/${m.modelId ?? ''}` : ''; }

// token 数格式化（官方：22.2万 / 100万）
function fmtWan(n) {
  n = Number(n) || 0;
  if (n >= 1e8) return (n / 1e8).toFixed(2) + '亿';
  if (n >= 1e4) return (n / 1e4).toFixed(1) + '万';
  return String(Math.round(n));
}

// ── 锚定弹层通用 ──

function closePops() { document.querySelectorAll('.pop.open').forEach((p) => p.classList.remove('open')); }

function popRow(opt) {
  const b = el('button', 'mrow' + (opt.disabled ? ' disabled' : ''));
  if (opt.icon) { const i = el('span', 'mi'); i.innerHTML = opt.icon; b.appendChild(i); }
  const mt = el('div', 'mt');
  mt.appendChild(el('div', 't', opt.title));
  if (opt.desc) mt.appendChild(el('div', 'd', opt.desc));
  b.appendChild(mt);
  if (opt.trailing) b.appendChild(el('span', 'mck', opt.trailing));
  if (opt.checked) { const c = el('span', 'mck'); c.innerHTML = SVG.check; b.appendChild(c); }
  b.addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (opt.disabled) return;
    opt.onClick?.();
  });
  return b;
}

// 在锚点按钮上方弹出（超出屏高则贴底）；再点一次收起
function togglePop(pop, anchor, render) {
  const wasOpen = pop.classList.contains('open');
  closePops();
  if (wasOpen) return;
  render?.();
  pop.classList.add('open');
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.left = Math.min(Math.max(8, r.left), window.innerWidth - pw - 8) + 'px';
  pop.style.top = 'auto';
  pop.style.bottom = Math.min(window.innerHeight - r.top + 8, Math.max(8, window.innerHeight - ph - 8)) + 'px';
}

document.addEventListener('click', (e) => {
  if (!(e.target instanceof Element) || !e.target.closest('.pop')) closePops();
});

// ── 权限模式菜单（官方：🛡 → 计划/变更前确认/自动编辑/完全访问）──

function renderModeMenu() {
  const pop = $('modeMenu');
  pop.textContent = '';
  pop.appendChild(el('div', 'phead', '权限模式'));
  for (const m of MODE_ORDER) {
    const meta = MODE_META[m];
    pop.appendChild(popRow({
      icon: SVG.shield, title: meta.label, desc: meta.desc,
      checked: curMode === m,
      onClick: () => pickMode(m),
    }));
  }
}

async function pickMode(m) {
  closePops();
  if (!curSession) { toast('先选择一个会话'); return; }
  try {
    await api(`sessions/${encodeURIComponent(curSession)}/mode`, { method: 'POST', body: JSON.stringify({ mode: m }) });
    curMode = m;
    syncModeUi();
    toast(`已切换：${MODE_META[m].label}`);
  } catch (e) { toast(`切换失败：${e.message}`); }
}

function syncModeUi() {
  const meta = MODE_META[curMode] ?? MODE_META.build;
  const b = $('btnMode');
  b.classList.remove('warn', 'ok', 'accent', 'access');
  if (meta.cls) b.classList.add(meta.cls);
  b.title = `权限模式：${meta.label}`;
}

// ── 模型菜单（官方：GLM-5.3-Flash ▾）──

function renderModelMenu() {
  const pop = $('modelMenu');
  pop.textContent = '';
  pop.appendChild(el('div', 'phead', '选择模型'));
  const avail = sessionSettings?.model?.available ?? [];
  if (!avail.length) {
    pop.appendChild(el('div', 'sysline', '引擎未返回可用模型\n（重启服务或检查凭据后重试）'));
  }
  const curKey = currentModelKey(sessionSettings?.model?.current);
  for (const o of avail) {
    pop.appendChild(popRow({
      icon: SVG.model,
      title: o.label || o.modelId,
      desc: o.disabledReason || o.providerLabel || o.description || '',
      trailing: o.reasoningLevels?.length ? `${o.reasoningLevels.length} 档` : '',
      checked: currentModelKey(o) === curKey,
      disabled: !!o.disabledReason,
      onClick: () => pickModel(o),
    }));
  }
  pop.appendChild(popRow({
    icon: SVG.gear, title: '管理模型', desc: '在桌面端 ZCode 设置中添加/管理',
    onClick: () => { closePops(); toast('在桌面端 ZCode 设置中添加/管理模型'); },
  }));
}

async function pickModel(o) {
  closePops();
  if (!curSession) { toast('先选择一个会话'); return; }
  try {
    await api(`sessions/${encodeURIComponent(curSession)}/model`, {

function syncComposerChrome() {
  const cur = sessionSettings?.model?.current;
  if (cur) {
    const key = currentModelKey(cur);
    const opt = (sessionSettings.model.available ?? []).find((o) => currentModelKey(o) === key);
    $('modelName').textContent = opt?.label ?? cur.modelId ?? 'ZCode';
  }
  updateCtxRing();
  syncThinkUi();
  syncModeUi();
}

// 上下文用量指示环（官方：模型名左侧圆圈 = 上下文余量，点击看详情）
const CTX_RING_LEN = 56.55;
function updateCtxRing() {
  const ring = $('ctxRing');
  if (!ring) return;
  const proj = sessionSettings?.projection;
  const used = Number(proj?.contextUsed ?? 0);
  const win = Number(proj?.contextWindow ?? 0);
  const pct = win > 0 ? Math.min(100, Math.round((used / win) * 100)) : 0;
  ring.setAttribute('stroke-dashoffset', String(CTX_RING_LEN * (1 - pct / 100)));
  $('btnCtx').classList.toggle('hot', pct > 80);
  $('btnCtx').title = win > 0
    ? `上下文 ${fmtWan(used)} / ${fmtWan(win)}（${pct}%），点击查看`
    : '上下文用量';
}

async function refreshSettings(renderMenus = true) {
  if (!curSession) return;
  try {
    const s = await api(`sessions/${encodeURIComponent(curSession)}/settings`);
    if (s && !s.unavailable) sessionSettings = s;
  } catch { /* 保持现有设置 */ }
  // projection 为 0 时用 goal 快照回退：会话恢复后引擎的 projection 常报 0，
  // 而 goal 快照的 contextUsed/contextWindow 是真实值（用量面板同款回退）
  if (!Number(sessionSettings?.projection?.contextUsed)) {
    try {
      const g = await api(`sessions/${encodeURIComponent(curSession)}/goal`);
      const gs = g?.snapshot ?? {};
      if (Number(gs.contextWindow) > 0 && sessionSettings) {
        sessionSettings.projection = {
          contextUsed: gs.contextUsed ?? 0,
          contextWindow: gs.contextWindow ?? 0,
          totalTokenCount: gs.tokensUsed ?? 0,
          status: sessionSettings.projection?.status ?? '',
        };
      }
    } catch { /* 下次再试 */ }
  }
  syncComposerChrome();
}

// 文件附件：选择后挂到待发槽（发送时统一上传到工作区）
async function handleFilePicked(f) {
  if (!f) return;
  if (f.size > 10 * 1024 * 1024) { toast('文件超过 10MB，暂不支持'); return; }
  const buf = new Uint8Array(await f.arrayBuffer());
  let binary = '';
  for (let i = 0; i < buf.length; i += 0x8000) binary += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  pendingImage = { base64: btoa(binary), name: f.name, mime: f.type || 'application/octet-stream' };
  showAttachChip();
}

// ── 运行状态条 / 计时 ──

function setActivity(text) {
  $('turnActivity').textContent = text || '智能体正在执行任务…';
}
function fmtElapsed(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return `已运行 ${s} 秒`;
  const m = Math.floor(s / 60);
  if (m < 60) return `已运行 ${m} 分 ${s % 60} 秒`;
  return `已运行 ${Math.floor(m / 60)} 时 ${m % 60} 分`;
}
function tickElapsed() {
  $('turnElapsed').textContent = busySince ? fmtElapsed(Date.now() - busySince) : '';
}
function markThinkDurations() {
  // 思考行补时长（回合结束/开始新思考时结算）
  const now = Date.now();
  for (const [partId, t0] of thinkTimers) {
    const lab = document.querySelector(`details.think[data-part="${partId}"] .tdur`);
    if (lab && !lab.textContent) lab.textContent = `持续了 ${Math.max(1, Math.round((now - t0) / 1000))} 秒`;
    thinkTimers.delete(partId);
  }
}

  busy = on;

  status.classList.toggle('on', on);
  let sent = document.getElementById('dshSentinel');
  if (on && !sent) {
    sent = el('span', 'vh', 'Deep diving');

    status.appendChild(sent);
  } else if (!on && sent) {

    ? '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>'
    : '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 12l6-6 6 6"/></svg>';

function setToolStatus(toolCallId, status, desc, detail) {
  const t = toolEls.get(toolCallId);

  t.state.innerHTML =
    status === 'running' ? SVG.spin :
    status === 'completed' ? SVG.check :
    status === 'error' || status === 'failed' ? SVG.cross : '';
  if (detail !== undefined && detail !== null && detail !== '') {
    t.body.textContent = '';
    const pre = el('pre'); pre.textContent = String(detail).slice(0, 4000);
    t.body.appendChild(pre);
  }
  if (status === 'running') setActivity(`正在执行 ${t.name.textContent}`);
  scrollBottom();

// ── 外部回合跟随（轮询共享会话存储）──
//
// 手机端引擎只能收到自己驱动的回合的 SSE 事件；桌面端驱动的回合不推事件
// （SSE 是进程内的），这是"页面静态、不同步"的根因。但引擎的会话存储是
// 共享的：回合内的工具/文本片段落盘即可从 session/messages 读到（实测
// 部件粒度实时落盘）。因此用轻量轮询做跟随：小 limit 探测最后一层指纹，
// 有变化才全量拉取重渲染；运行态按"最后部件是否 step-finish"推断。

let lastFingerprint = '';    // 最后渲染的消息尾部指纹（renderHistory 内更新）
let busySource = null;       // 'sse' = 本引擎事件驱动；'inferred' = 轮询推断
let lastActivity = 0;        // 推断运行态最近一次见到存储变化的时刻
let lastSseEventAt = 0;      // 最近一次收到 SSE 事件（检测流静默/死亡）
let finishedSince = 0;       // 推断态首次见到"回合已收尾"指纹的时刻
let pollTimer = null;

function lastBusyMessage(messages) {
  for (let i = messages.length - 1; i >= 0; i--) {
    if ((messages[i].info?.role ?? 'assistant') !== 'user') return messages[i];
  }
  return null;
}

// 尾部指纹：最后一条 assistant 消息的身份 + 末部件类型/状态/文本长度
function fingerprint(messages) {
  const m = lastBusyMessage(messages ?? []);
  const parts = m?.parts ?? [];
  const lp = parts.at(-1);
  return [
    m?.info?.id ?? m?.info?.messageId ?? '?',
    m?.info?.role ?? '',
    parts.length,
    lp?.type ?? '',
    lp?.state?.status ?? '',
    (lp?.text ?? '').length,
  ].join(':');
}

// 回合是否已收尾：最后一条 assistant 消息以 step-finish 部件结尾
function turnLooksFinished(messages) {
  const m = lastBusyMessage(messages ?? []);
  if (!m) return true;
  const parts = m.parts ?? [];
  return parts.at(-1)?.type === 'step-finish';
}

// 最后一条 assistant 消息是否处于进行中（用于打开会话时恢复外部运行态）
function turnLooksRunning(messages) {
  const m = lastBusyMessage(messages ?? []);
  if (!m) return false;
  const parts = m.parts ?? [];
  if (!parts.length) return false;
  return parts.at(-1)?.type !== 'step-finish';
}

// 历史消息（/session/messages 的 MessageWithParts）
function renderHistory(messages) {
  chat.textContent = '';
  msgEls.clear(); toolEls.clear(); thinkTimers.clear();
  // 更新尾部指纹：轮询跟随以这里为准（打开会话/重连重同步/轮询全量拉取共用）
  lastFingerprint = fingerprint(messages);
  if (!messages.length) {
    chat.innerHTML = '<div class="hero"><div class="bigz">Z</div><div class="t1">ZCode Phone</div><div class="t2">这个会话还没有消息</div></div>';
    return;
  }
  for (const msg of messages) {
    const role = msg.info?.role ?? 'assistant';
    const mid = String(msg.info?.messageId ?? msg.info?.id ?? Math.random());
    const m = ensureMsg(mid, role === 'user' ? 'user' : 'assistant');
    for (const part of msg.parts ?? []) {
      switch (part.type) {
        case 'text': renderTextPart(m, String(part.partId ?? mid + '-t'), part.text ?? ''); break;
        case 'reasoning': {
          const pe = ensureThink(m, String(part.partId ?? mid + '-r'));
          pe.content.textContent = part.text ?? '';
          break;
        }
        case 'tool': {
          const st = part.state ?? {};
          const card = toolCard(part.callId, part.tool, st.title ?? inputSummary(st.input));
          const status = st.status ?? 'pending';
          const detail = status === 'error' ? st.error : st.output;
          setToolStatus(part.callId, status, undefined, detail);
          // 工具的 Write/Edit 目标文件 → chip
          const fp = st?.input?.file_path ?? st?.input?.filePath ?? st?.input?.path;
          if (fp) fileChip(card.body, String(fp));
          break;
        }
        default: break;
      }
    }
  }
  scrollBottom();
}

function renderCtxBar(body, snap) {
  const used = snap.contextUsed, win = snap.contextWindow;
  if (!(win > 0)) return;
  const pct = Math.min(100, Math.round((used / win) * 100));
  const bar = el('div', 'ctxbar');
  bar.innerHTML = `<div style="font-size:11.5px;color:var(--faint);margin-bottom:4px;">上下文占用 ${used ?? 0} / ${win} tokens（${pct}%）</div>` +
    `<div style="height:5px;border-radius:3px;background:var(--line);overflow:hidden;"><div style="height:100%;width:${pct}%;background:${pct > 80 ? 'var(--err)' : 'var(--accent)'};"></div></div>`;
  body.appendChild(bar);
}

async function loadPlan() {
  if (!curSession) return;
  try {
    const r = await api(`sessions/${encodeURIComponent(curSession)}/goal`);
    const text = typeof r === 'string' ? r : (r.goal ?? r.response ?? r.text ?? r.plan ?? (r.unavailable ? '' : ''));
    const snap = r.snapshot ?? {};
    const has = (text && !/no goal is set/i.test(text)) || snap.contextUsed > 0;
    if ($('infoTitle').textContent.includes('计划')) {
      const body = $('infoBody');
      body.textContent = '';
      body.appendChild(el('div', 'sect', '目标'));
      body.appendChild(el('div', '', has && text ? text : '（本轮尚未设定目标）'));
      renderCtxBar(body, snap);
    }
  } catch { /* 降级：无计划面板 */ }
}

function renderKvList(obj) {
  // 展平所有层级：嵌套对象以 a.b.c 键名内联展示，不丢任何字段
  const body = $('infoBody');
  body.textContent = '';
  const rows = [];
  const walk = (o, prefix) => {
    for (const [k, v] of Object.entries(o ?? {})) {
      const key = prefix ? `${prefix}.${k}` : k;
      if (v && typeof v === 'object') walk(v, key);
      else rows.push([key, String(v)]);
    }
  };
  walk(obj, '');
  if (!rows.length) { body.appendChild(el('div', 'sysline', '暂无数据')); return; }
  for (const [k, v] of rows) {
    const row = el('div', 'kv');
    row.appendChild(el('div', 'k', k));
    row.appendChild(el('div', 'v', v));
    body.appendChild(row);
  }
}

// 用量/上下文容量面板（对照官方：容量大卡 + 分类占比 + 统计 + 压缩入口）
async function loadUsage(silent = false) {
  if (!silent) openInfo('⚡ 用量 / 上下文', null);
  let settings = null, usage = null, goal = null;
  try { settings = curSession ? await api(`sessions/${encodeURIComponent(curSession)}/settings`) : null; } catch { /* 降级 */ }
  try { usage = curSession ? await api(`sessions/${encodeURIComponent(curSession)}/usage`) : null; } catch { /* 降级 */ }
  // projection 为 0（会话未在本进程激活过）时，goal 快照的 contextUsed 是更可靠来源
  if (!settings?.projection?.contextUsed) {
    try { goal = curSession ? await api(`sessions/${encodeURIComponent(curSession)}/goal`) : null; } catch { /* 降级 */ }
  }
  // 异步回来自用户可能已切走面板：仅当仍停留在用量页才重绘
  if (silent && (!$('info').classList.contains('open') || !$('infoTitle').textContent.includes('用量'))) return;
  if (settings && !settings.unavailable) { sessionSettings = settings; syncComposerChrome(); }
  const body = $('infoBody');
  body.textContent = '';
  // ── 官方样式「上下文容量」卡 ──
  const proj = settings?.projection;
  const gctx = goal?.snapshot ?? {};
  const used = Number(proj?.contextUsed ?? gctx.contextUsed ?? 0);
  const win = Number(proj?.contextWindow ?? gctx.contextWindow ?? 0);
  const card = el('div', 'ctxcard');
  const hd = el('div', 'hd');
  hd.appendChild(el('div', 't', '上下文容量'));
  hd.appendChild(el('div', 'n', win > 0
    ? `${fmtWan(used)} / ${fmtWan(win)}（${Math.round((used / win) * 100)}%）`
    : '暂无数据'));
  card.appendChild(hd);
  if (win > 0) {
    const pct = Math.min(100, (used / win) * 100);
    const bar = el('div', 'bar');
    const fill = el('div');
    fill.style.width = pct + '%';
    if (pct > 80) fill.style.background = 'linear-gradient(90deg, #f85149, #d29922)';
    bar.appendChild(fill);
    card.appendChild(bar);
  }
  body.appendChild(card);
  // ── token 统计（引擎返回什么展示什么，重点字段优先）──
  if (usage && !usage.unavailable) {
    const flat = {};
    const walk = (o, prefix) => {
      for (const [k, v] of Object.entries(o ?? {})) {
        const key = prefix ? `${prefix}.${k}` : k;
        if (v && typeof v === 'object') walk(v, key);
        else flat[key] = v;
      }
    };
    walk(usage, '');
    const PICK = [
      ['totalTokens', 'Token 总数'], ['inputTokens', '输入 Token'], ['outputTokens', '输出 Token'],
      ['reasoningTokens', '思考 Token'], ['cacheReadTokens', '缓存读取'], ['cacheCreationTokens', '缓存写入'],
      ['modelRequestCount', '模型请求次数'], ['modelErrorCount', '模型错误次数'],
      ['contextUsed', '上下文已用'], ['contextWindow', '上下文窗口'],
    ];
    const stats = el('div', 'ctxcard');
    let hit = false;
    for (const [k, label] of PICK) {
      const found = Object.entries(flat).find(([fk]) => fk === k || fk.endsWith(`.${k}`));
      if (found && found[1] !== '' && found[1] !== null) {
        hit = true;
        const row = el('div', 'bdrow');
        row.appendChild(el('span', 'dot'));
        row.appendChild(el('span', 'k', label));
        row.appendChild(el('span', 'v', typeof found[1] === 'number' ? fmtWan(found[1]) : String(found[1])));
        stats.appendChild(row);
      }
    }
    if (hit) body.appendChild(stats);
    // 其余字段折叠在「原始字段」里，不丢信息
    const det = document.createElement('details');
    const sum = document.createElement('summary');
    sum.textContent = '原始字段';
    sum.style.cssText = 'cursor:pointer;padding:10px 12px;color:var(--faint);font-size:12.5px;';
    det.appendChild(sum);
    const kvBox = el('div');
    for (const [k, v] of Object.entries(flat)) {
      const row = el('div', 'kv');
      row.appendChild(el('div', 'k', k));
      row.appendChild(el('div', 'v', typeof v === 'number' ? fmtWan(v) : String(v)));
      kvBox.appendChild(row);
    }
    det.appendChild(kvBox);
    body.appendChild(det);
  } else if (usage?.unavailable) {
    body.appendChild(el('div', 'sysline', `引擎暂不支持用量：${usage.unavailable}`));
  }
  // ── 压缩上下文入口 ──
  if (curSession) {
    const cbtn = el('button', 'primary', '压缩上下文');
    cbtn.style.cssText = 'margin:12px;width:calc(100% - 24px);';
    cbtn.addEventListener('click', async () => {
      cbtn.disabled = true;
      try {
        await api(`sessions/${encodeURIComponent(curSession)}/compact`, { method: 'POST', body: '{}' });
        toast('已请求压缩上下文');
        loadUsage(true);
      } catch (e) { toast(`压缩失败：${e.message}`); }
      cbtn.disabled = false;
    });
    body.appendChild(cbtn);
  }
}

// ── 实时事件处理 ──

function handleZcodeEvent(ev) {
  lastSseEventAt = Date.now();
  // 页面中途打开/刷新时可能错过 turn.started（回合由桌面端等外部驱动）：
  // 收到任何回合内活动事件就恢复运行态，保证进度条/停止按钮/计时可见
  if (!busy && (ev.type === 'part.started' || ev.type === 'part.upserted' ||
      ev.type === 'part.delta' || ev.type === 'tool.updated')) {
    busySince = Date.now();
    setBusy(true);
    notifyTaskState(true);
    startLiveTimers();
  }
  switch (ev.type) {
    case 'turn.started': {
      const input = ev.payload?.input;
      if (input && ev.payload?.inputVisibility !== 'hidden') {
        const mid = `user-${ev.seq}`;
        const m = ensureMsg(mid, 'user');
        m.bubble.textContent = String(input);
        scrollBottom();
      }
      busySince = Date.now();
      busySource = 'sse';
      setBusy(true);
      notifyTaskState(true);
      startLiveTimers();
      break;
    }
    case 'part.started':
    case 'part.upserted': {
      const part = ev.payload?.part;
      if (!part?.messageId) break;
      const m = ensureMsg(String(part.messageId), 'assistant');
      m.parts.set(part.partId, part);
      if (part.type === 'text') renderTextPart(m, String(part.partId), part.text ?? '');
      else if (part.type === 'reasoning') {
        const pe = ensureThink(m, String(part.partId));
        if (part.text) pe.content.textContent = part.text;
      }
      else if (part.type === 'tool') {
        const st = part.state ?? {};
        toolCard(part.callId, part.tool, st.title ?? inputSummary(st.input));
        setToolStatus(part.callId, st.status ?? 'pending', undefined, st.status === 'error' ? st.error : st.output);
      }
      scrollBottom();
      break;
    }
    case 'part.delta': {
      const { messageId, partId, field, delta } = ev.payload ?? {};
      if (!delta) break;
      const m = msgEls.get(String(messageId));
      if (!m) break;
      const p = { ...(m.parts.get(partId) ?? {}) };
      if (field === 'text' || field === undefined) p.text = (p.text ?? '') + delta;
      p.partId = partId;
      m.parts.set(partId, p);
      const pe = m.partEls.get(String(partId));
      if (pe?.kind === 'text') {
        pe.el.textContent = '';
        richText(pe.el, p.text ?? '');
      } else if (pe?.kind === 'think') {
        pe.content.textContent = p.text ?? '';
      } else if (!pe && p.type === 'text') {
        renderTextPart(m, String(partId), p.text ?? '');
      } else if (!pe && p.type === 'reasoning') {
        ensureThink(m, String(partId)).content.textContent = p.text ?? '';
      }
      scrollBottom();
      break;
    }
    case 'tool.updated': {
      const p = ev.payload ?? {};
      if (p.kind === 'batch') break;
      const id = p.toolCallId;
      const desc = inputSummary(p.input) || (p.toolName ?? '');
      toolCard(id, p.toolName, desc);
      if (p.kind === 'scheduled') setToolStatus(id, 'pending', undefined, p.input ? JSON.stringify(p.input, null, 1) : undefined);
      if (p.kind === 'started') setToolStatus(id, 'running', undefined, p.input ? JSON.stringify(p.input, null, 1) : undefined);
      if (p.kind === 'progress') setToolStatus(id, 'running', undefined, p.stdoutTail ?? p.stderrTail ?? p.outputPreview);
      if (p.kind === 'result') {
        setToolStatus(id, 'completed', undefined, typeof p.result === 'string' ? p.result : JSON.stringify(p.result, null, 1));
        // Write/Edit 结果带文件路径 → chip
        const s = JSON.stringify(p.result ?? {});
        const fp = s.match(/"(?:file_path|filePath|path)":"([^"]+)"/);
        if (fp) fileChip(toolEls.get(id)?.body ?? chat, fp[1]);
      }
      if (p.kind === 'error') setToolStatus(id, 'error', undefined, p.error ? JSON.stringify(p.error, null, 1) : undefined);
      break;
    }
    case 'turn.completed':
      busySource = null;
      setBusy(false);
      stopLiveTimers();
      notifyTaskState(false);
      // 断流期间工具行可能停在 running：从存储补一次最终状态重绘
      api(`sessions/${encodeURIComponent(curSession)}/messages?limit=10`)
        .then((r) => renderTail(r.messages ?? []))
        .catch(() => {});
      loadPlan();
      loadUsage(true);
      loadAllSessions();
      flushQueue();
      break;
    case 'turn.failed': {
      busySource = null;
      setBusy(false);
      stopLiveTimers();
      notifyTaskState(false);
      loadAllSessions();
      // 429/余额类错误给人话提示（账户被占用或资源包耗尽是移动端最常见失败）
      const raw = String(ev.payload?.error ?? '未知错误');
      const friendly = /1113|insufficient balance|resource package|\b429\b/i.test(raw)
        ? '模型账户额度不足或资源包耗尽（HTTP 429）。同一账户的任务正在跑时新会话可能被限流——等当前任务完成、前往平台充值，或在模型菜单切换其他模型后重试。'
        : raw;
      const e = el('div', 'errline', `回合失败：${friendly}`);
      chat.appendChild(e); scrollBottom();
      break;
    }
    case 'permission.requested': {
      // autoAnswer=ask 时才会看到；渲染批准卡片（按钮文案匹配 App 审批检测）
      const card = el('div', 'ask');
      card.appendChild(el('div', 'q', `请求权限：${ev.payload?.toolName ?? ''}（${ev.payload?.riskLevel ?? ''}） ${ev.payload?.reason ?? ''}`));
      const ok = el('button', 'primary', '批准');
      const no = el('button', 'danger', '拒绝');
      ok.addEventListener('click', () => answerInteraction(ev.payload?.requestId, { decision: 'allow' }, card));
      no.addEventListener('click', () => answerInteraction(ev.payload?.requestId, { decision: 'deny', reason: '用户拒绝' }, card));
      card.append(ok, no);
      chat.appendChild(card); scrollBottom();
      break;
    }
    case 'userInput.requested': {
      const p = ev.payload ?? {};
      const card = el('div', 'ask');
      card.appendChild(el('div', 'q', p.prompt ?? p.questions?.[0]?.question ?? 'Agent 提问'));
      for (const q of p.questions ?? []) {
        for (const opt of q.options ?? []) {
          const b = el('button', '', opt.label ?? opt.value);
          b.addEventListener('click', () => answerInteraction(p.requestId, { action: 'accept', content: { answer: opt.value } }, card));
          card.appendChild(b);
        }
      }
      chat.appendChild(card); scrollBottom();
      break;
    }
    case 'session.titleUpdated': {
      const t = ev.payload?.title ?? ev.payload?.session?.title;
      if (t) setSessionTitle(t);
      break;
    }
    case 'session.closed': {
      busySource = null;
      setBusy(false);
      toast('会话已关闭');
      break;
    }
    default: break;
  }
}

function handleUiEvent(p) {
  if (p.kind === 'permission' && p.pending) {
    const card = el('div', 'ask');
    card.appendChild(el('div', 'q', `权限请求：${p.toolName ?? ''} ${p.reason ?? ''}`));
    const ok = el('button', 'primary', '批准');
    const no = el('button', 'danger', '拒绝');
    ok.addEventListener('click', () => answerInteraction(p.requestId, { decision: 'allow' }, card));
    no.addEventListener('click', () => answerInteraction(p.requestId, { decision: 'deny', reason: '用户拒绝' }, card));
    card.append(ok, no);
    chat.appendChild(card); scrollBottom();
  }
  // 服务端自动重试提示（429 限流退避等）
  if (p.kind === 'note' && p.text) {
    chat.querySelectorAll('.sysline[data-retry]').forEach((n) => n.remove());
    const note = el('div', 'sysline', p.text);
    note.dataset.retry = '1';
    chat.appendChild(note); scrollBottom();
    toast(p.text);
  }
  if (p.expired) toast('交互请求已超时自动拒绝');
}

async function answerInteraction(requestId, answer, card) {
  try {
    await api(`interactions/${encodeURIComponent(requestId)}`, { method: 'POST', body: JSON.stringify(answer) });
    if (card) card.remove();
  } catch (e) { toast(`应答失败：${e.message}`); }
}

// ── SSE 连接 ──
// afterSeq：首连从服务端 lastSeq 起只收新事件（历史已由 /messages 渲染，避免重放
// 造成文本重复）；断线自动重连后做一次全量重同步（历史重渲染对齐状态）。

let streamEverOpened = false;

function connectStream(sessionId, afterSeq = -1) {
  if (es) { es.close(); es = null; }
  streamEverOpened = false;
  es = new EventSource(`/api/sessions/${encodeURIComponent(sessionId)}/stream?afterSeq=${afterSeq}&token=${encodeURIComponent(TOKEN)}`);
  es.onopen = () => {
    if (streamEverOpened) resync();
    streamEverOpened = true;
  };
  es.addEventListener('zcode', (e) => { try { handleZcodeEvent(JSON.parse(e.data)); } catch {} });
  es.addEventListener('ui', (e) => { try { handleUiEvent(JSON.parse(e.data)); } catch {} });
  es.addEventListener('reset', () => {
    // 服务重启：引擎会话全部失效，自动 resume 恢复（轮询兜底）
    busySource = null;
    setBusy(false);
    ensureResumed();
  });
  es.onerror = () => { /* EventSource 自动重连，onopen 里重同步 */ };
}

async function resync() {
  if (!curSession) return;
  try {
    const r = await api(`sessions/${encodeURIComponent(curSession)}/messages`);
    renderHistory(r.messages ?? []);
  } catch { /* 下次重连再试 */ }
}

// 增量渲染消息尾部：复用既有消息/部件元素（与 SSE 流式路径同一套更新器），
// 不清空历史、不丢滚动位置。轮询跟随专用——整页重建是「刷新滞后」的主因。
function renderTail(messages) {
  let changed = false;
  for (const msg of messages) {
    const role = msg.info?.role ?? 'assistant';
    const mid = String(msg.info?.messageId ?? msg.info?.id ?? Math.random());
    const m = ensureMsg(mid, role === 'user' ? 'user' : 'assistant');
    for (const part of msg.parts ?? []) {
      switch (part.type) {
        case 'text':
          renderTextPart(m, String(part.partId ?? mid + '-t'), part.text ?? '');
          changed = true;
          break;
        case 'reasoning': {
          const pe = ensureThink(m, String(part.partId ?? mid + '-r'));
          pe.content.textContent = part.text ?? '';
          changed = true;
          break;
        }
        case 'tool': {
          const st = part.state ?? {};
          const card = toolCard(part.callId, part.tool, st.title ?? inputSummary(st.input));
          const status = st.status ?? 'pending';
          const detail = status === 'error' ? st.error : st.output;
          setToolStatus(part.callId, status, undefined, detail);
          const fp = st?.input?.file_path ?? st?.input?.filePath ?? st?.input?.path;
          if (fp) fileChip(card.body, String(fp));
          changed = true;
          break;
        }
        default: break;
      }
    }
  }
  if (changed) scrollBottom();
}

// 轮询跟随：探测最近几条消息的指纹，变化才增量渲染尾部。
// 桌面端驱动的回合没有 SSE 事件，靠这里实现手机端近实时同步（1.2s 探测）。
//
// 收敛自愈（以存储为准，任何运行态都必须能退出，否则就是"永久转圈"）：
// - busy 期间存储显示回合已收尾（最后部件 step-finish）且无任何活动
//   （SSE 静默 + 存储无变化）超过 30 秒 → 强制复位。
//   覆盖 SSE 断流后 turn.completed 丢失导致的不收敛。
// - SSE 存活时事件持续刷新 lastSseEventAt，步骤间隙不会误判
//   （工具执行期事件也在流，且存储里工具部件停在 running，finished=false）。
async function pollTick() {
  if (!curSession) return;
  if (document.hidden) return; // WebView 后台会暂停定时器，回前台自然补一次
  try {
    const probe = await api(`sessions/${encodeURIComponent(curSession)}/messages?limit=10`);
    const msgs = probe.messages ?? [];
    const fp = fingerprint(msgs);
    const finished = turnLooksFinished(msgs);
    const quietMs = Date.now() - Math.max(lastActivity, lastSseEventAt);
    if (fp === lastFingerprint) {
      // 无存储变化：busy 超过 30 秒且回合已收尾 → 复位（补一次尾部重绘，
      // 修正断流期间停留在 running 的工具行）
      if (busy && finished && quietMs > 30000) {
        renderTail(msgs);
        busySource = null;
        setBusy(false);
        notifyTaskState(false);
        flushQueue();
        loadAllSessions();
        return;
      }
      // 推断运行态长时间无任何变化：回合可能异常中断，兜底收尾
      if (busySource === 'inferred' && Date.now() - lastActivity > 120000) {
        busySource = null;
        setBusy(false);
        notifyTaskState(false);
        flushQueue();
      }
      return;
    }
    lastActivity = Date.now();
    // 推断态收尾：step-finish 需稳定 6 秒才复位——多步回合的步骤间隙也会
    // 短暂以 step-finish 结尾，立即复位会把进行中的回合误停
    if (busySource === 'inferred') {
      if (finished) {
        if (!finishedSince) finishedSince = Date.now();
        if (Date.now() - finishedSince >= 6000) {
          finishedSince = 0;
          renderTail(msgs);
          busySource = null;
          setBusy(false);
          notifyTaskState(false);
          flushQueue();
          loadAllSessions();
          return;
        }
      } else {
        finishedSince = 0;
      }
    }
    if (!busySource && !busy) {
      busySource = 'inferred';
      busySince = Date.now();
      setBusy(true);
      notifyTaskState(true);
      startLiveTimers();
    }
    renderTail(msgs);
    // SSE 驱动的回合也可能断流：存储已收尾且流静默 30 秒 → 兜底复位
    if (busy && busySource === 'sse' && finished && Date.now() - lastSseEventAt > 30000) {
      busySource = null;
      setBusy(false);
      notifyTaskState(false);
      flushQueue();
      loadAllSessions();
    }
  } catch (e) {
    // 服务端重启后引擎里没有这个会话（未 resume）：自动重新打开恢复
    if (/not active/i.test(String(e?.message ?? e))) ensureResumed();
  }
}

// 服务重启/引擎丢会话后自动 resume 当前会话（30 秒冷却防循环）
let resumingSession = false;
let lastResumeAt = 0;
async function ensureResumed() {
  if (resumingSession || !curSession) return;
  if (Date.now() - lastResumeAt < 30000) return;
  resumingSession = true;
  lastResumeAt = Date.now();
  try {
    toast('服务已重启，正在重新连接会话…');
    await openSession(curSession);
  } catch { /* 下次轮询再试 */ } finally {
    resumingSession = false;
  }
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(pollTick, 1200);
}

// ── 排队消息（官方「继续输入以排队后续修改」）──

function renderQueue() {
  const bar = $('queueBar');
  bar.textContent = '';
  bar.style.display = sendQueue.length ? 'flex' : 'none';
  for (let i = 0; i < sendQueue.length; i++) {
    const pill = el('div', 'qpill');
    pill.appendChild(el('span', 'qarr', '→'));
    pill.appendChild(el('span', 'qtext', sendQueue[i]));
    const x = el('button', 'qx', '✕');
    x.addEventListener('click', () => { sendQueue.splice(i, 1); renderQueue(); });
    pill.appendChild(x);
    bar.appendChild(pill);
  }
}

async function doSend(text) {
  try {
    await api(`sessions/${encodeURIComponent(curSession)}/send`, { method: 'POST', body: JSON.stringify({ content: text }) });
    busySince = Date.now();
    setBusy(true);
    return true;
  } catch (e) {
    toast(/409|运行/.test(e.message) ? '该会话正在运行（可能桌面端开着它），等它完成或点 ☰ 换个会话' : `发送失败：${e.message}`);
    return false;
  }
}

function flushQueue() {
  if (busy || !sendQueue.length || !curSession) return;
  const text = sendQueue.shift();
  renderQueue();
  doSend(text).then((ok) => {
    if (!ok) { sendQueue.unshift(text); renderQueue(); }
  });
}

// ── 发送 ──

async function send() {
  if (!curSession) { toast('先选择一个会话'); return; }
  let text = composer.value.trim();
  if (!text && !pendingImage) return;
  composer.value = '';
  composer.style.height = 'auto';
  // 待发附件：先上传到当前工作区，消息里带上文件路径（模型工具可直接读取该文件）
  if (pendingImage) {
    const img = pendingImage;
    clearAttach();
    try {
      const r = await api('upload', { method: 'POST', body: JSON.stringify({ name: img.name, dataBase64: img.base64, workspace: curWs }) });
      const kind = /\.(png|jpe?g|webp|gif|bmp)$/i.test(img.name) ? '图片' : '文件';
      text = text ? `${text}\n\n[${kind}已保存到 ${r.path}]` : `请查看${kind} ${r.path}`;
    } catch (e) {
      toast(`附件上传失败：${e.message}`);
      return;
    }
  }
  if (busy) {
    // 运行中：入队，回合结束后自动发出（官方排队交互）
    sendQueue.push(text);
    renderQueue();
    return;
  }
  const ok = await doSend(text);
  if (!ok) {
    composer.value = text;
    composer.dispatchEvent(new Event('input'));
  }
}

// ── 事件绑定 ──

$('btnSend').addEventListener('click', () => {
  if (busy) {
    // 运行中发送按钮即停止按钮（官方交互）
    if (!curSession) return;
    api(`sessions/${encodeURIComponent(curSession)}/stop`, { method: 'POST', body: '{}' })
      .then(() => toast('已请求停止'))
      .catch((e) => toast(`停止失败：${e.message}`));
    return;
  }
  send();
});
composer.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!busy) send(); }
});
composer.addEventListener('input', () => {
  composer.style.height = 'auto';
  composer.style.height = Math.min(composer.scrollHeight, 140) + 'px';
});
$('btnMenu').addEventListener('click', () => { loadAllSessions(); $('drawer').classList.add('open'); });
$('btnClose').addEventListener('click', () => $('drawer').classList.remove('open'));
$('drawer').addEventListener('click', (e) => { if (e.target.id === 'drawer') $('drawer').classList.remove('open'); });
$('btnNew').addEventListener('click', () => openSession(null));
$('attachClear').addEventListener('click', clearAttach);
// composer 底行：添加 / 权限模式 / 模型 / 思考档位（弹层锚定按钮上方）
$('btnAdd').addEventListener('click', (e) => { e.stopPropagation(); togglePop($('addMenu'), e.currentTarget, renderAddMenu); });
$('btnMode').addEventListener('click', (e) => { e.stopPropagation(); togglePop($('modeMenu'), e.currentTarget, renderModeMenu); });
$('btnModel').addEventListener('click', (e) => { e.stopPropagation(); togglePop($('modelMenu'), e.currentTarget, renderModelMenu); });
$('btnCtx').addEventListener('click', () => { closePops(); loadUsage(); });
$('btnThink').addEventListener('click', (e) => { e.stopPropagation(); togglePop($('thinkMenu'), e.currentTarget, renderThinkMenu); });
$('fileInput').addEventListener('change', async (e) => {
  const f = e.target.files?.[0];
  e.target.value = '';
  handleFilePicked(f);
});
$('btnUsage').addEventListener('click', () => { closePops(); loadUsage(); });
$('btnInfoClose').addEventListener('click', () => $('info').classList.remove('open'));
$('info').addEventListener('click', (e) => { if (e.target.id === 'info') $('info').classList.remove('open'); });
// ⋯ 溢出菜单
const moreMenu = $('moreMenu');
function closeMore() { moreMenu.classList.remove('open'); }
$('btnMore').addEventListener('click', (e) => {
  e.stopPropagation();
  const r = e.currentTarget.getBoundingClientRect();
  moreMenu.style.top = (r.bottom + 6) + 'px';
  moreMenu.style.right = Math.max(8, window.innerWidth - r.right) + 'px';
  moreMenu.classList.toggle('open');
});
document.addEventListener('click', (e) => { if (!moreMenu.contains(e.target)) closeMore(); });
$('miNew').addEventListener('click', () => { closeMore(); openSession(null); });
$('miPlugins').addEventListener('click', () => { closeMore(); openInfo('⧩ 插件', loadPlugins); });
$('miPlan').addEventListener('click', () => { closeMore(); openInfo('☰ 计划 / 上下文', loadPlan); });

// ── 项目 / 会话（官方 PC 侧边栏同款：按项目分组的单列表）──

let workspaces = [];      // config.workspaces（补齐还没有会话的项目行）
let curWs = localStorage.getItem('zcode.ws') ?? '';
let allSessions = [];     // 全项目会话（GET /api/sessions?all=1，每条带 workspacePath）
const projExpanded = new Map(); // 项目路径 → 是否展开全部会话

const FOLDER_SVG = '<svg class="ic sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4l2 2.5h8A1.5 1.5 0 0 1 20.5 9v8.5a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5v-11z"/></svg>';

function projName(p) {
  const base = String(p ?? '').split(/[\\/]/).filter(Boolean).pop();
  return base || '（默认）';
}

// 相对时间（官方：刚刚 / 6分 / 1小时 / 4天）
function fmtRel(ts) {
  const diff = Date.now() - Number(ts ?? 0);
  if (!ts || diff < 0) return '';
  if (diff < 60e3) return '刚刚';
  if (diff < 3600e3) return `${Math.floor(diff / 60e3)}分`;
  if (diff < 86400e3) return `${Math.floor(diff / 3600e3)}小时`;
  return `${Math.floor(diff / 86400e3)}天`;
}

async function loadAllSessions() {
  try {
    const r = await api('sessions?all=1');
    allSessions = r.sessions ?? [];
  } catch { /* 保留旧数据，下轮再试 */ }
  renderProjectList();
}

function sessRow(s, projectPath) {
  const running = s.busy || s.status === 'running';
  const item = el('div', 'sess' + (s.sessionId === curSession ? ' cur' : ''));
  if (running) { const sp = el('span', 'busy'); sp.innerHTML = SVG.spin; item.appendChild(sp); }
  item.appendChild(el('div', 't', s.title || '未命名会话'));
  item.appendChild(el('span', 'time', fmtRel(s.updatedAt)));
  item.addEventListener('click', () => openSession(s.sessionId, projectPath));
  return item;
}

function renderProjectList() {
  const box = $('projList');
  box.textContent = '';
  // 分组：workspacePath → sessions[]（接口已按 updatedAt 降序）
  const groups = new Map();
  for (const s of allSessions) {
    const key = s.workspacePath ?? '';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  }
  // 项目全集 = 有会话的项目 ∪ config.workspaces，按最近会话时间排序（官方布局）
  const entries = [...groups.entries()];
  for (const w of workspaces) {
    const p = String(w.path ?? '');
    if (!entries.some(([k]) => k === p)) entries.push([p, []]);
  }
  entries.sort((a, b) => (b[1][0]?.updatedAt ?? 0) - (a[1][0]?.updatedAt ?? 0));
  if (!entries.length) { box.appendChild(el('div', 'sysline', '还没有项目和会话')); return; }
  for (const [p, sessions] of entries) {
    const isCur = p === curWs;
    const row = el('div', 'wsrow' + (isCur ? ' cur' : ''));
    const fi = el('span', 'mi'); fi.innerHTML = FOLDER_SVG; row.appendChild(fi);
    row.appendChild(el('div', '', projName(p)));
    if (isCur) { const d = el('span', 'dot'); d.style.marginLeft = 'auto'; row.appendChild(d); }
    row.addEventListener('click', () => switchWorkspace(p));
    box.appendChild(row);
    // 每个项目平铺最近 3 条会话，「显示更多」展开全量（官方交互）
    const expanded = !!projExpanded.get(p);
    const list = expanded ? sessions : sessions.slice(0, 3);
    for (const s of list) box.appendChild(sessRow(s, p));
    if (sessions.length > list.length) {
      const more = el('button', 'morebtn', `显示更多（还有 ${sessions.length - list.length} 条）`);
      more.addEventListener('click', () => { projExpanded.set(p, true); renderProjectList(); });
      box.appendChild(more);
    } else if (expanded && sessions.length > 3) {
      const less = el('button', 'morebtn', '收起');
      less.addEventListener('click', () => { projExpanded.set(p, false); renderProjectList(); });
      box.appendChild(less);
    }
  }
}

// 切换项目：记住选择并重绘分组（数据已全量在本地，无需请求）
function switchWorkspace(ws) {
  if (ws === curWs) return;
  curWs = ws;
  try { localStorage.setItem('zcode.ws', curWs); } catch { /* 忽略 */ }
  renderProjectList();
}

async function loadWorkspaces() {
  try {
    const r = await api('workspaces');
    workspaces = r.workspaces ?? [];
  } catch { workspaces = []; }
  renderProjectList();
}

// ── 会话管理 ──

function setSessionTitle(t) {
  $('sessTitle').textContent = t || '未命名会话';
}

async function openSession(sessionId, wsPath) {
  try {
    // 打开已有会话：不传 workspace（引擎沿用会话自身所属项目，避免改绑）；
    // 新会话：落点为指定项目/当前项目。
    if (wsPath) {
      curWs = wsPath;
      try { localStorage.setItem('zcode.ws', curWs); } catch { /* 忽略 */ }
    }
    const body = sessionId ? { sessionId } : { sessionId: null, workspace: curWs };
    const r = await api('sessions', { method: 'POST', body: JSON.stringify(body) });
    curSession = r.sessionId;
    // 计时基准全部按新会话重置，避免上一会话的静默/收尾状态串线
    lastSseEventAt = Date.now();
    lastActivity = Date.now();
    finishedSince = 0;
    setSessionTitle(r.title);
    // 切换会话：清掉上一个会话残留的运行文案（运行态在下面按新会话实况恢复）
    setActivity('');
    // 会话设置（模型/思考档位/权限模式）：快照里直接带出，立即同步底行按钮
    if (r.settings && !r.settings.unavailable) {
      sessionSettings = r.settings;
      curMode = r.settings.mode?.current ?? curMode;
    }
    syncComposerChrome();
    refreshSettings(false); // 异步补齐上下文环数据（projection 为 0 时走 goal 回退）
    renderHistory(r.messages ?? []);
    // 恢复会话时对齐运行态：服务端 ring 为空（重启过）也能正确显示"运行中"
    const st = String(r.status ?? '').toLowerCase();
    const running = r.busy === true || st === 'running' || st === 'busy' || st === 'executing';
    // 外部（桌面端）驱动的回合：引擎 status 恒为 idle，但从存储里
    // 最后一条消息未以 step-finish 收尾可推断出"运行中"
    const foreignRunning = !running && turnLooksRunning(r.messages ?? []);
    if (running && !busy) {
      busySource = 'sse';
      busySince = r.busySince ?? Date.now();
      setBusy(true);
      notifyTaskState(true);
      startLiveTimers();
    } else if (foreignRunning && !busy) {
      busySource = 'inferred';
      busySince = Date.now();
      lastActivity = Date.now();
      setBusy(true);
      notifyTaskState(true);
      startLiveTimers();
    } else if (!running && !foreignRunning && busy && !sessionId) {
      busySource = null;
      setBusy(false);
    }
    // 只收新事件：历史已渲染，避免全量重放导致文本重复
    connectStream(curSession, r.lastSeq ?? -1);
    $('drawer').classList.remove('open');
    if (sessionId) toast('已恢复会话');
    renderProjectList();
    loadAllSessions();
    loadPlan();
  } catch (e) {
    toast(`打开会话失败：${e.message}`);
  }
}

// ── 启动：自动恢复最近会话（优先运行中的会话，刷新后进度不丢）──

(async function boot() {
  try {
    const state = await api('state');
    // 输入卡模型名（官方：GLM-5.3-Flash ▾）
    const model = String(state.model ?? '');
    const mm = model.match(/\/([^$/]+)(?:\$|$)/);
    $('modelName').textContent = mm ? mm[1] : (model || 'ZCode');
    // 权限模式初始色（会话打开后以会话设置为准）
    curMode = String(state.mode ?? '');
    syncModeUi();
    await loadWorkspaces();
    await loadAllSessions();
    // 校正 localStorage 里的项目：已不存在时回落到最近会话的项目
    const knownPaths = new Set([
      ...allSessions.map((s) => s.workspacePath ?? ''),
      ...workspaces.map((w) => String(w.path ?? '')),
    ]);
    if (!knownPaths.has(curWs)) {
      curWs = allSessions[0]?.workspacePath ?? workspaces[0]?.path ?? '';
      try { localStorage.setItem('zcode.ws', curWs); } catch { /* 忽略 */ }
    }
    // 优先恢复运行中的会话（页面刷新/重连后进度持续可见）；否则恢复最近一个（跨项目）
    const target = allSessions.find((s) => s.busy) ?? allSessions[0];
    if (target) await openSession(target.sessionId, target.workspacePath);
    else $('drawer').classList.add('open');
    startPolling();
  } catch (e) {
    toast(`初始化失败：${e.message}`);
    $('drawer').classList.add('open');
  }
})();
</script>
