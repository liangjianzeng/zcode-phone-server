// ── 设置同步 ──

function syncComposerChrome() {
  const cur = sessionSettings?.model?.current;
  if (cur) {
    const key = currentModelKey(cur);
    const opt = (sessionSettings.model.available ?? []).find((o) => currentModelKey(o) === key);
    $('modelName').textContent = opt?.label ?? cur.modelId ?? 'ZCode';
  }
  updateCtxRing();
  syncThinkUi();
  syncModeUi();
}

// 上下文用量指示环（官方：模型名左侧圆圈 = 上下文余量，点击看详情）
const CTX_RING_LEN = 56.55;
function updateCtxRing() {
  const ring = $('ctxRing');
  if (!ring) return;
  const proj = sessionSettings?.projection;
  const used = Number(proj?.contextUsed ?? 0);
  const win = Number(proj?.contextWindow ?? 0);
  const pct = win > 0 ? Math.min(100, Math.round((used / win) * 100)) : 0;
  ring.setAttribute('stroke-dashoffset', String(CTX_RING_LEN * (1 - pct / 100)));
  $('btnCtx').classList.toggle('hot', pct > 80);
  $('btnCtx').title = win > 0
    ? `上下文 ${fmtWan(used)} / ${fmtWan(win)}（${pct}%），点击查看`
    : '上下文用量';
}

async function refreshSettings(renderMenus = true) {
  if (!curSession) return;
  try {
    const s = await api(`sessions/${encodeURIComponent(curSession)}/settings`);
    // unavailable（会话未在本进程激活）时服务端仍可能带共享 DB 回退的
    // projection 和 model.current（该会话最后真实跑的模型）——只吸收这两项，
    // 模型菜单/档位保持现有值
    if (s && !s.unavailable) sessionSettings = s;
    else if (s && sessionSettings) {
      if (s.projection) sessionSettings.projection = s.projection;
      if (s.model?.current?.modelId) {
        sessionSettings.model = sessionSettings.model ?? {};
        sessionSettings.model.current = s.model.current;
      }
    }
  } catch { /* 保持现有设置 */ }
  // projection 为 0 时用 goal 快照回退：会话恢复后引擎的 projection 常报 0，
  // 而 goal 快照的 contextUsed/contextWindow 是真实值（用量面板同款回退）
  if (!Number(sessionSettings?.projection?.contextUsed)) {
    try {
      const g = await api(`sessions/${encodeURIComponent(curSession)}/goal`);
      const gs = g?.snapshot ?? {};
      if (Number(gs.contextWindow) > 0 && sessionSettings) {
        sessionSettings.projection = {
          contextUsed: gs.contextUsed ?? 0,
          contextWindow: gs.contextWindow ?? 0,
          totalTokenCount: gs.tokensUsed ?? 0,
          status: sessionSettings.projection?.status ?? '',
        };
      }
    } catch { /* 下次再试 */ }
  }
  syncComposerChrome();
}

// 文件附件：选择后挂到待发槽（发送时统一上传到工作区）
async function handleFilePicked(f) {
  if (!f) return;
  if (f.size > 10 * 1024 * 1024) { toast('文件超过 10MB，暂不支持'); return; }
  const buf = new Uint8Array(await f.arrayBuffer());
  let binary = '';
  for (let i = 0; i < buf.length; i += 0x8000) binary += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  pendingImage = { base64: btoa(binary), name: f.name, mime: f.type || 'application/octet-stream' };
  showAttachChip();
}

// ── 运行状态条 / 计时 ──

// 子代理运行计数（对照桌面 ConversationStatusPanel 的运行中子代理行）：
// busy 期间经 server 桥查 session/subagents（15s 节流，liveTimer 4s 驱动），
// 只读；引擎不支持（unavailable）时置位关闭，不再空转。
let subagentNote = '';
let baseActivity = '';
let subagentUnavailable = false;
let subagentLastAt = 0;
function setActivity(text) {
  baseActivity = text || '智能体正在执行任务…';
  $('turnActivity').textContent = baseActivity + subagentNote;
  const sa = document.getElementById('saAct'); // 可视状态行同步（#streamSpin 内，随行存在）
  if (sa) sa.textContent = baseActivity + subagentNote;
}
async function refreshSubagentNote() {
  if (!busy || subagentUnavailable || !curSession) return;
  const now = Date.now();
  if (now - subagentLastAt < 15000) return;
  subagentLastAt = now;
  try {
    const r = await api(`sessions/${encodeURIComponent(curSession)}/subagents`);
    if (r?.unavailable) { subagentUnavailable = true; if (subagentNote) { subagentNote = ''; setActivity(baseActivity); } return; }
    const list = r?.subagents ?? r?.agents ?? (Array.isArray(r) ? r : []);
    const running = list.filter((a) => !['completed', 'failed', 'error', 'cancelled', 'stopped'].includes(String(a?.status ?? '').toLowerCase()));
    const note = running.length ? ` · ${running.length} 个子代理` : '';
    if (note !== subagentNote) { subagentNote = note; setActivity(baseActivity); }
  } catch { /* 下个周期再试 */ }
}
function fmtElapsed(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return `已运行 ${s} 秒`;
  const m = Math.floor(s / 60);
  if (m < 60) return `已运行 ${m} 分 ${s % 60} 秒`;
  return `已运行 ${Math.floor(m / 60)} 时 ${m % 60} 分`;
}
function tickElapsed() {
  const t = busySince ? fmtElapsed(Date.now() - busySince) : '';
  $('turnElapsed').textContent = t;
  const se = document.getElementById('saEl'); // 可视状态行秒表同步
  if (se) se.textContent = t;
}
function markThinkDurations() {
  // 思考行补时长（回合结束/开始新思考时结算）
  const now = Date.now();
  for (const [partId, t0] of thinkTimers) {
    const lab = document.querySelector(`details.think[data-part="${partId}"] .tdur`);
    if (lab && !lab.textContent) lab.textContent = `持续了 ${Math.max(1, Math.round((now - t0) / 1000))} 秒`;
    thinkTimers.delete(partId);
  }
}

// busy 切换：
// - #turnStatus 显隐 + 哨兵词增删（旧版 App 桥据 DOM 中哨兵词判定运行态，必须随任务出现/消失）
// - 发送按钮三态：空闲=发送；运行中且有输入=排队发送（预备任务）；运行中且空=停止
// - 流末尾转圈指示
// - 已运行时长计时
function updateSendButton() {
  const btnSend = $('btnSend');
  const hasText = !!(composer.value.trim() || pendingImage);
  const mode = busy ? (hasText ? 'queue' : 'stop') : 'send';
  const stopSvg = '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>';
  const sendSvg = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 12l6-6 6 6"/></svg>';
  btnSend.classList.toggle('stop', mode === 'stop');
  const label = mode === 'stop' ? '停止' : mode === 'queue' ? '排队发送' : '发送';
  btnSend.setAttribute('aria-label', label);
  btnSend.title = label;
  btnSend.innerHTML = mode === 'stop' ? stopSvg : sendSvg;
}

// ── 本轮产出：回合内成功写出的文件集中到回合底部展示 ──
// 只突出文档/成果类（手机上点开即看），代码类条目可能太多 → 折叠为计数
let turnArtifacts = new Map(); // path → path（去重）
const DOC_ARTIFACT_RE = /\.(md|markdown|html?|txt|pdf|docx?|xlsx?|pptx?|csv|tsv|rtf|png|jpe?g|gif|webp|svg)$/i;
function addTurnArtifact(p) {
  const s = String(p ?? '');
  if (s && /\.[A-Za-z0-9]{1,8}$/.test(s)) turnArtifacts.set(s, s);
}

// ── 本回合更改文件卡（对照官方 changeSummary）──
// 只统计真正的改动类工具（写入/编辑/补丁），聚合"这一回合改了哪些文件"——
// 不与产出卡（成果文档）混列：改动是过程、产出是结果，分开看各自清晰。
let turnChanged = new Map(); // path → 改动次数
const EDIT_TOOL_RE = /^(write|edit|multiedit|multi-edit|applypatch|patch|notebookedit|notebook)$/i;
function addTurnChanged(p) {
  const s = String(p ?? '');
  if (!s || !/\.[A-Za-z0-9]{1,8}$/.test(s)) return;
  turnChanged.set(s, (turnChanged.get(s) ?? 0) + 1);
}
function toolFilePath(input) {
  return String(input?.file_path ?? input?.filePath ?? input?.path ?? input?.notebook_path ?? '');
}
// 回合簿记归属与去重（2026-11-03 幽灵卡修复）：
// turnSession —— 当前回合所属的会话。setBusy(false) 的结算（改动卡/产出卡/
//   结束线）只在它等于 curSession 时才画：切会话瞬间（含 await 窗口里旧会话
//   事件把 busy 拉回来的情况）回合结算绝不追画进新会话视图。
// turnCounted —— 已计入两卡的工具 callId。全量重绘 / 轮询补尾 / SSE tool.updated
//   三路都会反复喂同一工具，不去重时 chip 的 ×N 大半是轮询重放计数，且轮询
//   窗口尾巴会捎上上一回合的文件。
let turnSession = null;
let turnCounted = new Set(); // key: callId|path
function countTurnTool(callId, toolName, p, status) {
  const s = String(p ?? '');
  if (!s || status !== 'completed') return;
  const key = `${String(callId ?? '')}|${s}`;
  if (turnCounted.has(key)) return;
  turnCounted.add(key);
  addTurnArtifact(s);
  if (EDIT_TOOL_RE.test(String(toolName ?? ''))) addTurnChanged(s);
}

let lastTurnFailed = false; // turn.failed 置位：失败回合不画"本轮结束"线（红字 errline 就是终点）
// opts.keepCollections：恢复"仍在进行的回合"时用——renderHistory 刚从存储
// 重建了当轮的改动/产出计数，新回合清场会把它们连锅端掉（重开会话卡片清零）。
function setBusy(on, opts = {}) {
  const wasBusy = busy; // 回合边界判定：false→true 才是新回合（多个置 busy 路径都先改 busySince，不能拿它当边界）
  busy = on;
  const status = $('turnStatus');
  status.classList.toggle('on', on);
  let sent = document.getElementById('dshSentinel');
  if (on && !sent) {
    sent = el('span', 'vh', 'Deep diving');
    sent.id = 'dshSentinel';
    status.appendChild(sent);
  } else if (!on && sent) {
    sent.remove();
  }
  updateSendButton();
  $('crow').classList.toggle('busy', on);
  let spinRow = document.getElementById('streamSpin');
  if (on && !spinRow) {
    spinRow = el('div', 'streamspin');
    spinRow.id = 'streamSpin';
    spinRow.innerHTML = SVG.spin;
    const sa = el('span', 'sa-act'); sa.id = 'saAct'; // 可视活动文案（对照桌面 ChatLoading "Working"）
    const se = el('span', 'sa-el'); se.id = 'saEl';   // 可视耗时（秒表）
    spinRow.appendChild(sa); spinRow.appendChild(se);
    chat.appendChild(spinRow);
    setActivity(baseActivity); // 立即带上当前活动文案，不等下一个事件
    scrollBottom();
  } else if (!on && spinRow) {
    spinRow.remove();
    dropCaret(); // 回合结束：流式光标退场
  }
  if (on) {
    turnSession = curSession; // 回合归属登记（切换期重新接管也一样盖写，旧归属不带入）
    status.dataset.result = ''; // 新回合：清上一回合结果标记（DOM 桥读此判定 failed/settled）
    if (!busySince) busySince = Date.now();
    if (!wasBusy && !opts.keepCollections) { turnArtifacts.clear(); turnChanged.clear(); turnCounted.clear(); } // 新回合开始（false→true 才是边界）：产出只收集当轮，不跨回合积累
    tickElapsed();
    if (!elapsedTimer) elapsedTimer = setInterval(tickElapsed, 1000);
  } else {
    markThinkDurations();
    // 回合收尾（含轮询推断的收尾）：所有思考都已完成，折叠展开中的思考行
    collapseOpenThinks();
    status.dataset.result = lastTurnFailed ? 'failed' : 'ok'; // 回合结果标记：DOM 桥（App 熄屏通知）据此区分失败/完成
    if (subagentNote) { subagentNote = ''; setActivity(baseActivity); } // 子代理计数随回合复位
    // 回合结算归属闸：改动卡/产出卡/结束线只回放到回合所属会话。
    // 切会话时 abandonTurn 已把 busySince 清零 + 归属置空，这里再拿
    // turnSession 对一道，双保险（SSE reset/session.closed 等路径同样被兜住）。
    const settle = busySince && turnSession === curSession;
    // 本回合更改文件卡（对照官方 changeSummary：改了哪些文件一目了然）：
    // chip 沿用 .fileMention（App 成果桥按 class+title 接管点击直接打开文件）
    if (settle && turnChanged.size) {
      for (const old of chat.querySelectorAll('.turnchanges')) old.remove();
      const card = el('div', 'turnchanges');
      const tt = el('div', 'tt');
      tt.appendChild(el('span', '', '✏️ 本回合修改'));
      tt.appendChild(el('span', 'n', `${turnChanged.size} 个文件`));
      card.appendChild(tt);
      const chips = el('div', 'chips');
      for (const [p, n] of [...turnChanged.entries()].sort((a, b) => b[1] - a[1])) {
        const chipHost = el('span');
        chipHost.style.display = 'contents';
        fileChip(chipHost, p);
        if (n > 1) chipHost.querySelector('.fileMention')?.append(` ×${n}`);
        chips.appendChild(chipHost);
      }
      card.appendChild(chips);
      chat.appendChild(card);
      scrollBottom();
    }
    // 本轮产出卡：回合内成功写出的文档/成果集中排在回合最底部（点开即看）；
    // 代码/其他条目可能太多，折叠为计数。失败回合也照常展示（文件已存在）。
    if (settle && turnArtifacts.size) {
      const docs = []; const code = [];
      for (const p of turnArtifacts.keys()) (DOC_ARTIFACT_RE.test(p) ? docs : code).push(p);
      if (docs.length || code.length) {
        // 产出卡只保留当轮一份：新卡渲染前移除旧回合的卡（不跨回合积累）
        for (const old of chat.querySelectorAll('.turnarts')) old.remove();
        const card = el('div', 'turnarts');
        card.appendChild(el('div', 'tt', `📦 本轮产出${docs.length ? ` · ${docs.length} 个文档/成果` : ''}`));
        const chips = el('div', 'chips');
        for (const p of docs) fileChip(chips, p);
        card.appendChild(chips);
        if (code.length) {
          const d = document.createElement('details');
          d.appendChild(el('summary', '', `另有 ${code.length} 个代码/其他文件，点击展开`));
          const cc = el('div', 'chips');
          for (const p of code) fileChip(cc, p);
          d.appendChild(cc);
          card.appendChild(d);
        }
        chat.appendChild(card);
        scrollBottom();
      }
    }
    // 回合结束分隔线：转圈消失太不显眼，用户分不清智能体是干完了还是卡了。
    // ≥5 秒的回合在对话流末尾补一条结束线（带用时）；失败回合自带红字
    // errline 不重复画。SSE 收尾与轮询推断收尾（桌面驱动回合）都走这里。
    if (settle) {
      const durS = Math.max(1, Math.round((Date.now() - busySince) / 1000));
      if (durS >= 5 && !lastTurnFailed) {
        const dur = durS < 60 ? `${durS} 秒` : `${Math.floor(durS / 60)} 分 ${durS % 60} 秒`;
        chat.appendChild(el('div', 'turnend', `✓ 本轮结束 · 用时 ${dur}`));
        scrollBottom();
      }
    }
    // 无论结算是否渲染：收集状态在此统一释放，绝不带进下一个回合/会话
    turnChanged.clear();
    turnArtifacts.clear();
    turnCounted.clear();
    turnSession = null;
    lastTurnFailed = false;
    busySince = 0;
    if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
    $('turnElapsed').textContent = '';
    setActivity('');
  }
}

// ── 切会话：静默抛弃当前回合 ──
// setBusy(false) 的结算负责把改动卡/产出卡/结束线画回聊天流，若切会话时"顺手
// 复位"，旧回合的总结就会追画进新会话视图（空的新会话凭空出现别的会话的
// 35 个文件卡，2026-11-03 实锤）。开新会话/切会话/进远程只读一律走这里：
// busySince 与归属先清零让卡片闸失配，setBusy(false) 只剩收转圈/计时/按钮的
// UI 复位职责。运行中的回合不丢——会话重新打开时由 renderHistory 从存储
// 重建当轮计数、由 r.busySince 续时。
function abandonTurn() {
  busySource = null;
  busySince = 0;
  lastTurnFailed = false;
  finishedSince = 0;
  turnChanged.clear();
  turnArtifacts.clear();
  turnCounted.clear();
  subagentNote = ''; subagentLastAt = 0; // 切会话：子代理计数不带入新会话
  setBusy(false); // 幂等：非 busy 时仅做 UI 复位
}

// ── 消息渲染 ──

function ensureMsg(messageId, role) {
  let m = msgEls.get(messageId);
  if (m) {
    // part 事件先建了 assistant 壳、存储确认是用户消息：就地纠正角色与样式
    if (m.role !== role) { m.role = role; m.el.className = `msg ${role}`; if (role === 'user') bubbleOf(m); }
    return m;
  }
  const hero = chat.querySelector('.hero');
  if (hero) hero.remove();
  const wrap = el('div', `msg ${role}`);
  // 助手消息的正文段 / 思考行 / 工具行都是 wrap 的直接子节点：内容顺序 =
  // DOM 顺序（工具行不再单独垫到聊天流末尾——「工具后发的正文出现在工具行
  // 上面」的顺序错乱根因，2026-11-03）。用户消息保留单气泡容器（样式挂
  // .msg.user .bubble），正文段渲染进气泡内。
  const spinRow = document.getElementById('streamSpin');
  if (spinRow) chat.insertBefore(wrap, spinRow); else chat.appendChild(wrap);
  m = { el: wrap, bubble: null, parts: new Map(), partEls: new Map(), role, mid: messageId };
  if (role === 'user') { m.bubble = el('div', 'bubble'); wrap.appendChild(m.bubble); }
  msgEls.set(messageId, m);
  scrollBottom();
  return m;
}

// 用户气泡惰性容器（角色纠正为 user 后可能尚未建）；助手消息不用气泡
function bubbleOf(m) {
  if (!m.bubble) { m.bubble = el('div', 'bubble'); m.el.appendChild(m.bubble); }
  return m.bubble;
}

// App 桥兼容：文件 chip（class 含 fileMention，title = 完整路径）
function fileChip(container, p) {
  const name = p.split(/[\\/]/).pop() ?? p;
  const b = el('button', 'fileMention', name);
  b.setAttribute('title', p);
  b.addEventListener('click', (ev) => {
    // App 内：原生成果桥（artifactBridgeJs）在 document 冒泡阶段接管本点击
    // （按后缀分流查看器/下载页）。绝不能 stopPropagation——那会拦死桥，
    // chip 点击就"没有任何反应"。
    if (window.__dshArtifactBridge) return;
    ev.stopPropagation();
    // 浏览器环境降级为复制完整路径
    const fallback = () => toast(`文件：${p}`);
    try {
      navigator.clipboard.writeText(p).then(() => toast(`路径已复制：${p}`), fallback);
    } catch { fallback(); }
  });
  container.appendChild(b);
}

// ── 复制 / 分享（助手正文 + 成功的工具输出）──

// WebView 剪贴板：clipboard API 优先，execCommand 兜底（部分 WebView 权限收紧）
async function copyTextToClipboard(t) {
  try { await navigator.clipboard.writeText(t); toast('已复制到剪贴板'); return; } catch { /* 走兜底 */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    toast('已复制到剪贴板');
  } catch { toast('复制失败'); }
}

// Web Share API 优先（Android WebView 可用性不定），失败回落复制
async function shareOrCopy(t) {
  try {
    if (navigator.share) { await navigator.share({ text: t }); return; }
  } catch (e) { if (e?.name === 'AbortError') return; /* 用户取消分享面板 */ }
  await copyTextToClipboard(t);
  toast('当前环境不支持直接分享，已复制到剪贴板');
}

function collectMsgText(m) {
  return [...m.partEls.values()]
    .filter((v) => v.kind === 'text')
    .map((v) => String(v.raw ?? v.full ?? v.el.innerText ?? '').trim())
    .filter(Boolean).join('\n\n');
}

// 助手消息尾部的操作行（复制/分享/分叉）：只在"关键输出"上出现——任何时刻仅
// 最新一条带正文的助手消息持有，新正文到达即迁移（回合结束时正好落在
// 最终回复上）；用户气泡不加。
// ⚠️ 两道防抖纪律（违反任意一条 = 页面一抖一抖）：
// ① 只有持有者真正变化才动 DOM；② 轮询会反复带着"旧消息"进来，非最新
// 消息一律不迁移——否则操作行在 10 条消息间被反复搬动。
let actionsHolder = null;
// 分叉（对照官方消息"分叉"）：从该消息落库的 checkpoint 派生新会话，
// 引擎边界"任务运行中不可分叉"以服务端错误文案透出
async function forkFromMessage(mid) {
  if (!curSession) { toast('先选择一个会话'); return; }
  if (busy) { toast('回合结束后可分叉（运行中不可分叉）'); return; }
  showSwitching('正在分叉会话…');
  try {
    const r = await api(`sessions/${encodeURIComponent(curSession)}/fork`, {
      method: 'POST',
      body: JSON.stringify(mid ? { messageId: mid } : {}),
    });
    if (r?.unavailable) { hideSwitching(); toast(`分叉失败：${r.unavailable}`); return; }
    const sid = r?.forkedSessionId ?? r?.sessionId ?? '';
    if (!sid) { hideSwitching(); toast(`分叉失败：${JSON.stringify(r).slice(0, 120)}`); return; }
    toast('已分叉，正在打开新会话');
    await openSession(sid);
  } catch (e) {
    hideSwitching();
    toast(`分叉失败：${e.message}`);
  }
}
function buildMsgActionsRow(m) {
  const mkBtn = (label, icon, fn) => {
    const b = el('button'); b.innerHTML = icon + `<span>${label}</span>`;
    b.addEventListener('click', (ev) => { ev.stopPropagation(); fn(); });
    return b;
  };
  const row = el('div', 'msgacts');
  row.append(
    mkBtn('复制', SVG.copy, () => {
      const t = collectMsgText(m);
      if (!t.trim()) return toast('没有可复制的正文');
      copyTextToClipboard(t);
    }),
    mkBtn('分享', SVG.share, () => {
      const t = collectMsgText(m);
      if (!t.trim()) return toast('没有可分享的正文');
      shareOrCopy(t);
    }),
    mkBtn('分叉', SVG.flow, () => forkFromMessage(m.mid)),
  );
  return row;
}
function ensureMsgActions(m) {
  if (m.el.classList.contains('user')) return;
  // 按钮位置 = 紧跟"最后一段正文"之后（挨着复制对象的底部）：
  // 思考/工具行即使 DOM 顺序在其后，也不把按钮顶得远离正文
  const texts = [...m.partEls.values()].filter((v) => v.kind === 'text' && v.el?.isConnected);
  const lastText = texts[texts.length - 1];
  if (!lastText) return;
  let row = (m.el.querySelector('.msgacts')) || null;
  if (actionsHolder === m && row) {
    // 已是持有者：仅当出现了更新的正文段才搬动（未变化不动 DOM，防抖）
    if (row.previousElementSibling !== lastText.el) lastText.el.after(row);
    return;
  }
  const msgs = chat.querySelectorAll('.msg');
  if (!msgs.length || msgs[msgs.length - 1] !== m.el) return;
  for (const r of chat.querySelectorAll('.msgacts')) {
    if (r !== row) r.remove();
  }
  actionsHolder = m;
  lastText.el.after(row || buildMsgActionsRow(m));
}

function renderTextPart(m, partId, text) {
  let pe = m.partEls.get(partId);
  if (pe && pe.raw === String(text ?? '')) return pe; // 内容未变：跳过整段重建（轮询/重复事件的高频入口，无条件重建 = 页面抖动）
  if (!pe) {
    // 带 bubble 类：markdown / 代码块样式全挂在 .bubble 之下
    const div = el('div', 'bubble');
    div.__partId = partId;
    // 正文段是消息容器的直接子节点（内容序）；用户消息渲染进气泡内
    if (m.role === 'user') bubbleOf(m).appendChild(div); else m.el.appendChild(div);
    pe = { kind: 'text', el: div };
    m.partEls.set(partId, pe);
  }
  // 权威渲染：先冲掉挂起的流式合帧任务（其 pending 可能比本次参数旧/新
  // 半个 delta），以落库参数为准整段重画，最终状态不会被节流吞掉
  flushStreamRich(pe);
  pe.raw = String(text ?? ''); // 原始文本留存：复制/分享取这里而非 DOM（避免混入 chip 文案）
  pe.el.textContent = '';
  pe._cs = null; // 块缓存作废（流式增量渲染的复用账本，见 streamRich）
  richText(pe.el, text);
  if (!m.el.classList.contains('user')) ensureMsgActions(m);
  // 正文里的文件路径 → 可点击 chip
  // 路径字符集排除 CJK 与全角标点：否则"E:\xxx\yyy）中文说明…"会把整段中文
  // 吞进匹配，误渲染成文件 chip（Windows 路径含中文目录名时放弃识别，可接受）
  const found = String(text).match(/[A-Za-z]:\\[^\s"'，。；：！？、（）“”‘’\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]{3,}|(\/[\w.\-]+){2,}(\/[\w.\-]+)/g);
  if (found) for (const f of new Set(found).values()) fileChip(pe.el, f);
  return pe;
}

// 思考行（官方：🧠 思考 · 持续了几秒，可展开看过程）
// 折叠态显示时长 + 首行内容预览（tprev，展开时隐藏）——否则一屏"思考"占位
// 既不知道想了多久、也不知道想了什么
function ensureThink(m, partId) {
  let pe = m.partEls.get(partId);
  if (pe) return pe;
  const details = document.createElement('details');
  details.className = 'think';
  details.dataset.part = partId;
  const summary = document.createElement('summary');
  const ic = el('span'); ic.innerHTML = SVG.brain; ic.style.display = 'flex';
  summary.appendChild(ic);
  summary.appendChild(el('span', '', '思考'));
  summary.appendChild(el('span', 'tdur'));
  const prev = el('span', 'tprev');
  summary.appendChild(prev);
  const body = el('div', 'tbody');
  details.append(summary, body);
  // 思考行是消息容器的直接子节点：与正文段/工具行同层，按到达顺序排布
  if (m.role === 'user') bubbleOf(m).appendChild(details); else m.el.appendChild(details);
  pe = { kind: 'think', el: details, content: body, preview: prev };
  m.partEls.set(partId, pe);
  if (!thinkTimers.has(partId)) thinkTimers.set(partId, Date.now());
  // 最新思考自动展开跟看输出（用户要求：思考进行中要保持打开）；
  // 思考完成（工具/正文部件到达、回合结束）时由 collapseOpenThinks() 折叠。
  details.open = true;
  if (openThinkDetails && openThinkDetails !== details) openThinkDetails.open = false;
  openThinkDetails = details;
  return pe;
}
let openThinkDetails = null;

// 思考首行预览同步：取第一行非空文本截断。内容写入点（渲染/增量/直播）
// 各自调用，折叠态 summary 上能看到这段思考大概在想什么
function updateThinkPreview(pe) {
  if (!pe?.preview || !pe.content) return;
  const t = String(pe.content.textContent ?? '');
  pe.preview.textContent = (t.split('\n').find((l) => l.trim()) ?? '').trim().slice(0, 90);
}

// 折叠所有展开中的思考行：思考完成的时机 = 工具/正文部件到达 或 回合结束
function collapseOpenThinks() {
  for (const d of chat.querySelectorAll('details.think[open]')) d.open = false;
  openThinkDetails = null;
}

// 工具卡片（官方扁行道：[icon] 名称 命令摘要 …… 状态）
// m = 归属消息：卡片作为消息容器直接子节点渲染（内容序）。tool.updated 通道
// 不带 messageId，先到时以 m=null 在聊天流末尾占位；随后部件事件带归属进来
// 时"收养"进消息容器（appendChild 移动节点即换位），顺序自愈。
function toolCard(toolCallId, toolName, desc, m, parentId) {
  // 描述与工具名相同（无 input 摘要时兜底成了名字）就不重复展示
  if (desc && (desc === toolName || desc === toolLabel(toolName))) desc = '';
  const host = m && m.role !== 'user' ? m.el : null;
  const parent = parentId ? toolEls.get(parentId) : null;
  let t = toolEls.get(toolCallId);
  if (t) {
    if (toolName) t.name.textContent = toolLabel(toolName);
    if (desc) t.desc.textContent = desc;
    // 收养/换位：父卡存在时挂进父卡体（子代理嵌套），否则归属消息
    if (parent && t.el.parentElement !== parent.body) parent.body.appendChild(t.el);
    else if (!parent && host && t.el.parentElement !== host) host.appendChild(t.el);
    return t;
  }
  const details = document.createElement('details');
  details.className = 'tool pending';
  const summary = document.createElement('summary');
  const tico = el('span', 'tico');
  tico.innerHTML = toolIcon(toolName);
  const name = el('span', 'tname', toolLabel(toolName));
  const d = el('span', 'tdesc', desc ?? '');
  const state = el('span', 'tstate');
  summary.append(tico, name, d, state);
  const body = el('div', 'tbody');
  details.append(summary, body);
  if (parent) { details.classList.add('nested'); parent.body.appendChild(details); }
  else if (host) host.appendChild(details);
  else {
    const spinRow = document.getElementById('streamSpin');
    if (spinRow) chat.insertBefore(details, spinRow); else chat.appendChild(details);
  }
  t = { el: details, state, desc: d, name, body };
  toolEls.set(toolCallId, t);
  scrollBottom();
  return t;
}

// toolCallId → 归属消息：扫已渲染消息的部件数据（tool 部件带 callId）。
// tool.updated 事件不带 messageId，靠这个把状态/卡片归位到正确的消息里。
function findToolOwner(toolCallId) {
  const id = String(toolCallId);
  for (const m of msgEls.values()) {
    for (const p of m.parts.values()) {
      if (p?.type === 'tool' && String(p.callId) === id) return m;
    }
  }
  return null;
}

function setToolStatus(toolCallId, status, desc, detail) {
  const t = toolEls.get(toolCallId);
  if (!t) return;
  t.el.className = `tool ${status}`;
  if (desc !== undefined && desc !== null && desc !== '') t.desc.textContent = desc;
  t.state.innerHTML =
    status === 'running' ? SVG.spin :
    status === 'completed' ? SVG.check :
    status === 'error' || status === 'failed' ? SVG.cross : '';
  if (detail !== undefined && detail !== null && detail !== '') {
    const raw = String(detail);
    if (status === 'running') {
      // 运行中 progress 帧：60ms 合帧 + 末 12 行 tail 直播（对照桌面
      // ExecuteOutput 的贴底 tail）。之前每帧全量重建 4000 字符——
      // 打开着的工具卡肉眼闪烁、还平白多耗一倍解析
      t.__tail = raw;
      if (t.__tailTimer) return; // 已有挂帧：只刷新待渲染文本
      t.__tailTimer = setTimeout(() => {
        t.__tailTimer = null;
        const s = t.__tail ?? ''; t.__tail = null;
        if (!s || !t.el.isConnected) return;
        t.body.textContent = '';
        const pre = el('pre');
        const lines = s.replace(/\n+$/, '').split('\n');
        pre.textContent = (lines.length > 12 ? '…\n' : '') + lines.slice(-12).join('\n');
        t.body.appendChild(pre);
      }, 60);
    } else {
      if (t.__tailTimer) { clearTimeout(t.__tailTimer); t.__tailTimer = null; t.__tail = null; }
      t.body.textContent = '';
      const pre = el('pre'); pre.textContent = raw.slice(0, 4000);
      t.body.appendChild(pre);
    }
  }
  if (status === 'running') setActivity(`正在执行 ${t.name.textContent}`);
  scrollBottom();
}

// ── Edit/Write 工具 diff 视图（对照桌面 ToolCallBlocks/renderers/edit.tsx 的
// inline diff 卡）── 行级对比：公共前后缀裁剪 + 中段 LCS（规模受限才做 DP，
// 超限退化为整段替换块），渲染上限防长文件卡顿。
const DIFF_RENDER_CAP = 400;
function lineDiffRows(oldText, newText) {
  const a = String(oldText ?? '').split('\n');
  const b = String(newText ?? '').split('\n');
  // 尾部换行差异：'a\nb\n'.split 产生末尾空串，两边都有就不算实质差异
  if (a.length && a[a.length - 1] === '' && b.length && b[b.length - 1] === '') { a.pop(); b.pop(); }
  let p = 0;
  while (p < a.length && p < b.length && a[p] === b[p]) p++;
  let s = 0;
  while (s < a.length - p && s < b.length - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;
  const am = a.slice(p, a.length - s), bm = b.slice(p, b.length - s);
  const rows = [];
  for (let i = 0; i < p; i++) rows.push([' ', a[i], 'ctx']);
  if (am.length <= 240 && bm.length <= 240 && am.length * bm.length <= 24000) {
    // LCS DP → 删除/新增交错输出（贴近桌面 diff 阅读顺序）
    const n = am.length, m2 = bm.length;
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m2 + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m2 - 1; j >= 0; j--) {
      dp[i][j] = am[i] === bm[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
    let i = 0, j = 0;
    while (i < n && j < m2) {
      if (am[i] === bm[j]) { rows.push([' ', am[i], 'ctx']); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { rows.push(['-', am[i], 'del']); i++; }
      else { rows.push(['+', bm[j], 'add']); j++; }
    }
    while (i < n) { rows.push(['-', am[i], 'del']); i++; }
    while (j < m2) { rows.push(['+', bm[j], 'add']); j++; }
  } else {
    for (const l of am) rows.push(['-', l, 'del']);
    for (const l of bm) rows.push(['+', l, 'add']);
  }
  for (let i2 = a.length - s; i2 < a.length; i2++) rows.push([' ', a[i2], 'ctx']);
  return rows;
}

// 从工具输入构建 diff 卡；无可比内容（非 Edit/Write、空编辑）返回 null。
function buildDiffBlock(input, opts = {}) {
  if (!input || typeof input !== 'object') return null;
  const pairs = [];
  if (Array.isArray(input.edits) && input.edits.length) {
    for (const e of input.edits) pairs.push([e.old_string ?? e.oldString ?? '', e.new_string ?? e.newString ?? '']);
  } else if (input.old_string != null || input.oldString != null || input.oldText != null) {
    pairs.push([input.old_string ?? input.oldString ?? input.oldText ?? '', input.new_string ?? input.newString ?? input.newText ?? '']);
  } else if (opts.write) {
    const content = String(input.content ?? input.text ?? input.file_text ?? '');
    if (content) pairs.push(['', content]);
  }
  if (!pairs.length) return null;
  let add = 0, del = 0;
  const all = [];
  for (const [o, nw] of pairs) {
    if (!String(o) && !String(nw)) continue;
    for (const r of lineDiffRows(o, nw)) {
      if (r[2] === 'add') add++; else if (r[2] === 'del') del++;
      all.push(r);
    }
  }
  if (!add && !del) return null;
  const box = el('div', 'filediff');
  const head = el('div', 'dhead');
  head.appendChild(el('span', 'dstat-add', `+${add}`));
  head.appendChild(el('span', 'dstat-del', `−${del}`));
  if (opts.note) head.appendChild(el('span', 'dnote', opts.note));
  box.appendChild(head);
  const body = el('div', 'dbody');
  for (const [sign, text, cls] of all.slice(0, DIFF_RENDER_CAP)) {
    const ln = el('div', `dl ${cls}`);
    ln.appendChild(el('span', 'ds', sign));
    ln.appendChild(el('span', 'dc', text.length > 300 ? text.slice(0, 300) + '…' : text));
    body.appendChild(ln);
  }
  if (all.length > DIFF_RENDER_CAP) body.appendChild(el('div', 'dl more', `… 其余 ${all.length - DIFF_RENDER_CAP} 行省略`));
  box.appendChild(body);
  return box;
}

// 统一工具体填充（历史/轮询补尾/SSE 三路同口径）：Edit/MultiEdit/Write 类
// 优先 diff 视图；其余 pre>output（或 error）。status 决定 error/output 取哪路。
function fillToolBody(callId, toolName, status, st = {}, extraPath) {
  const t = toolEls.get(callId);
  if (!t) return null;
  const k = String(toolName ?? '').toLowerCase();
  const isEdit = /^(edit|multiedit|multi-edit|applypatch|patch|str_replace|str_replace_based_edit_tool|notebookedit)$/.test(k);
  const isWrite = /^(write|create_file|save_file)$/.test(k);
  t.body.textContent = '';
  const fp = extraPath ?? toolFilePath(st.input);
  if (fp) fileChip(t.body, String(fp));
  const diff = (isEdit || isWrite) ? buildDiffBlock(st.input, { write: isWrite, note: isWrite ? '新文件' : '' }) : null;
  if (diff) { t.body.appendChild(diff); return t; }
  let txt = status === 'error' ? (st.error ?? '') : (st.output ?? '');
  if (txt == null || String(txt) === '') txt = st?.input?.command ?? ''; // 无输出时 bash 类展示执行的命令
  if (String(txt) !== '') {
    const pre = el('pre');
    pre.textContent = String(txt).slice(0, 4000);
    t.body.appendChild(pre);
  }
  return t;
}

// 嵌套工具调用的父链（对照桌面 agent.tsx 子代理卡）：只存在于实时事件元数据
// （server-operations readProtocolStreamingParentToolUseId 的全部命名变体），
// 共享库落库 part 不含——历史渲染平铺，实时事件路挂进父 agent 行展开体。
function eventParentToolUseId(pl) {
  if (!pl || typeof pl !== 'object') return null;
  const meta = pl._meta && typeof pl._meta === 'object' ? pl._meta : {};
  const z = meta.zcode && typeof meta.zcode === 'object' ? meta.zcode : {};
  const cc = meta.claudeCode && typeof meta.claudeCode === 'object' ? meta.claudeCode : {};
  const md = pl.metadata && typeof pl.metadata === 'object' ? pl.metadata : {};
  const v = pl.parentToolUseId ?? pl.parentToolCallId
    ?? meta.parentToolUseId ?? meta.parentToolCallId
    ?? z.parentToolUseId ?? z.parentToolCallId
    ?? cc.parentToolUseId ?? cc.parentToolCallId
    ?? md.parentToolUseId ?? md.parentToolCallId ?? null;
  return v ? String(v) : null;
}

// ── 外部回合跟随（轮询共享会话存储）──
//
// 手机端引擎只能收到自己驱动的回合的 SSE 事件；桌面端驱动的回合不推事件
// （SSE 是进程内的），这是"页面静态、不同步"的根因。但引擎的会话存储是
// 共享的：回合内的工具/文本片段落盘即可从 session/messages 读到（实测
// 部件粒度实时落盘）。因此用轻量轮询做跟随：小 limit 探测最后一层指纹，
// 有变化才全量拉取重渲染；运行态按"最后部件是否 step-finish"推断。

let lastFingerprint = '';    // 最后渲染的消息尾部指纹（renderHistory 内更新）
// 历史分页（打开会话首屏只拉最近 histLimit 条，更早按需）：与 server HISTORY_INIT_PAGE 对齐
let histLimit = 40;
let histTotal = 0;
// SSE turn.started 回显的用户气泡（{mid, text, at}）：引擎落库后 renderTail/
// renderHistory 会用存储 messageId 重画同一条消息——不清理就是"发出一条回显两条"。
// 存储渲染同文本用户消息时移除对应回显气泡（60 秒窗口，连发两条相同内容也各自对齐）。
let sseUserEchoes = [];

// 最近自己发出的输入（doSend 成功 / turn.started 回显）：part 事件里的用户
// 输入文本部件据此识别并跳过——part 处理器把一切部件当 assistant 画，用户
// 消息会被画成两份（回显 + part 副本），存储接管后还残留一份错的
const recentOwnInputs = []; // {text, at}
function isOwnInput(text) {
  const now = Date.now();
  while (recentOwnInputs.length && now - recentOwnInputs[0].at > 5 * 60000) recentOwnInputs.shift();
  const t = String(text ?? '').replace(/\s+/g, ' ').trim();
  if (!t) return false;
  return recentOwnInputs.some((e) => e.text.replace(/\s+/g, ' ').trim() === t);
}

let busySource = null;       // 'sse' = 本引擎事件驱动；'inferred' = 轮询推断
let lastActivity = 0;        // 推断运行态最近一次见到存储变化的时刻
let lastSseEventAt = 0;      // 最近一次收到 SSE 事件（检测流静默/死亡）
let finishedSince = 0;       // 推断态首次见到"回合已收尾"指纹的时刻
let pollTimer = null;

// 引擎注入的合成消息（模型可见、UI 不可见）判定：TodoWrite 提醒、
// <task-notification>、<subagent-message> 等都带 visibility:"model-only"
// / semantics.uiVisibility:"hidden" 标记，页面上渲染出来就是
// "对话里夹杂大量尖括号命令代码"的来源。
function isHiddenMessage(info) {
  if (!info) return false;
  if (info.visibility === 'model-only' || info.metadata?.visibility === 'model-only') return true;
  if (info.semantics?.uiVisibility === 'hidden') return true;
  return false;
}

function visibleMessages(messages) {
  return (messages ?? []).filter((m) => !isHiddenMessage(m?.info));
}

function lastBusyMessage(messages) {
  for (let i = messages.length - 1; i >= 0; i--) {
    if (isHiddenMessage(messages[i]?.info)) continue; // 合成消息不参与运行态推断
    if ((messages[i].info?.role ?? 'assistant') !== 'user') return messages[i];
  }
  return null;
}

// 尾部指纹：最后一条"可见"消息（不限角色）的身份 + 末部件类型/状态/文本长度。
// ⚠️ 必须包含 user 消息：桌面端发出的指令没有 SSE 事件（F2），只落共享库——
// 指纹若只看 assistant，指令落库后 fp 不变、pollTick 早退，消息区永远不渲染它
// （要等首个 assistant 部件落库才捎带出现；回合失败/无响应时干脆永不出现）。
// 运行态判定（turnLooksFinished/turnLooksRunning）仍走 lastBusyMessage，不受影响。
function lastVisibleMessage(messages) {
  for (let i = (messages ?? []).length - 1; i >= 0; i--) {
    if (isHiddenMessage(messages[i]?.info)) continue;
    return messages[i];
  }
  return null;
}
function fingerprint(messages) {
  const m = lastVisibleMessage(messages ?? []);
  const parts = m?.parts ?? [];
  const lp = parts.at(-1);
  return [
    m?.info?.id ?? m?.info?.messageId ?? '?',
    m?.info?.role ?? '',
    parts.length,
    lp?.type ?? '',
    lp?.state?.status ?? '',
    (lp?.text ?? '').length,
  ].join(':');
}

// 回合是否已收尾：最后一条 assistant 消息以 step-finish 部件结尾
function turnLooksFinished(messages) {
  const m = lastBusyMessage(messages ?? []);
  if (!m) return true;
  const parts = m.parts ?? [];
  return parts.at(-1)?.type === 'step-finish';
}

// 最后一条 assistant 消息是否处于进行中（用于打开会话时恢复外部运行态）
function turnLooksRunning(messages) {
  const m = lastBusyMessage(messages ?? []);
  if (!m) return false;
  const parts = m.parts ?? [];
  if (!parts.length) return false;
  return parts.at(-1)?.type !== 'step-finish';
}

// 历史消息（/session/messages 的 MessageWithParts）
// ── 任务计划（官方桌面版 todo 面板）：DB todos 实时状态 + TodoWrite 事件即时刷新 ──
let curTodos = [];
let todoOpen = false;
// todoBar 的持久引用（历史上的坑：曾放进 chat 内，renderHistory 的
// textContent='' 会把节点从文档摘掉，getElementById 对 detached 节点
// 返回 null → appendChild(null) 崩溃。现已移到 chatCol 常驻表头位，
// 引用仍缓存于此，避免回归）
const todoBarEl = document.getElementById('todoBar');

async function refreshTodos(sid) {
  const target = sid ?? curSession;
  if (!target) return;
  try {
    const r = await api(`sessions/${encodeURIComponent(target)}/todos`);
    if (target !== curSession) return; // 会话已切换：丢弃过期结果
    curTodos = (r.todos ?? []).map((t) => ({
      content: String(t.content ?? ''),
      status: String(t.status ?? 'pending'),
    }));
    renderTodoBar();
  } catch { /* 端点缺失/会话未激活：保持现状 */ }
}

function renderTodoBar() {
  const bar = todoBarEl;
  if (!curSession || !curTodos.length) { bar.style.display = 'none'; return; }
  bar.style.display = 'block';
  const done = curTodos.filter((t) => t.status === 'completed').length;
  bar.classList.toggle('open', todoOpen);
  bar.querySelector('.chev').textContent = todoOpen ? '▾' : '▸';
  bar.querySelector('.thint').textContent = todoOpen ? '点击收起' : '点击展开';
  const cur = curTodos.find((t) => t.status === 'in_progress');
  const sum = cur ? `正在：${cur.content}` : (done === curTodos.length ? '全部完成' : '等待执行');
  // todo 内容是模型生成的文本：走 DOM 构造而非 innerHTML/insertAdjacentHTML
  // （计数徽标同函数前几行用 textContent 的纪律保持一致，消除注入面）
  // 用户文本（todo 内容/摘要）必须是 div.tsum 与 div.ti 下的裸文本节点：
  // App 注入桥按 span/p/td/li 的「单行纯文本像路径」劫持点击（preventDefault +
  // 拉起原生成果页），文本节点目标向上到 div 即脱钩（HTML 侧注释有完整说明）。
  const tsum = bar.querySelector('.tsum');
  tsum.textContent = '';
  tsum.appendChild(document.createTextNode(sum + ' '));
  tsum.appendChild(el('span', 'tnum', `${done}/${curTodos.length}`));
  const box = bar.querySelector('.titems');
  box.textContent = '';
  for (const t of curTodos) {
    const row = el('div', 'ti' + (t.status === 'completed' ? ' done' : '') + (t.status === 'in_progress' ? ' cur' : ''));
    const mk = el('span', 'mk' + (t.status === 'completed' ? ' done' : ''),
      t.status === 'completed' ? '✓' : t.status === 'in_progress' ? '●' : '○');
    row.appendChild(mk);
    row.appendChild(document.createTextNode(t.content));
    box.appendChild(row);
  }
}

// TodoWrite 工具事件到达：短延迟批量刷新（同一回合多次写入只刷一次）
let todoRefreshTimer = null;
function scheduleTodoRefresh() {
  if (todoRefreshTimer) return;
  todoRefreshTimer = setTimeout(() => {
    todoRefreshTimer = null;
    refreshTodos();
  }, 600);
}

// 消息元素稳定键（2026-11-04 气泡 ×N 重复事故的页面侧防线）：优先存储/引擎
// 注入的 messageId/id；id 缺失（异常通道/旧服务端）时退化为 role+时间+正文摘要
// 的确定性结构键——跨轮询恒定，ensureMsg 才能认出"同一条消息"复用元素。
// ⚠️ 绝不允许 Math.random() 兜底：随机 id = 每轮探测都是"新消息" = 尾部窗口
// 每次指纹变化整窗重贴一份（本次重复事故根因，工具行因 callId 去重幸免）。
function messageKey(msg) {
  const info = msg?.info ?? {};
  const mid = String(info.messageId ?? info.id ?? '');
  if (mid) return mid;
  let t = '';
  for (const p of msg?.parts ?? []) if (p?.type === 'text') t += String(p.text ?? '');
  let h = 5381;
  for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) >>> 0;
  return 'c:' + (info.role ?? 'a') + ':' + (info.time ?? '') + ':' + t.length + ':' + h.toString(36);
}

function renderHistory(messages, opts = {}) {
  chat.textContent = '';
  findClear(); // 全量重绘前清查找高亮（mark 节点已随 DOM 销毁，只复位状态）
  // 任务计划条已移出滚动容器（chatCol 的常驻表头），全量重绘不会动它
  for (const t of toolEls.values()) if (t.__tailTimer) { clearTimeout(t.__tailTimer); t.__tailTimer = null; } // 运行中工具的 live-tail 挂帧随重绘作废
  msgEls.clear(); toolEls.clear(); thinkTimers.clear();
  sseUserEchoes = []; // 全量重绘，SSE 回显气泡已随 DOM 清掉
  // 更新尾部指纹：轮询跟随以这里为准（打开会话/重连重同步/轮询全量拉取共用）
  lastFingerprint = fingerprint(messages);
  // 思考块由 ensureThink 渲染（最新一条展开）；重绘收尾时若会话空闲则统一折叠（见函数末尾）
  const vis = visibleMessages(messages);
  if (!vis.length) {
    const hero = el('div', 'hero');
    // 空会话标明所属项目空间：新会话首回合落库前抽屉里没有它的行，
    // 这里是唯一能看出"这个会话属于哪个项目"的地方
    hero.innerHTML = '<div class="bigz">Z</div><div class="t1">ZCode Phone</div>'
      + '<div class="t2">这个会话还没有消息' + (curWs ? ' · 项目 ' + projName(curWs) : '') + '</div>';
    chat.appendChild(hero);
    return;
  }
  // "本回合"簿记窗口：最后一条用户消息（回合边界）之后的工具才允许计入
  // 改动/产出卡——此前开窗把窗口内所有历史工具灌进 map，卡片内容张冠李戴
  let turnStart = 0;
  for (let i = vis.length - 1; i >= 0; i--) {
    if ((vis[i].info?.role ?? '') === 'user') { turnStart = i + 1; break; }
  }
  for (let vi = 0; vi < vis.length; vi++) {
    const msg = vis[vi];
    const role = msg.info?.role ?? 'assistant';
    const mid = messageKey(msg);
    const m = ensureMsg(mid, role === 'user' ? 'user' : 'assistant');
    for (const part of msg.parts ?? []) {
      switch (part.type) {
        case 'text': renderTextPart(m, String(part.partId ?? mid + '-t'), part.text ?? ''); break;
        case 'reasoning': {
          const pidR = String(part.partId ?? mid + '-r');
          const existedR = m.partEls.has(pidR);
          const pe = ensureThink(m, pidR);
          pe.content.textContent = part.text ?? '';
          updateThinkPreview(pe);
          if (!existedR) thinkTimers.delete(pidR); // 存储整段落库的思考无真实起始时刻，不冒充"持续了 X 秒"
          break;
        }
        case 'tool': {
          const st = part.state ?? {};
          // TodoWrite 不渲染工具行，但刷新任务计划条
          if (String(part.tool ?? '').toLowerCase() === 'todowrite') { scheduleTodoRefresh(); break; }
          // 工具键：引擎落库部件原生 callID（大写）——服务端已归一 callId，
          // 这里再兜底一次（旁路数据/旧缓存防串键折叠成一行）
          const cid = String(part.callId ?? part.callID ?? `p${part.partId ?? mid + '-t'}`);
          // 工具行到达 = 之前的思考已完成：折叠展开中的思考
          collapseOpenThinks();
          const card = toolCard(cid, part.tool, inputSummary(st.input) || st.title || '', m, eventParentToolUseId(part));
          const status = st.status ?? 'pending';
          setToolStatus(cid, status, undefined, undefined);
          // 工具体三路同口径（Edit/Write diff 视图 + 文件 chip），见 fillToolBody
          fillToolBody(cid, part.tool, status, st);
          const fp = st?.input?.file_path ?? st?.input?.filePath ?? st?.input?.path;
          if (fp && vi >= turnStart) countTurnTool(cid, part.tool, String(fp), status);
          break;
        }
        default: break;
      }
    }
  }
  // 全量重绘后：空闲会话的历史思考都已完成 → 全部折叠；
  // 忙碌中（打开运行中的会话/断线重同步）则保留"最新思考展开"跟着输出
  if (!busy && !opts.keepThinkOpen) collapseOpenThinks();
  // 上方还有历史 → 顶部挂「加载更早」（打开时只拉了最近 histLimit 条，
  // 大会话全量 9.7MB 是打开慢的主因；更早的按需拉，见 loadOlderMessages）
  if (histTotal > histLimit && vis.length) {
    const btn = el('button', 'morebtn', `加载更早消息（上方还有 ${histTotal - histLimit} 条）`);
    btn.style.margin = '0 0 10px 0';
    btn.addEventListener('click', () => loadOlderMessages());
    chat.insertBefore(btn, chat.firstChild);
  }
  // 长会话渲染瘦身：屏外消息跳过布局/绘制（>80 条才挂，避免小会话白白
  // 引入屏外高度估算）。触顶续拉的滚动锚定实测有抖动就摘掉这两行
  chat.classList.toggle('cvchat', vis.length > 80);
  if (!opts.noAutoScroll) scrollBottom(true); // 打开/重同步会话：回到最新消息（不受用户滚动守卫限制）
}

// 「加载更早」：histLimit 窗口一次多取 80 条重建对话；滚动锚定在原位置
// （renderHistory 默认 rAF 强制滚底，此场景传 noAutoScroll 后手动补偿高度差）
let olderLoading = false;
async function loadOlderMessages() {
  if (!curSession || olderLoading) return;
  if (histTotal <= histLimit) return;
  olderLoading = true;
  const sid = curSession;
  histLimit = Math.min(histLimit + 80, histTotal);
  try {
    const r = await api(`sessions/${encodeURIComponent(sid)}/messages?limit=${histLimit}`);
    if (curSession !== sid) return; // await 期间已切会话：作废
    histTotal = Number(r.total ?? histTotal);
    const h0 = chat.scrollHeight, t0 = chat.scrollTop;
    renderHistory(r.messages ?? [], { keepThinkOpen: !!busy, noAutoScroll: true });
    chat.scrollTop = t0 + (chat.scrollHeight - h0);
  } catch { /* 失败保持原渲染 */ }
  finally { olderLoading = false; }
}

// 上拉（滚到顶部）自动加载更多：距顶 ≤80px 即续拉，不必点按钮（按钮是手动兜底）。
// 防误触发：renderHistory 后 800ms 内忽略（打开会话瞬间 scrollTop 还没被 rAF 推底，
// 否则一开就误判"到顶"连环拉）；远程只读视图不自动拉。
let histRenderedAt = 0;
chat.addEventListener('scroll', () => {
  if (remoteView || olderLoading) return;
  if (histTotal <= histLimit) return;
  if (Date.now() - histRenderedAt < 800) return;
  if (chat.scrollHeight <= chat.clientHeight + 100) return; // 没溢出屏幕谈不上拉
  if (chat.scrollTop <= 80) loadOlderMessages();
});

function renderCtxBar(body, snap) {
  const used = snap.contextUsed, win = snap.contextWindow;
  if (!(win > 0)) return;
  const pct = Math.min(100, Math.round((used / win) * 100));
  const bar = el('div', 'ctxbar');
  bar.innerHTML = `<div style="font-size:11.5px;color:var(--faint);margin-bottom:4px;">上下文占用 ${used ?? 0} / ${win} tokens（${pct}%）</div>` +
    `<div style="height:5px;border-radius:3px;background:var(--line);overflow:hidden;"><div style="height:100%;width:${pct}%;background:${pct > 80 ? 'var(--err)' : 'var(--accent)'};"></div></div>`;
  body.appendChild(bar);
}

async function loadPlan() {
  if (!curSession) return;
  try {
    const r = await api(`sessions/${encodeURIComponent(curSession)}/goal`);
    const text = typeof r === 'string' ? r : (r.goal ?? r.response ?? r.text ?? r.plan ?? (r.unavailable ? '' : ''));
    const snap = r.snapshot ?? {};
    const has = (text && !/no goal is set/i.test(text)) || snap.contextUsed > 0;

      const body = $('infoBody');

      body.appendChild(el('div', '', has && text ? text : '（本轮尚未设定目标）'));
      renderCtxBar(body, snap);
    }
  } catch { /* 降级：无计划面板 */ }
}

function renderKvList(obj) {
  // 展平所有层级：嵌套对象以 a.b.c 键名内联展示，不丢任何字段
  const body = $('infoBody');
  body.textContent = '';
  const rows = [];
  const walk = (o, prefix) => {
    for (const [k, v] of Object.entries(o ?? {})) {
      const key = prefix ? `${prefix}.${k}` : k;
      if (v && typeof v === 'object') walk(v, key);
      else rows.push([key, String(v)]);
    }
  };
  walk(obj, '');
  if (!rows.length) { body.appendChild(el('div', 'sysline', '暂无数据')); return; }
  for (const [k, v] of rows) {
    const row = el('div', 'kv');
    row.appendChild(el('div', 'k', k));
    row.appendChild(el('div', 'v', v));
    body.appendChild(row);
  }
}

// 用量/上下文容量面板（对照官方：容量大卡 + 分类占比 + 统计 + 压缩入口）
// 上下文/套餐弹卡（审批卡风格，锚在模型旁圆圈上方）：
// 上下文容量（KV 占用）+ 账户套餐当前余额。不开侧栏抽屉。
// 打开/关闭由通用 togglePop（btnCtx）负责；这里只负责渲染内容。
async function loadUsage(silent = false) {
  const pop = $('ctxPop');
  if (silent && !pop.classList.contains('open')) return;
  if (!silent) { pop.textContent = ''; pop.appendChild(el('div', 'sysline', '加载中…')); }
  let settings = null, goal = null, plan = null;
  try { settings = curSession ? await api(`sessions/${encodeURIComponent(curSession)}/settings`) : null; } catch { /* 降级 */ }
  // projection 为 0（会话未在本进程激活过）时，goal 快照的 contextUsed 是更可靠来源
  if (!settings?.projection?.contextUsed) {
    try { goal = curSession ? await api(`sessions/${encodeURIComponent(curSession)}/goal`) : null; } catch { /* 降级 */ }
  }
  // 套餐 + 当前余额（z.ai 计费接口，真实数据）
  try { plan = await api('plan'); } catch { /* 降级 */ }
  if (settings && !settings.unavailable) { sessionSettings = settings; syncComposerChrome(); }
  else if (settings?.model?.current?.modelId && sessionSettings) {
    // unavailable：吸收共享库回退的"实际在跑模型"，模型名不再滞留上一个会话的值
    sessionSettings.model = sessionSettings.model ?? {};
    sessionSettings.model.current = settings.model.current;
    syncComposerChrome();
  }
  // 回来了弹卡已关（用户点了别处）：不重绘
  if (!pop.classList.contains('open')) return;
  // 行构造（label 左、值右）
  const row = (k, v) => {
    const r = el('div', 'row');
    r.appendChild(el('span', '', k));
    r.appendChild(el('span', 'v', v));
    return r;
  };
  pop.textContent = '';
  // ── 上下文容量（本轮会话 KV 占用）──
  // settings unavailable（会话未在本进程激活）时服务端也会带 projection
  // （共享 DB 回退值），此时不可整包丢弃，只跳过模型/档位同步
  const proj = settings?.projection;
  const gctx = goal?.snapshot ?? {};
  const used = Number(proj?.contextUsed ?? gctx.contextUsed ?? 0);
  const win = Number(proj?.contextWindow ?? gctx.contextWindow ?? 0);
  pop.appendChild(el('div', 's2', '上下文容量'));
  if (win > 0) {
    const pct = Math.min(100, Math.round((used / win) * 100));
    const big = el('div', '', `${fmtWan(used)} / ${fmtWan(win)}`);
    big.className = 'bignum';
    pop.appendChild(big);
    pop.appendChild(el('div', 'sub', `已占用 ${pct}%${pct > 80 ? '，接近上限，建议压缩上下文' : ''}`));
    const bar = el('div', 'cbar');
    const fill = el('div');
    fill.style.width = pct + '%';
    if (pct > 80) fill.style.background = 'linear-gradient(90deg, #f85149, #d29922)';
    bar.appendChild(fill);
    pop.appendChild(bar);
  } else {
    pop.appendChild(el('div', 'sub', '暂无数据（回合开始后统计）'));
  }
  // ── Token 构成（对照桌面 ChatContextUsage：input/output/reasoning/cache 分段 +
  // 缓存命中率；数据 = 共享库 turn_usage 会话聚合，/usageBreakdown）──
  try {
    const tk = curSession ? await api(`sessions/${encodeURIComponent(curSession)}/usageBreakdown`) : null;
    if (curSession && tk && !tk.unavailable && pop.classList.contains('open')) {
      const total = tk.input + tk.output + tk.reasoning + tk.cacheRead + tk.cacheWrite;
      if (total > 0) {
        pop.appendChild(el('div', 's2', 'Token 构成'));
        const segs = [
          ['缓存读', tk.cacheRead, 'var(--link)'],
          ['输入', tk.input, 'var(--accent)'],
          ['缓存写', tk.cacheWrite, 'var(--tok-key)'],
          ['输出', tk.output, 'var(--ok)'],
          ['思考', tk.reasoning, 'var(--warn)'],
        ].filter(([, v]) => v > 0);
        const bar = el('div', 'tkseg');
        for (const [, v, c] of segs) {
          const s = el('i');
          s.style.width = Math.max(1.5, (v / total) * 100) + '%';
          s.style.background = c;
          bar.appendChild(s);
        }
        pop.appendChild(bar);
        for (const [name, v] of segs) pop.appendChild(row(name, fmtWan(v)));
        const hit = tk.input + tk.cacheRead + tk.cacheWrite > 0
          ? Math.round((tk.cacheRead / (tk.input + tk.cacheRead + tk.cacheWrite)) * 100)
          : 0;
        pop.appendChild(row('缓存命中率', `${hit}%（${tk.turns} 个回合）`));
      }
    }
  } catch { /* 构成不可用：静默跳过 */ }
  // ── 账户套餐当前余额（billing/balance 的 remaining/total，随推理实时变化）──
  pop.appendChild(el('div', 's2', '账户套餐'));
  const balances = plan?.balances ?? [];
  const plans = plan?.plans ?? [];
  if (balances.length) {
    const sumRem = balances.reduce((a, b) => a + b.remainingUnits, 0);
    const sumTot = balances.reduce((a, b) => a + b.totalUnits, 0);
    const sumUsed = balances.reduce((a, b) => a + b.usedUnits, 0);
    const unit = balances[0].unitType === 'token' ? 'tokens' : (balances[0].unitType || 'tokens');
    const big = el('div', '', `${fmtWan(sumRem)} / ${fmtWan(sumTot)}`);
    big.className = 'bignum';
    pop.appendChild(big);
    const pct = sumTot > 0 ? Math.min(100, Math.round((sumUsed / sumTot) * 100)) : 0;
    pop.appendChild(el('div', 'sub', `剩余 ${unit} · 已用 ${pct}%`));
    const bar = el('div', 'cbar');
    const fill = el('div');
    fill.style.width = pct + '%';
    if (pct > 80) fill.style.background = 'linear-gradient(90deg, #f85149, #d29922)';
    bar.appendChild(fill);
    pop.appendChild(bar);
    // 多个额度桶（如一次性礼包 + 周期额度）时逐桶列出
    if (balances.length > 1) {
      for (const b of balances) {
        pop.appendChild(row(b.showName || '模型额度', `${fmtWan(b.remainingUnits)} / ${fmtWan(b.totalUnits)}`));
      }
    }
  } else if (plans.length) {
    // 余额接口无数据：降级显示 billing/current 的 grant 总额
    for (const pl of plans.filter((p) => p.status === 'active' || p.status)) {
      const nm = el('div', '', `${pl.name}${pl.status !== 'active' ? `（${pl.status}）` : ''}`);
      nm.className = 'bignum';
      pop.appendChild(nm);
      for (const en of pl.entitlements ?? []) {
        pop.appendChild(row(
          `${en.model || '模型额度'}${en.period === 'one_time' ? ' · 一次性' : ''}`,
          `${fmtWan(en.grantUnits)} ${en.unitType === 'token' ? 'tokens' : en.unitType}`));
      }
    }
  } else {
    pop.appendChild(el('div', 'sub', plan?.unavailable ? `套餐余额暂不可用：${plan.unavailable}` : '暂无套餐数据'));
  }
  // 有效期（取 active 套餐最早的到期时间）
  const activePlan = plans.find((p) => p.status === 'active') ?? plans[0];
  if (activePlan?.endsAt > 0) {
    const d = new Date(activePlan.endsAt * 1000);
    pop.appendChild(row('有效期至', `${d.toLocaleDateString()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`));
  }
  // ── 压缩上下文入口 ──
  if (curSession) {
    const cbtn = el('button', 'primary', '压缩上下文');
    cbtn.style.cssText = 'margin:12px 0 2px;width:100%;';
    cbtn.addEventListener('click', async () => {
      cbtn.disabled = true;
      try {
        await api(`sessions/${encodeURIComponent(curSession)}/compact`, { method: 'POST', body: '{}' });
        toast('已请求压缩上下文');
        loadUsage(true);
      } catch (e) { toast(`压缩失败：${e.message}`); }
      cbtn.disabled = false;
    });
    pop.appendChild(cbtn);
  }
}

// 技能列表（「选择技能」→ 点击以 $ 名 插入输入框）
async function loadSkills() {

    if (r.unavailable) { body.textContent = ''; body.appendChild(el('div', 'sysline', `引擎暂不支持：${r.unavailable}`)); return; }
    body.textContent = '';
    const list = r.skills ?? [];
    if (!list.length) { body.appendChild(el('div', 'sysline', '当前工作区没有可用技能')); return; }
    for (const s of list) {

      const i = el('span', 'mi'); i.innerHTML = SVG.dollar; row.appendChild(i);
