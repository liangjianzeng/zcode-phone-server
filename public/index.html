// ── 实时事件处理 ──

function handleZcodeEvent(ev) {
  lastSseEventAt = Date.now();
  // 会话守卫：切换会话瞬间旧流的在途事件不得渲染进新会话视图（串台）
  if (ev.sessionId && curSession && ev.sessionId !== curSession) return;
  // 页面中途打开/刷新时可能错过 turn.started（回合由桌面端等外部驱动）：
  // 收到任何回合内活动事件就恢复运行态，保证进度条/停止按钮/计时可见
  if (!busy && (ev.type === 'part.started' || ev.type === 'part.upserted' ||
      ev.type === 'part.delta' || ev.type === 'tool.updated')) {
    busySince = Date.now();
    setBusy(true);
    notifyTaskState(true);
    startLiveTimers();
  }
  switch (ev.type) {
    case 'turn.started': {
      const input = ev.payload?.input;
      // 限流自动重试的重发（inputId 带 __retry 标记）：同一内容的用户气泡
      // 首次失败前已渲染过，跳过回显避免"一条消息连发两个"
      const isRetryEcho = String(ev.payload?.inputId ?? '').startsWith('__retry');
      if (input && ev.payload?.inputVisibility !== 'hidden' && !isRetryEcho) {
        const mid = `user-${ev.seq}`;
        const m = ensureMsg(mid, 'user');
        bubbleOf(m).textContent = String(input);
        sseUserEchoes.push({ mid, text: String(input), at: Date.now() });
        recentOwnInputs.push({ text: String(input), at: Date.now() });
        scrollBottom();
      }
      busySince = Date.now();
      busySource = 'sse';
      setBusy(true);
      notifyTaskState(true);
      startLiveTimers();
      break;
    }
    case 'part.started':
    case 'part.upserted': {
      const part = ev.payload?.part;
      if (!part?.messageId) break;
      let m = msgEls.get(String(part.messageId));
      const isNewMsg = !m;
      m = ensureMsg(String(part.messageId), 'assistant');
      // 用户输入的文本部件：不渲染。part 处理器把一切部件当 assistant 画，
      // 会把用户消息画成第二份（回显之外再多一个）；标记 ownPart 后由
      // dropMatchingUserEcho 在存储渲染时按文本对齐清理
      if (part.type === 'text' && (m.role === 'user' || (isNewMsg && isOwnInput(part.text)))) {
        m.role = 'user'; m.el.className = 'msg user'; m.ownPart = true;
        m.parts.set(part.partId, part);
        break;
      }
      const isNewPart = !m.parts.has(part.partId);
      m.parts.set(part.partId, part);
      // 思考完成 = 同一回合的下一个非思考部件到达：折叠所有展开中的思考
      if (isNewPart && part.type !== 'reasoning') collapseOpenThinks();
      if (part.type === 'text') {
        // 直播正文去重（与思考行同款，见 settleLiveText）：落库副本追平
        // 直播块前只记数据不渲染，否则同一段正文两块同步增长直到回合结束
        if (!settleLiveText(m)) break;
        const pid = String(part.partId);
        const pe = m.partEls.get(pid);
        if (pe && pe.raw === String(part.text ?? '')) break; // 未变化：不动 DOM
        if (pe) { streamRich(pe, part.text ?? ''); ensureMsgActions(m); } // 增长：走合帧，不整段重建
        else renderTextPart(m, pid, part.text ?? '');
      }
      else if (part.type === 'reasoning') {
        // 直播思考还在增长、落库副本未追平：只记录数据不渲染副本，
        // 否则同一思考出现两块（直播一块 + 落库一块），轮询清理前一直重复
        const live = m.partEls.get('__live-think');
        const liveLen = live ? (live.content?.textContent ?? '').length : 0;
        const t = String(part.text ?? '');
        if (live && t.length < liveLen) break;
        if (live) {
          live.el.remove();
          m.partEls.delete('__live-think');
          thinkTimers.delete('__live-think');
        }
        const pe = ensureThink(m, String(part.partId));
        if (t) pe.content.textContent = t;
        updateThinkPreview(pe);
      }
      else if (part.type === 'tool') {
        const st = part.state ?? {};
        if (String(part.tool ?? '').toLowerCase() === 'todowrite') {
          scheduleTodoRefresh();
        } else {
          const cid = String(part.callId ?? part.callID ?? `p${part.partId ?? messageId + '-t'}`);
          toolCard(cid, part.tool, inputSummary(st.input) || st.title || '', m, eventParentToolUseId(part));
          const stt = st.status ?? 'pending';
          setToolStatus(cid, stt, undefined, undefined);
          fillToolBody(cid, part.tool, stt, st);
        }
      }
      scrollBottom();
      break;
    }
    case 'part.delta': {
      const { messageId, partId, field, delta } = ev.payload ?? {};
      if (!delta) break;
      const m = msgEls.get(String(messageId));
      if (!m || m.role === 'user') break; // 用户消息部件不走 delta 渲染
      const p = { ...(m.parts.get(partId) ?? {}) };
      if (field === 'text' || field === undefined) p.text = (p.text ?? '') + delta;
      p.partId = partId;
      m.parts.set(partId, p);
      const pe = m.partEls.get(String(partId));
      if (pe?.kind === 'text') {
        streamRich(pe, p.text ?? '');
      } else if (pe?.kind === 'think') {
        pe.content.textContent = p.text ?? '';
        updateThinkPreview(pe);
      } else if (!pe && p.type === 'text') {
        if (!settleLiveText(m)) break;
        renderTextPart(m, String(partId), p.text ?? '');
      } else if (!pe && p.type === 'reasoning') {
        // 与思考行 upserted 分支同款去重：落库思考追平直播块才接管渲染
        const live = m.partEls.get('__live-think');
        const liveLen = live ? (live.content?.textContent ?? '').length : 0;
        const t = String(p.text ?? '');
        if (live && t.length < liveLen) break;
        if (live) { live.el.remove(); m.partEls.delete('__live-think'); thinkTimers.delete('__live-think'); }
        const peR = ensureThink(m, String(partId));
        peR.content.textContent = t;
        updateThinkPreview(peR);
      }
      scrollBottom();
      break;
    }
    case 'tool.updated': {
      const p = ev.payload ?? {};
      if (p.kind === 'batch') break;
      // TodoWrite 不渲染工具行，但刷新任务计划条
      if (String(p.toolName ?? '').toLowerCase() === 'todowrite') { scheduleTodoRefresh(); break; }
      // 工具开始执行 = 之前的思考已完成：折叠展开中的思考
      collapseOpenThinks();
      const id = p.toolCallId;
      const desc = inputSummary(p.input) || (p.toolName ?? '');
      const parentId = eventParentToolUseId(p);
      // 归属消息可达（部件已见过）→ 卡片内联进消息；否则聊天流末尾占位待收养；
      // 父 agent 卡已渲染 → 嵌套挂进父卡体（对照桌面 agent.tsx 子代理缩进卡）
      toolCard(id, p.toolName, desc, findToolOwner(id), parentId);
      if (p.kind === 'scheduled') { setToolStatus(id, 'pending', undefined, undefined); fillToolBody(id, p.toolName, 'pending', { input: p.input }); }
      if (p.kind === 'started') { setToolStatus(id, 'running', undefined, undefined); fillToolBody(id, p.toolName, 'running', { input: p.input }); }
      if (p.kind === 'progress') setToolStatus(id, 'running', undefined, p.stdoutTail ?? p.stderrTail ?? p.outputPreview);
      if (p.kind === 'result') {
        setToolStatus(id, 'completed', undefined, undefined);
        // Write/Edit 结果带文件路径 → chip（输入缺路径时从结果 JSON 兜底）
        const s = JSON.stringify(p.result ?? {});
        const fp = s.match(/"(?:file_path|filePath|path)":"([^"]+)"/);
        fillToolBody(id, p.toolName, 'completed', {
          input: p.input,
          output: typeof p.result === 'string' ? p.result : JSON.stringify(p.result, null, 1),
        }, fp ? fp[1] : undefined);
        // 计数统一走 countTurnTool：优先输入目标路径、缺省回落结果携带路径；
        // 与存储部件（renderHistory/renderTail）按 callId 去重，消除双路 ×2
        const tp = toolFilePath(p.input) || (fp ? fp[1] : '');
        if (tp) countTurnTool(id, p.toolName, tp, 'completed');
      }
      if (p.kind === 'error') {
        setToolStatus(id, 'error', undefined, undefined);
        fillToolBody(id, p.toolName, 'error', { error: p.error ? JSON.stringify(p.error, null, 1) : '', input: p.input });
      }
      break;
    }
    case 'turn.completed':
      purgeLiveStream();
      busySource = null;
      setBusy(false);
      stopLiveTimers();
      notifyTaskState(false);
      // 断流期间工具行可能停在 running：从存储补一次最终状态重绘。
      // 异步竞态守卫：await 期间用户切到别的会话时，旧会话的消息不得
      // 渲染进新会话视图（串台）——回调里校验会话未变才补绘。
      {
        const sidForRedraw = curSession;
        api(`sessions/${encodeURIComponent(curSession)}/messages?limit=10`)
          .then((r) => { if (curSession === sidForRedraw) renderTail(r.messages ?? []); })
          .catch(() => {});
      }
      loadPlan();
      loadUsage(true);
      refreshSettings(false); // 回合结束后上下文占用变了：刷新模型旁的容量环
      loadAllSessions();
      refreshQueue();
      break;
    case 'turn.failed': {
      purgeLiveStream();
      busySource = null;
      lastTurnFailed = true;
      setBusy(false);
      stopLiveTimers();
      notifyTaskState(false);
      loadAllSessions();
      // 429/余额类错误给人话提示（账户被占用或资源包耗尽是移动端最常见失败）
      const raw = String(ev.payload?.error ?? '未知错误');
      const friendly = /1113|insufficient balance|resource package|\b429\b/i.test(raw)
        ? '模型账户额度不足或资源包耗尽（HTTP 429）。同一账户的任务正在跑时新会话可能被限流——等当前任务完成、前往平台充值，或在模型菜单切换其他模型后重试。'
        : raw;
      const e = el('div', 'errline', `回合失败：${friendly}`);
      chat.appendChild(e); scrollBottom();
      break;
    }
    case 'permission.requested': {
      // autoAnswer=ask 时才会看到；渲染批准卡片（批准/拒绝短文案 = App 审批检测契约）
      chat.appendChild(buildPermissionCard(ev.payload ?? {})); scrollBottom();
      break;
    }
    case 'userInput.requested': {
      // AskUserQuestion 卡（对照桌面 ElicitationDialog）：多问题分区、
      // 选项带描述、multiSelect 复选、每题自定义输入、拒绝按钮。
      // 应答契约（interaction-broker normalizeAskUserQuestionAnswers）：
      // {action:'accept', content:{answers:{题干: 选项/自定义文本}}}
      // 单题兼容旧 answer 字段由引擎归一（answer_0/answer 也认）。
      const p = ev.payload ?? {};
      const questions = Array.isArray(p.questions) ? p.questions : [];
      const card = el('div', 'ask');
      card.appendChild(el('div', 'q', p.prompt ?? questions[0]?.question ?? 'Agent 提问'));
      const selections = new Map(); // 题干 → Set<label>（多选）/ label（单选）
      const customs = new Map();    // 题干 → 自定义文本输入框
      if (!questions.length) {
        // 无结构化题目：仅提示语 + 拒绝（旧引擎兜底）
        const declineOnly = el('button', 'danger', '拒绝');
        declineOnly.addEventListener('click', () => answerInteraction(p.requestId, { action: 'decline' }, card));
        card.appendChild(declineOnly);
      }
      for (const q of questions) {
        const qText = String(q.question ?? '');
        const multi = !!q.multiSelect;
        const zone = el('div', 'askq');
        const head = el('div', 'askhead');
        head.appendChild(el('b', '', qText || '问题'));
        if (q.header) head.appendChild(el('span', 'asktag', q.header));
        if (multi) head.appendChild(el('span', 'asktag', '可多选'));
        zone.appendChild(head);
        const chosen = new Set();
        selections.set(qText, multi ? chosen : null);
        for (const opt of q.options ?? []) {
          const label = String(opt.label ?? opt.value ?? '');
          if (!label) continue;
          const row = el('button', 'askopt');
          if (multi) {
            const box = el('span', 'askbox');
            row.appendChild(box);
          }
          const tw = el('span', 'askoptw');
          tw.appendChild(el('span', 'askoptl', label));
          if (opt.description) tw.appendChild(el('span', 'askoptd', String(opt.description)));
          row.appendChild(tw);
          row.addEventListener('click', () => {
            if (multi) {
              if (chosen.has(label)) { chosen.delete(label); row.classList.remove('on'); }
              else { chosen.add(label); row.classList.add('on'); }
            } else {
              // 单选：高亮本项、清其他项，并可再点取消（配合自定义输入）
              const cur = selections.get(qText);
              if (cur === label) { selections.set(qText, null); row.classList.remove('on'); }
              else {
                selections.set(qText, label);
                zone.querySelectorAll('.askopt').forEach((n) => n.classList.remove('on'));
                row.classList.add('on');
              }
            }
          });
          zone.appendChild(row);
        }
        // 自定义输入（对照桌面 "Other" 选项）
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'askinput';
        input.placeholder = '自定义回答…（填写后优先于选项）';
        input.autocomplete = 'off';
        input.addEventListener('focus', () => {
          if (!multi) { selections.set(qText, null); zone.querySelectorAll('.askopt').forEach((n) => n.classList.remove('on')); }
          else chosen.clear(), zone.querySelectorAll('.askopt').forEach((n) => n.classList.remove('on'));
        });
        customs.set(qText, input);
        zone.appendChild(input);
        card.appendChild(zone);
      }
      const submit = el('button', 'primary', '确认');
      submit.addEventListener('click', () => {
        const answers = {};
        let missing = null;
        for (const q of questions) {
          const qText = String(q.question ?? '');
          const custom = String(customs.get(qText)?.value ?? '').trim();
          const multiSet = selections.get(qText);
          let val = '';
          if (custom) val = custom;
          else if (multiSet && multiSet.size) val = [...multiSet].join(', ');
          else if (!q.multiSelect && typeof multiSet === 'string' && multiSet) val = multiSet;
          if (!val) { missing = missing ?? (qText || '某题'); continue; }
          answers[qText] = val;
        }
        if (missing && questions.length) { toast(`还有未回答的问题：${missing.slice(0, 24)}`); return; }
        answerInteraction(p.requestId, { action: 'accept', content: { answers } }, card);
      });
      const decline = el('button', 'danger', '拒绝');
      decline.addEventListener('click', () => answerInteraction(p.requestId, { action: 'decline' }, card));
      card.append(submit, decline);
      chat.appendChild(card); scrollBottom();
      break;
    }
    case 'model.streaming': {
      // 官方同款逐字流式：引擎的 token 级直播 chunk（legacy 通道只透传该事件，
      // 文本部件要到回合结束才持久化）。text_delta → 正文直播累积；
      // reasoning_delta → 思考行直播。回合结束 purgeLiveStream 清理直播元素，
      // 由存储渲染的真实部件接管。
      // ⚠️ 只认 text_delta / reasoning_delta：tool_input_delta 等其余 kind 是
      // 工具参数 JSON 直播（引擎 kind 全集含 tool_input_start/delta/end、
      // tool_call 等），落进正文就是对话流里的 {"command":...} 夹杂。
      const p = ev.payload ?? {};
      const delta = String(p.delta ?? '');
      const mid = String(p.assistantMessageId ?? '');
      if (!delta || !mid) break;
      const kind = String(p.kind ?? 'text_delta');
      if (kind !== 'text_delta' && kind !== 'reasoning_delta') break;
      const m = ensureMsg(mid, 'assistant');
      // 部件通道是唯一事实来源（对齐桌面官方）：引擎已推送同类真实部件
      // （DOM 已渲染、或数据已落 m.parts 但渲染被 settle 押后）时，token
      // 直播块一律不再创建/增长——冻结等 settle 追平交接。直播块只剩
      // legacy 引擎（只发 token 流、部件回合末才落库）兜底这一条路。
      const liveKey = kind === 'reasoning_delta' ? '__live-think' : '__live-text';
      const domKind = kind === 'reasoning_delta' ? 'think' : 'text';
      const dataKind = kind === 'reasoning_delta' ? 'reasoning' : 'text';
      let hasReal = false;
      for (const [k, v] of m.partEls) {
        if (k !== liveKey && v.kind === domKind) { hasReal = true; break; }
      }
      if (!hasReal) {
        for (const pt of m.parts.values()) {
          if (pt?.type === dataKind) { hasReal = true; break; }
        }
      }
      if (hasReal) break;
      if (kind === 'reasoning_delta') {
        const pe = ensureThink(m, '__live-think');
        pe.content.textContent += delta;
        updateThinkPreview(pe);
      } else {
        let pe = m.partEls.get('__live-text');
        if (!pe) {
          const div = el('div', 'bubble'); // 带 bubble 类：markdown 样式都挂在 .bubble 之下
          div.__partId = '__live-text';
          m.el.appendChild(div); // 助手直播块与正文段同层（内容序）
          pe = { kind: 'text', el: div, full: '' };
          m.partEls.set('__live-text', pe);
        }
        pe.full = (pe.full ?? '') + delta;
        streamRich(pe, pe.full);
        ensureMsgActions(m);
      }
      scrollBottom();
      break;
    }
    case 'session.titleUpdated': {
      const t = ev.payload?.title ?? ev.payload?.session?.title;
      if (t) setSessionTitle(t);
      break;
    }    case 'session.closed': {
      busySource = null;
      setBusy(false);
      toast('会话已关闭');
      break;
    }
    default: break;
  }
}

// 清理 token 流式直播元素：回合结束后由存储渲染的真实部件接管
function purgeLiveStream() {
  dropCaret(); // 直播块清理：光标一并退场（回合结束/轮询自愈路径）
  for (const m of msgEls.values()) {
    for (const key of ['__live-text', '__live-think']) {
      const pe = m.partEls.get(key);
      if (pe) { pe.el.remove(); m.partEls.delete(key); }
    }
  }
  thinkTimers.delete('__live-think');
}

// 直播正文去重：引擎对同一回合同时发 token 直播（model.streaming →
// __live-text 累积块）与部件落库（part.upserted/delta → 真实 partId），
// 两路都渲染就是同一段正文出现两块、同步增长直到回合结束（思考行早有
// 同款去重，正文漏了——这就是"对话过程大量重复输出"的根因）。
// 落库文本总长追平直播块前返回 false（调用方只记数据不渲染副本），
// 追平后移除直播块、返回 true 由真实部件接管。
function settleLiveText(m) {
  const live = m.partEls.get('__live-text');
  if (!live) return true;
  const liveLen = String(live.full ?? '').length;
  if (!liveLen) { live.el.remove(); m.partEls.delete('__live-text'); return true; }
  let done = 0;
  for (const p of m.parts.values()) {
    if (p?.type === 'text') done += String(p.text ?? '').length;
  }
  if (done < liveLen) return false;
  live.el.remove();
  m.partEls.delete('__live-text');
  return true;
}

// 流式正文合帧：每来一个 token 就对整段累积文本重跑 markdown 解析是 O(n²)
// （长回复在手机 WebView 上肉眼可见卡顿）。60ms 合并多次增量渲染一次；
// 权威渲染（renderTextPart）与直播块清理会取消挂起任务，最终状态以落库
// 部件为准，节流不会吞尾字。
const richTimers = new Map(); // pe → setTimeout 句柄
// 流式尾部光标：独立兄弟节点挂在流式文本元素之后——不进每帧重建的 DOM，
// 眨眼动画不闪断；settle/权威渲染接管时移除
const caretEl = document.createElement('span'); caretEl.className = 'scaret';
function dropCaret() { caretEl.remove(); }
// 流式未闭合 markdown 收尾（对照桌面 Streamdown parseIncompleteMarkdown）：
// 仅流式渲染 tick 使用——尾部"开了没闭"的行内标记按字面渲染会在闭合帧
// 到达时闪跳，先补上闭合符让当帧收敛；落库/settle 路径不碰（桌面教训：
// remend 对 ./src/**/* 这类字面量误补，故只用于流式中间帧）。
// 按"开没闭"奇偶计数判定，不碰已闭合对后面的正常尾巴；未闭合代码围栏
// 整体跳过（richText 的 ``` 分割本就把尾段按增长中的代码块渲染）。
function remendLite(t) {
  const s = String(t);
  const segs = s.split(/```/);
  if (segs.length % 2 === 0) return s; // 奇数个围栏 = 围栏未闭合
  const seg = segs[segs.length - 1];   // 成对围栏时的末段＝纯文本段
  let add = '';
  if ((seg.match(/\*\*/g) ?? []).length % 2 === 1 && !/\*$/.test(seg)) add += '**';
  if ((seg.match(/~~/g) ?? []).length % 2 === 1 && !/~$/.test(seg)) add += '~~';
  if ((seg.match(/`/g) ?? []).length % 2 === 1 && !/`$/.test(seg)) add += '`';
  return add ? s + add : s;
}
function streamRich(pe, text) {
  pe.__pending = text;
  if (richTimers.has(pe)) return;
  richTimers.set(pe, setTimeout(() => {
    richTimers.delete(pe);
    const t = pe.__pending;
    pe.__pending = null;
    if (t != null && pe.el.isConnected) {
      pe.el.textContent = ''; richText(pe.el, remendLite(t));
      pe.el.after(caretEl); // 光标跟到本帧渲染的流式元素后
      scrollBottom();
    }
  }, 60));
}
function flushStreamRich(pe) {
  const t = richTimers.get(pe);
  if (t) { clearTimeout(t); richTimers.delete(pe); }
  pe.__pending = null;
  dropCaret(); // 权威渲染接管：光标退场（settle 路径同此）
}

function handleUiEvent(p) {
  // 会话守卫：异会话的交互事件不渲染进当前视图（串台）
  if (p.sessionId && curSession && p.sessionId !== curSession) return;
  // 服务端 ui 推送以 __ui 标记类型（历史字段 kind 仅权限事件携带，两者都查）
  if (p.kind === 'permission' && p.pending) {
    chat.appendChild(buildPermissionCard(p)); scrollBottom();
  }
  // 服务端自动重试提示（429 限流退避等）
  if ((p.kind === 'note' || p.__ui === 'note') && p.text) {
    chat.querySelectorAll('.sysline[data-retry]').forEach((n) => n.remove());
    const note = el('div', 'sysline', p.text);
    note.dataset.retry = '1';
    chat.appendChild(note); scrollBottom();
    toast(p.text);
  }
  // 队列状态对齐（入队/补发/取回/删除都由服务端推送 __ui:'queue'）
  if (p.kind === 'queue' || p.__ui === 'queue') renderQueue(p.queue ?? []);
  if (p.expired) toast('交互请求已超时自动拒绝');
}

// 权限审批卡（对照官方作用域档位）：批准（仅本次）/ 始终允许 / 拒绝。
// "始终允许"走引擎的 permissionUpdates.addRules（会话/项目内同工具不再询问），
// 应答体经服务端原样透传给引擎（协议：{decision, reason?, permissionUpdates?}）。
// 契约：批准/拒绝短按钮文案必须保留（App taskBridgeJs ≤12 字符正则检测）。
function buildPermissionCard(p) {
  // 对照桌面 PermissionDialog：批准/始终允许/拒绝/始终拒绝 + 可选拒绝理由；
  // 引擎原生 options（optionId+response）有则一并渲染为等价按钮。
  // 契约红线：批准/拒绝 短文案按钮必须保留（App taskBridgeJs ≤12 字符正则检测）。
  const card = el('div', 'ask');
  const tool = String(p.toolName ?? '');
  card.appendChild(el('div', 'q', `权限请求：${tool}（${p.riskLevel ?? ''}） ${p.reason ?? ''}`));
  // 拒绝理由（可空）：拒绝时作为 deny.reason 传给模型，明确工具未执行的原因
  const reason = document.createElement('input');
  reason.type = 'text';
  reason.className = 'askinput';
  reason.placeholder = '拒绝理由（可空）';
  reason.autocomplete = 'off';
  card.appendChild(reason);
  const denyReason = () => {
    const t = String(reason.value ?? '').trim();
    return t || '用户拒绝';
  };
  const ok = el('button', 'primary', '批准');
  ok.addEventListener('click', () => answerInteraction(p.requestId, { decision: 'allow' }, card));
  const always = el('button', '', '始终允许');
  always.title = '本项目内，后续相同工具/操作不再询问';
  always.addEventListener('click', () => {
    const body = {
      decision: 'allow',
      reason: 'zcode phone: 用户选择始终允许',
      permissionUpdates: [{ type: 'addRules', behavior: 'allow', rules: [{ toolName: tool }] }],
    };
    answerInteraction(p.requestId, body, card);
    toast(`已允许 ${tool || '该操作'}（本会话/项目内生效）`);
  });
  const no = el('button', 'danger', '拒绝');
  no.addEventListener('click', () => answerInteraction(p.requestId, { decision: 'deny', reason: denyReason() }, card));
  const noAlways = el('button', 'danger', '始终拒绝');
  noAlways.title = '本项目内，后续相同工具/操作直接拒绝';
  noAlways.addEventListener('click', () => {
    const body = {
      decision: 'deny',
      reason: denyReason(),
      permissionUpdates: [{ type: 'addRules', behavior: 'deny', rules: [{ toolName: tool }] }],
    };
    answerInteraction(p.requestId, body, card);
    toast(`已拒绝 ${tool || '该操作'}（本会话/项目内生效）`);
  });
  card.append(ok, always, no, noAlways);
  // 引擎原生选项（协议 ZCodePermissionOption：optionId/kind/name/description/response）
  // 渲染为补充按钮——response 原样透传（schema 与应答体一致），失败静默跳过。
  if (Array.isArray(p.options)) {
    for (const o of p.options) {
      const name = String(o?.name ?? '').trim();
      const rid = String(o?.optionId ?? '');
      if (!name || !rid) continue;
      if (/^(批准|拒绝)$/.test(name)) continue; // 与契约按钮去重
      const b = el('button', '', name.slice(0, 12));
      if (o.description) b.title = String(o.description);
      b.addEventListener('click', () => {
        const fallback = { decision: String(o.kind ?? '').startsWith('allow') ? 'allow' : 'deny' };
        answerInteraction(p.requestId, (o.response && typeof o.response === 'object') ? o.response : fallback, card);
      });
      card.appendChild(b);
    }
  }
  return card;
}

async function answerInteraction(requestId, answer, card) {
  try {
    await api(`interactions/${encodeURIComponent(requestId)}`, { method: 'POST', body: JSON.stringify(answer) });
    if (card) card.remove();
  } catch (e) { toast(`应答失败：${e.message}`); }
}

// ── SSE 连接 ──
// afterSeq：首连从服务端 lastSeq 起只收新事件（历史已由 /messages 渲染，避免重放
// 造成文本重复）；断线自动重连后做一次全量重同步（历史重渲染对齐状态）。

let streamEverOpened = false;

function connectStream(sessionId, afterSeq = -1) {
  if (es) { es.close(); es = null; }
  streamEverOpened = false;
  es = new EventSource(`/api/sessions/${encodeURIComponent(sessionId)}/stream?afterSeq=${afterSeq}&token=${encodeURIComponent(TOKEN)}`);
  es.onopen = () => {
    if (streamEverOpened) resync();
    streamEverOpened = true;
  };
  es.addEventListener('zcode', (e) => { try { handleZcodeEvent(JSON.parse(e.data)); } catch {} });
  es.addEventListener('ui', (e) => { try { handleUiEvent(JSON.parse(e.data)); } catch {} });
  es.addEventListener('reset', () => {
    // 服务重启：引擎会话全部失效，自动 resume 恢复（轮询兜底）
    busySource = null;
    setBusy(false);
    ensureResumed();
  });
  es.onerror = () => { /* EventSource 自动重连，onopen 里重同步 */ };
}

async function resync() {
  if (!curSession) return;
  const sid = curSession;
  try {
    const r = await api(`sessions/${encodeURIComponent(sid)}/messages?limit=60`);
    // 断线重同步只需要尾部窗口（指纹比对 + renderTail），不必全量
    // 异步竞态守卫：await 期间用户已切换会话 → 旧会话历史不得渲染进
    // 新会话视图（串台）。SSE 断线重连瞬间正好叠加快速切换会话时必现。
    if (curSession !== sid) return;
    const msgs = r.messages ?? [];
    // 断线重连不再整页重绘：renderHistory 全量清屏 + 强制回底是"重连闪一下、
    // 位置跳回底部"的主因（移动网络下 EventSource 每几秒就重开一次）。
    // 指纹未变 → 什么都不做；有变化 → renderTail 增量补尾（复用既有元素、
    // 保留滚动位置）。消息被服务端整体回退/删除的罕见场景由下次开会话兜正。
    const fp = fingerprint(msgs);
    if (fp === lastFingerprint) return;
    renderTail(msgs);
    lastFingerprint = fp;
  } catch { /* 下次重连再试 */ }
}

// 增量渲染消息尾部：复用既有消息/部件元素（与 SSE 流式路径同一套更新器），
// 不清空历史、不丢滚动位置。轮询跟随专用——整页重建是「刷新滞后」的主因。
// 消息全文（user 去重对齐用）：text 部件按序拼接
function messageText(msg) {
  return (msg.parts ?? []).filter((p) => p.type === 'text').map((p) => p.text ?? '').join('\n');
}

// 落库渲染用户消息前，移除同文本的 SSE 回显气泡（60 秒窗口内）与
// part 事件误建的用户消息副本（ownPart），消除"一条消息多个气泡"
function dropMatchingUserEcho(text) {
  const now = Date.now();
  sseUserEchoes = sseUserEchoes.filter((e) => now - e.at < 60000);
  const idx = sseUserEchoes.findIndex((e) => e.text === text);
  if (idx >= 0) {
    const e = sseUserEchoes.splice(idx, 1)[0];
    const m = msgEls.get(e.mid);
    if (m) { m.el.remove(); msgEls.delete(e.mid); }
  }
  const norm = String(text ?? '').replace(/\s+/g, ' ').trim();
  if (!norm) return;
  for (const [id, mm] of [...msgEls]) {
    if (!mm.ownPart) continue;
    const t = [...mm.parts.values()].filter((p) => p.type === 'text').map((p) => p.text ?? '').join('\n');
    if (t.replace(/\s+/g, ' ').trim() === norm) { mm.el.remove(); msgEls.delete(id); }
  }
}

function renderTail(messages) {
  let changed = false;
  if (findHits.length) findClear(); // 尾部重绘前清查找高亮（尾部 mark 会被换掉）
  // "本回合"簿记窗口（与 renderHistory 同口径）：只计最后一条可见用户
  // 消息之后的工具，轮询窗口跨回合时不把上一回合的文件混进当轮卡
  let turnStart = 0;
  for (let i = messages.length - 1; i >= 0; i--) {
    if (isHiddenMessage(messages[i]?.info)) continue;
    if ((messages[i].info?.role ?? '') === 'user') { turnStart = i + 1; break; }
  }
  for (let mi = 0; mi < messages.length; mi++) {
    const msg = messages[mi];
    // 合成消息（TodoWrite 提醒/<task-notification>/<subagent-message>）：
    // 跳过渲染，并移除可能已被 SSE 实时路径画出来的气泡（自愈）
    if (isHiddenMessage(msg?.info)) {
      const hid = String(msg.info?.messageId ?? msg.info?.id ?? '');
      const hm = hid && msgEls.get(hid);
      if (hm) { hm.el.remove(); msgEls.delete(hid); changed = true; }
      continue;
    }
    const role = msg.info?.role ?? 'assistant';
    const mid = messageKey(msg);
    if (role === 'user') dropMatchingUserEcho(messageText(msg));
    const m = ensureMsg(mid, role === 'user' ? 'user' : 'assistant');
    // 直播思考块去重：存储里的思考"追平"了直播内容（同一段思考已完成落库）
    // 才移除直播块——按内容长度比较而非"存在 reasoning 段就删"，否则多段
    // 思考回合（思考→工具→思考…）里后续直播思考会被每次轮询误删（闪烁丢字）
    const liveThink = m.partEls.get('__live-think');
    if (liveThink) {
      const liveLen = (liveThink.content?.textContent ?? '').length;
      const storageLen = Math.max(0, ...(msg.parts ?? [])
        .filter((p) => p.type === 'reasoning')
        .map((p) => (p.text ?? '').length));
      if (storageLen >= liveLen && storageLen > 0) {
        liveThink.el.remove();
        m.partEls.delete('__live-think');
        thinkTimers.delete('__live-think');
      }
    }
    // 直播正文去重（与思考块同款）：存储文本总长追平直播块前不渲染落库正文，
    // 否则直播块 + 落库副本两份同步增长（对话过程大量重复输出的根因之一）
    const liveTextOk = settleLiveText(m);
    for (const part of msg.parts ?? []) {
      switch (part.type) {
        case 'text': {
          if (!liveTextOk) break;
          const pid = String(part.partId ?? mid + '-t');
          const pe = m.partEls.get(pid);
          if (pe && pe.raw === String(part.text ?? '')) break; // 未变化：跳过整段重建（轮询高频入口）
          if (pe) { streamRich(pe, part.text ?? ''); ensureMsgActions(m); } // 增长：合帧渲染，权威重建由回合收尾兜底
          else renderTextPart(m, pid, part.text ?? '');
          changed = true;
          break;
        }
        case 'reasoning': {
          const pidR = String(part.partId ?? mid + '-r');
          const existedR = m.partEls.has(pidR);
          const pe = ensureThink(m, pidR);
          pe.content.textContent = part.text ?? '';
          updateThinkPreview(pe);
          if (!existedR) thinkTimers.delete(pidR); // 存储整段落库的思考无真实起始时刻，不冒充"持续了 X 秒"
          changed = true;
          break;
        }
        case 'tool': {
          const st = part.state ?? {};
          // TodoWrite 不渲染工具行，但刷新任务计划条
          if (String(part.tool ?? '').toLowerCase() === 'todowrite') { scheduleTodoRefresh(); break; }
          // 工具行到达 = 之前的思考已完成：折叠展开中的思考
          collapseOpenThinks();
          const cid = String(part.callId ?? part.callID ?? `p${part.partId ?? mi + '-t'}`);
          toolCard(cid, part.tool, inputSummary(st.input) || st.title || '', m, eventParentToolUseId(part));
          const status = st.status ?? 'pending';
          setToolStatus(cid, status, undefined, undefined);
          fillToolBody(cid, part.tool, status, st);
          const fp = st?.input?.file_path ?? st?.input?.filePath ?? st?.input?.path;
          if (fp && mi >= turnStart) countTurnTool(cid, part.tool, String(fp), status);
          changed = true;
          break;
        }
        default: break;
      }
    }
  }
  if (changed) scrollBottom();
}

// 轮询跟随：探测最近几条消息的指纹，变化才增量渲染尾部。
// 桌面端驱动的回合没有 SSE 事件，靠这里实现手机端近实时同步（1.2s 探测）。
//
// 收敛自愈（以存储为准，任何运行态都必须能退出，否则就是"永久转圈"）：
// - busy 期间存储显示回合已收尾（最后部件 step-finish）且无任何活动
//   （SSE 静默 + 存储无变化）超过 30 秒 → 强制复位。
//   覆盖 SSE 断流后 turn.completed 丢失导致的不收敛。
// - SSE 存活时事件持续刷新 lastSseEventAt，步骤间隙不会误判
//   （工具执行期事件也在流，且存储里工具部件停在 running，finished=false）。
async function pollTick() {
  if (!curSession) return;
  // 本次探测的目标会话快照：await 之后凡是渲染/复位类副作用都必须确认
  // 用户没有切走（切换会话后旧会话的探测结果落到新会话视图 = 串台）
  const sid = curSession;
  if (document.hidden) return; // WebView 后台会暂停定时器，回前台自然补一次
  // 版本漂移检测（每 ~20 次探测一次，约 25 秒）：服务端页面更新后自动刷新，
  // 否则手机一直跑内存里的旧 JS，页面级修复永远到不了终端
  if (++pollCount % 20 === 0) {
    try {
      const st = await api('state');
      if (serverBuildHash === null) serverBuildHash = st.pageBuild;
      else if (st.pageBuild && st.pageBuild !== serverBuildHash) {
        toast('页面已更新，正在刷新…');
        setTimeout(() => location.reload(), 600);
        return;
      }
    } catch { /* 下次再试 */ }
  }
  try {
    const probe = await api(`sessions/${encodeURIComponent(sid)}/messages?limit=10`);
    if (curSession !== sid) return; // await 期间已切换会话：本次探测作废（防串台）
    const msgs = probe.messages ?? [];
    const fp = fingerprint(msgs);
    const finished = turnLooksFinished(msgs);
    const quietMs = Date.now() - Math.max(lastActivity, lastSseEventAt);
    if (fp === lastFingerprint) {
      // 无存储变化。收敛主路径：step-finish 稳定 6 秒 → 复位（对 sse/inferred
      // 一视同仁——SSE 断流后 turn.completed 丢失时同样 6 秒自愈，不必等 30 秒。
      // 此前该逻辑写在「指纹变化」分支里，指纹一稳定就永远走不到——
      // turn.completed 复位后 pollTick 又把 busy 拉回来，实际收敛全靠
      // 30 秒静默兜底，实测转圈拖到 72 秒。）
      if (busy && finished) {
        if (!finishedSince) finishedSince = Date.now();
        if (Date.now() - finishedSince >= 6000) {
          finishedSince = 0;
          renderTail(msgs);
          purgeLiveStream(); // SSE 断流错过 turn.completed：直播残留（如误渲染的工具参数）在此清掉
          busySource = null;
          setBusy(false);
          notifyTaskState(false);
          refreshQueue();
          loadAllSessions();
          return;
        }
      }
      // busy 超过 30 秒且回合已收尾 → 兜底复位（补一次尾部重绘，
      // 修正断流期间停留在 running 的工具行）
      if (busy && finished && quietMs > 30000) {
        renderTail(msgs);
        purgeLiveStream();
        busySource = null;
        setBusy(false);
        notifyTaskState(false);
        refreshQueue();
        loadAllSessions();
        return;
      }
      // 收敛兜底：存储指纹稳定 45 秒仍 busy → 复位。覆盖"被取消/中断的
      // 回合最后部件永远停在 tool:running"的场景（取消不写 step-finish，
      // finished 永远 false）。代价：桌面驱动回合里超 45 秒无存储写入的
      // 长工具会短暂显示空闲——下一条存储写入即恢复运行态，可自愈
      if (busy && quietMs > 45000) {
        renderTail(msgs);
        purgeLiveStream();
        busySource = null;
        setBusy(false);
        notifyTaskState(false);
        refreshQueue();
        loadAllSessions();
        return;
      }
      return;
    }
    lastActivity = Date.now();
    // 指纹变化但回合已收尾：不进入运行态（回合结束落库的那次指纹变化
    // 若触发置 busy，会与 turn.completed 的复位打架，转圈永不停止）
    if (!finished) finishedSince = 0;
    if (!busySource && !busy && !finished) {
      busySource = 'inferred';
      busySince = Date.now();
      setBusy(true);
      notifyTaskState(true);
      startLiveTimers();
    }
    renderTail(msgs);
    // 必须随 renderTail 推进指纹：此前只在 renderHistory 赋值，存储一旦变过，
    // 后续每轮都落进"指纹变化"分支——「稳定 6 秒复位 / 静默 30s / 45s 兜底」
    // 全在"无变化"分支里成了死代码。桌面驱动（inferred）回合收尾后
    // 没有任何复位路径生效 → 永久转圈；lastActivity 还被每轮刷活，
    // 静默判定永远不够阈值。回合结束落库即渲染完成，此后应视为"无变化"。
    lastFingerprint = fp;
    // SSE 驱动的回合也可能断流：存储已收尾且流静默 30 秒 → 兜底复位
    if (busy && busySource === 'sse' && finished && Date.now() - lastSseEventAt > 30000) {
      busySource = null;
      setBusy(false);
      notifyTaskState(false);
      refreshQueue();
      loadAllSessions();
    }
  } catch (e) {
    if (curSession !== sid) return; // 旧会话探测的异常不驱动新会话的 resume/复位
    // 服务端重启后引擎里没有这个会话（未 resume）：自动重新打开恢复
    if (/not active/i.test(String(e?.message ?? e))) {
      ensureResumed();
      // resume 窗口/失败期间 probe 全部抛异常，上方各"静默复位"分支根本
      // 执行不到——busy 会永久卡死（看桌面驱动会话、桥重启后必经此路径）。
      // 兜底：busy 且无任何活动超过 45 秒直接复位；resume 成功且会话复活
      // 后指纹变化会重新进入运行态，不会误伤真实运行中的任务
      if (busy && Date.now() - Math.max(lastActivity, lastSseEventAt) > 45000) {
        busySource = null;
        setBusy(false);
        notifyTaskState(false);
        refreshQueue();
      }
    }
  }
}

// 服务重启/引擎丢会话后自动 resume 当前会话（30 秒冷却防循环）
let resumingSession = false;
let lastResumeAt = 0;
let pollCount = 0;          // 轮询计数（版本漂移检测分频用）
let serverBuildHash = null; // 首次探测到的服务端页面指纹，变化即自动刷新
async function ensureResumed() {
  if (resumingSession || !curSession) return;
  if (Date.now() - lastResumeAt < 30000) return;
  resumingSession = true;
  lastResumeAt = Date.now();
  try {
    toast('服务已重启，正在重新连接会话…');
    await openSession(curSession);
  } catch { /* 下次轮询再试 */ } finally {
    resumingSession = false;
  }
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(pollTick, 1200);
}

// ── 排队消息（预备任务：运行中发送 → 服务端入队 → 回合结束自动补发）──

// ✎ 编辑取回的原条目：重发时按原位置插回（queue/replace），而不是追加到队尾。
// 取回会把条目从队列摘掉（避免回合结束被补发），所以位置要在取回前记住。
let queueEditId = null;
let queueEditIndex = 0;

function renderQueue(queue) {
  const bar = $('queueBar');
  bar.textContent = '';
  bar.style.display = queue?.length ? 'flex' : 'none';
  for (const [idx, item] of (queue ?? []).entries()) {
    const pill = el('div', 'qpill');
    pill.appendChild(el('span', 'qarr', '→'));
    pill.appendChild(el('span', 'qtext', item.text));
    // ↑↓：相邻重排（对照桌面 ConversationQueuePanel；越界侧不渲染按钮）
    const move = async (dir) => {
      try {
        const r = await api(`sessions/${encodeURIComponent(curSession)}/queue/move`, { method: 'POST', body: JSON.stringify({ id: item.id, dir }) });
        renderQueue(r.queue ?? []);
      } catch { refreshQueue(); /* 药丸过期：同步服务端真实队列 */ }
    };
    if (idx > 0) {
      const up = el('button', 'qact', '↑');
      up.title = '前移一位';
      up.addEventListener('click', () => move(-1));
      pill.appendChild(up);
    }
    if (idx < (queue?.length ?? 0) - 1) {
      const dn = el('button', 'qact', '↓');
      dn.title = '后移一位';
      dn.addEventListener('click', () => move(1));
      pill.appendChild(dn);
    }
    // ✎：取回到输入框编辑（取消自动发送），改完重发按原位置插回
    const edit = el('button', 'qact', '✎');
    edit.title = '编辑：取回到输入框，重发后回到原位置';
    edit.addEventListener('click', async () => {
      let removed = true;
      try {
        await api(`sessions/${encodeURIComponent(curSession)}/queue/remove`, { method: 'POST', body: JSON.stringify({ id: item.id }) });
      } catch {
        removed = false; // 已不在队列（可能刚被发出）：同步药丸，避免残留死状态
        refreshQueue();
      }
      if (removed) {
        queueEditId = item.id;
        queueEditIndex = (queue ?? []).findIndex((q) => q.id === item.id); // 取回前的原始位置
      }
      composer.value = composer.value ? composer.value + '\n' + item.text : item.text;
      composer.dispatchEvent(new Event('input'));
      composer.focus();
    });
    pill.appendChild(edit);
    // ⚡：立即发出——先停当前回合，服务端停止完成后补发该项（其余队列保留）
    const zap = el('button', 'qact', '⚡');
    zap.title = '立即发送：打断当前任务，优先发出这条';
    zap.addEventListener('click', async () => {
      try {
        await api(`sessions/${encodeURIComponent(curSession)}/queue/send-now`, { method: 'POST', body: JSON.stringify({ id: item.id }) });
        toast('已请求停止当前任务，将立即发出该消息');
      } catch (e) {
        toast(`立即发送失败：${e.message}`);
        refreshQueue(); // 404=药丸已过期：立即对齐，别让用户对着幽灵条目点
      }
    });
    pill.appendChild(zap);
    // ✕：直接丢弃该排队项
    const x = el('button', 'qx', '✕');
    x.title = '删除该排队项';
    x.addEventListener('click', async () => {
      try {
        await api(`sessions/${encodeURIComponent(curSession)}/queue/remove`, { method: 'POST', body: JSON.stringify({ id: item.id }) });
      } catch { refreshQueue(); /* 药丸过期：同步服务端真实队列 */ }
    });
    pill.appendChild(x);
    bar.appendChild(pill);
  }
}

async function refreshQueue(sid) {
  const target = sid ?? curSession;
  if (!target) return;
  try {
    const r = await api(`sessions/${encodeURIComponent(target)}/queue`);
    if (target === curSession) renderQueue(r.queue ?? []);
  } catch { /* 服务端旧版本无此端点：忽略 */ }
}

async function doSend(text, sid) {
  const target = sid ?? curSession;
  // ✎ 编辑取回后的重发：原位替换原排队项（位置不变），而不是追加到队尾。
  // 原条目已不在队列（回合刚好结束把它发出了）→ 降级为普通发送路径。
  if (queueEditId && !sid) {
    const editId = queueEditId;
    const editIdx = queueEditIndex;
    queueEditId = null;
    try {
      const r = await api(`sessions/${encodeURIComponent(target)}/queue/replace`, { method: 'POST', body: JSON.stringify({ id: editId, text, index: editIdx }) });
      renderQueue(r.queue ?? []);
      toast('已替换原排队项（位置不变）');
      return true;
    } catch (e) {
      // 服务端异常才走这里（位置插回逻辑在服务端永远成功）：降级普通排队
      toast(`替换失败，已按新消息排队：${e.message}`);
    }
  }
  try {
    const r = await api(`sessions/${encodeURIComponent(target)}/send`, { method: 'POST', body: JSON.stringify({ content: text }) });
    if (r?.queued) {
      renderQueue(r.queue ?? []);
      toast('已排队：当前任务结束后自动发送（点击队列可取回）');
      return true;
    }
    busySince = Date.now();
    setBusy(true);
    recentOwnInputs.push({ text, at: Date.now() }); // part 事件里识别自己的输入部件用
    return true;
  } catch (e) {
    toast(`发送失败：${e.message}`);
    return false;
  }
}

// ── 发送 ──

async function send() {
  if (remoteView) { toast('远程会话只读：请在桌面端继续该会话'); return; }
  if (!curSession) { toast('先选择一个会话'); return; }
  let text = composer.value.trim();
  if (!text && !pendingImage) return;
  closeAtMenu(); // @ 候选菜单随发送收起
  composer.value = '';
  composer.style.height = 'auto';
  updateSendButton(); // 已清空：运行中按钮回到停止态
  // 待发附件：先上传到当前工作区，消息里带上文件路径（模型工具可直接读取该文件）
  if (pendingImage) {
    const img = pendingImage;
    clearAttach();
    try {
      const r = await api('upload', { method: 'POST', body: JSON.stringify({ name: img.name, dataBase64: img.base64, workspace: curWs }) });
      const kind = /\.(png|jpe?g|webp|gif|bmp)$/i.test(img.name) ? '图片' : '文件';
      text = text ? `${text}\n\n[${kind}已保存到 ${r.path}]` : `请查看${kind} ${r.path}`;
    } catch (e) {
      toast(`附件上传失败：${e.message}`);
      return;
    }
  }
  // 忙碌与否都直接走服务端：服务端运行中自动入队（引擎 -32010 也会转排队）
  const ok = await doSend(text);
  if (ok) scrollBottom(true); // 用户主动发送：无论如何回到最新消息
  if (!ok) {
    composer.value = text;
    composer.dispatchEvent(new Event('input'));
  }
}

// ── @ 文件引用（对照官方 composer 的 @ 上下文菜单）──
// 输入 @token（光标前 ^|空白 @ 非空白串）即弹出工作区文件候选（服务端
// /api/search/files：文件名/相对路径模糊匹配，空查询返回最近修改）。
// 选中后把 @token 替换为 @相对路径——模型按路径读取，与官方 @ 引用语义一致。
let atTokenText = null;   // 当前匹配到的 @token（null = 菜单关闭）
let atItems = [];
let atActive = -1;
let atDebounceTimer = null;

function atMatchToken() {
  const caret = composer.selectionStart ?? composer.value.length;
  const m = composer.value.slice(0, caret).match(/(^|\s)@([^\s@]{0,64})$/);
  return m ? m[2] : null;
}
function closeAtMenu() {
  atTokenText = null;
  atActive = -1;
  $('atMenu').classList.remove('open');
}
function atInsert(item) {
  const caret = composer.selectionStart ?? composer.value.length;
  const before = composer.value.slice(0, caret).replace(/@[^\s@]{0,64}$/, `@${item.path} `);
  composer.value = before + composer.value.slice(caret);
  const pos = before.length;
  try { composer.setSelectionRange(pos, pos); } catch { /* 忽略 */ }
  composer.dispatchEvent(new Event('input'));
  composer.focus();
  closeAtMenu();
}
function atRenderRows() {
  const pop = $('atMenu');
  pop.textContent = '';
  pop.appendChild(el('div', 'phead', atTokenText ? `文件：@${atTokenText}` : '工作区文件'));
  if (!atItems.length) {
    pop.appendChild(el('div', 'sysline', atTokenText ? '没有匹配的文件' : '工作区还没有文件'));
  }
  atItems.forEach((it, i) => {
    const b = el('button', 'mrow compact' + (i === atActive ? ' at-active' : ''));
    const mt = el('div', 'mt');
    mt.appendChild(el('div', 't', it.name));
    if (it.dir) mt.appendChild(el('div', 'd', it.dir));
    b.appendChild(mt);
    b.appendChild(el('span', 'mck', '@'));
    b.addEventListener('click', (ev) => { ev.stopPropagation(); atInsert(it); });
    pop.appendChild(b);
  });
  pop.classList.add('open');
  placePop(pop, composer);
}
async function atFetch(token) {
  try {
    const r = await api(`search/files?${qs({ q: token, workspace: curWs })}`);
    if (atTokenText !== token) return; // 输入已前进：过期响应丢弃
    atItems = (r.items ?? []).slice(0, 30);
    atActive = atItems.length ? 0 : -1;
    atRenderRows();
  } catch { closeAtMenu(); }
}
function scheduleAtMenu() {
  const token = atMatchToken();
  if (token === null) { closeAtMenu(); return; }
  if (token === atTokenText) return; // token 未变（如末尾补字以外的重绘）：不打扰
  atTokenText = token;
  if (atDebounceTimer) clearTimeout(atDebounceTimer);
  atDebounceTimer = setTimeout(() => atFetch(token), 150);
}
// 键盘导航：候选开着时 ↑↓ 移动、Enter 选中、Esc 关闭（优先级高于发送）
composer.addEventListener('keydown', (e) => {
  if (!$('atMenu').classList.contains('open')) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!atItems.length) return;
    atActive = (atActive + (e.key === 'ArrowDown' ? 1 : atItems.length - 1)) % atItems.length;
    atRenderRows();
  } else if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    if (atItems[atActive]) atInsert(atItems[atActive]);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    closeAtMenu();
  }
});

// ── 外观主题（左侧栏 ☀：跟随系统 / 浅色 / 深色，localStorage 持久）──
// data-theme 只存 'light'/'dark'（已解析），'auto' 跟随 matchMedia 实时切换；

const THEME_KEY = 'dshTheme';

// ── 键盘适配（visualViewport）──
// 安卓 WebView 在 adjustPan / 窗口级滚动模式下弹键盘会把页面整体平移，
// 底部输入卡被键盘遮住（safe-area 只管挖孔栏，管不了软键盘）。
// 做法：把 body 高度锁定为可视视口高度、用位移抵消 offsetTop——整棵
// fixed 布局树跟着落回可见区。adjustResize 环境（innerHeight == vv.height、
// offsetTop = 0）该逻辑自动成为 no-op，桌面浏览器同样无感。
// ── 会话内查找（对照桌面 quickpick/TaskFindDialog + conversationFindHighlightDom）──
// 滚动容器内全文高亮 + 上/下一个命中；手机上默认从最新一处开始（历史向下翻）。
// 渲染管线（renderHistory/renderTail）重画前清高亮，避免残留引用悬空。
const FIND_CAP = 500;
let findHits = [];
let findIdx = -1;
let findTimer = null;

function findOpen() {
  closePops();
  $('findBar').classList.add('on');
  const inp = $('findInput');
  inp.focus(); inp.select();
}
function findClear() {
  findHits = []; findIdx = -1;
  $('findCount').textContent = '0/0';
  document.querySelectorAll('mark.find-hit').forEach((m) => m.replaceWith(document.createTextNode(m.textContent)));
  $('chat').normalize(); // 摘除 mark 后合并相邻文本节点，防渲染器文本碎片化
}
function findClose() {
  $('findBar').classList.remove('on');
  findClear();
}
function findRun(q) {
  findClear();
  q = String(q ?? '').trim();
  if (!q) return;
  const lower = q.toLowerCase();
  const walker = document.createTreeWalker($('chat'), NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      if (!n.nodeValue || !n.nodeValue.toLowerCase().includes(lower)) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      if (!p || p.closest('#findBar')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  const targets = [];
  while (walker.nextNode() && targets.length < FIND_CAP) targets.push(walker.currentNode);
  for (const node of targets) {
    const text = node.nodeValue;
    const tl = text.toLowerCase();
    const frag = document.createDocumentFragment();
    let i = 0;
    while (i < text.length) {
      const at = tl.indexOf(lower, i);
      if (at < 0) { frag.appendChild(document.createTextNode(text.slice(i))); break; }
      if (at > i) frag.appendChild(document.createTextNode(text.slice(i, at)));
      const mk = document.createElement('mark');
      mk.className = 'find-hit';
      mk.textContent = text.slice(at, at + q.length);
      frag.appendChild(mk);
      i = at + q.length;
    }
    node.replaceWith(frag);
  }
  findHits = [...$('chat').querySelectorAll('mark.find-hit')];
  if (!findHits.length) { $('findCount').textContent = '无结果'; return; }
  findIdx = findHits.length - 1; // 最新命中优先（手机上通常在找"刚才那段"）
  findGoto();
}
function findGoto() {
  findHits.forEach((h, i) => h.classList.toggle('cur', i === findIdx));
  if (findHits[findIdx]) findHits[findIdx].scrollIntoView({ block: 'center', behavior: 'smooth' });
  $('findCount').textContent = `${findIdx + 1}/${findHits.length}`;
}
function findStep(d) {
  if (!findHits.length) return;
  findIdx = (findIdx + d + findHits.length) % findHits.length;
  findGoto();
}
$('miFind').addEventListener('click', findOpen);
$('findClose').addEventListener('click', findClose);
$('findPrev').addEventListener('click', () => findStep(-1));
$('findNext').addEventListener('click', () => findStep(1));
$('findInput').addEventListener('input', (e) => {
  clearTimeout(findTimer);
  const v = e.target.value;
  findTimer = setTimeout(() => findRun(v), 220);
});
$('findInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); }
  if (e.key === 'Escape') findClose();
});

(function setupVisualViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  const apply = () => {
    const b = document.body;
    const kb = Math.round(window.innerHeight - vv.height - vv.offsetTop);
    if (kb > 2 || vv.offsetTop > 2) {
      document.documentElement.style.setProperty('--kb', Math.max(0, kb) + 'px');
      b.style.height = Math.round(vv.height) + 'px';
      b.style.transform = vv.offsetTop ? `translateY(${Math.round(vv.offsetTop)}px)` : '';
    } else {
      b.style.height = '';
      b.style.transform = '';
      document.documentElement.style.setProperty('--kb', '0px');
    }
  };
  vv.addEventListener('resize', apply);
  vv.addEventListener('scroll', apply);
  window.addEventListener('orientationchange', apply);
  apply();
})();

function projName(p) {
  const base = String(p ?? '').split(/[\\/]/).filter(Boolean).pop();
  return base || '（默认）';
}

// 相对时间（官方：刚刚 / 6分 / 1小时 / 4天）
function fmtRel(ts) {
  const diff = Date.now() - Number(ts ?? 0);
  if (!ts || diff < 0) return '';
  if (diff < 60e3) return '刚刚';
  if (diff < 3600e3) return `${Math.floor(diff / 60e3)}分`;
  if (diff < 86400e3) return `${Math.floor(diff / 3600e3)}小时`;
  return `${Math.floor(diff / 86400e3)}天`;
}

let sessQuery = '';
function sessMatches(s) {
  const q = sessQuery.trim().toLowerCase();
  if (!q) return true;
  const title = String(s.title ?? '').toLowerCase();
  const ws = String(s.workspacePath ?? '').toLowerCase();
  return title.includes(q) || ws.includes(q) || projName(s.workspacePath).toLowerCase().includes(q);
}
const sessSearchInput = document.getElementById('sessSearch');
sessSearchInput?.addEventListener('input', () => {

  renderProjectList();
});
document.getElementById('sessSearchClear')?.addEventListener('click', () => {

});

async function loadAllSessions() {
  try {
    const r = await api('sessions?all=1');
    // groups = 服务端官方口径分组（过滤/排序都在服务端按任务索引做死）；
    // allSessions 仅为其摊平视图（busy 探测 / 搜索 / 启动兜底用），不再参与分组排序
    allGroups = Array.isArray(r.groups) ? r.groups : null;
    allSessions = allGroups
      ? allGroups.flatMap((g) => (g.sessions ?? []).map((s) => ({ ...s, _gpath: String(g.path ?? '') })))
      : (r.sessions ?? []);
  } catch { /* 保留旧数据，下轮再试 */ }
  renderProjectList();
}

// 侧栏自动刷新：loadAllSessions 只在开抽屉/打开会话/回合收尾这些事件点触发，
// 桌面端驱动任务时无 SSE，手机侧栏的运行中标记与"刚刚/6分"时间会一直停在
// 旧数据上。抽屉开着或有任务在跑时周期刷新（服务端列表有 5s 缓存、
// 运行态判定有 3s 缓存，每 4s 一轮代价可控）；空闲且抽屉关着不打扰。
setInterval(() => {
  if (document.hidden) return; // WebView 后台定时器本就被挂起，显式跳过省请求
  if ($('drawer').classList.contains('open') || busy || allSessions.some((s) => s.busy)) {
    loadAllSessions();
  }
  // 远程组只在抽屉开着时刷：SSH 探测比本地列表贵，服务器端有 5s 缓存 + 单飞兜底
  if ($('drawer').classList.contains('open') && !document.hidden) loadRemoteProjects();
}, 4000);

// 会话行操作单：锚定 ⋯ 按钮弹出（打开 / 归档或恢复 / 删除）
function closeSessPop() { $('sessPop').classList.remove('open'); }
function openSessPop(anchor, s) {
  const pop = $('sessPop');
  pop.textContent = '';
  const mk = (label, fn, cls) => {
    const b = el('button', cls ?? '', label);
    b.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      closeSessPop();
      await fn();
    });
    pop.appendChild(b);
  };
  mk('打开', () => openSession(s.sessionId, s._gpath || s.workspacePath));
  // 无"归档"项：归档会话不进列表（官方任务栏主列表现实，用户决策 2026-11-03）——
  // 手机上归档等于把会话推进看不见的黑洞，恢复入口在桌面
  mk('删除', async () => {
    if (!confirm(`删除会话「${s.title || '未命名'}」？\n消息与记录将一并删除，不可恢复。`)) return;
    if (s.sessionId === curSession) { openSession(null); }
    try {
      await api(`sessions/${encodeURIComponent(s.sessionId)}/delete`, { method: 'POST', body: '{}' });
      toast('已删除');
    } catch (e) { toast(`删除失败：${e.message}`); }
    loadAllSessions();
  }, 'danger');
  const r = anchor.getBoundingClientRect();
  // 视口内夹紧：drawer 内按钮也适用（fixed 相对视口）
  const w = 138, h = 140;
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
  pop.style.top = Math.max(8, Math.min(r.bottom + 4, window.innerHeight - h - 8)) + 'px';
  pop.classList.add('open');
}
document.addEventListener('click', (e) => { if (!$('sessPop').contains(e.target)) closeSessPop(); });

function sessRow(s, projectPath) {
  // 只信服务端核实过的 busy：它 = 桥内存标记 ∥ 共享库末部件判定。
  // s.status 是引擎落库的静态值——桌面驱动回合结束不会回写（F2），
  // 直接 OR 上去等于把服务端的僵尸 running 核实整个推翻，侧栏永久转圈
  const running = !!s.busy;
  const item = el('div', 'sess' + (s.sessionId === curSession ? ' cur' : ''));
  if (running) {
    const sp = el('span', 'busy'); sp.innerHTML = SVG.spin; sp.title = '任务运行中'; item.appendChild(sp);
  } else if (s.unreadAt) {
    // 未读圆点（对照桌面 useProjectUnreadSignals：索引 unread_at 标记）。
    // 只读展示——桌面 mark-read 带 expectedUnreadAt CAS，手机直写会踩桌面语义
    const u = el('span', 'udot'); u.title = '桌面标记未读'; item.appendChild(u);
  }
  const t = el('div', 't', s.title || '未命名会话');
  if (running) t.style.color = 'var(--fg)';
  item.appendChild(t);
  const time = el('span', 'time' + (running ? ' running' : ''), running ? '运行中' : fmtRel(s.updatedAt));
  item.appendChild(time);
  const more = el('button', 'smore', '⋯');
  more.title = '会话操作';
  more.addEventListener('click', (ev) => { ev.stopPropagation(); openSessPop(more, s); });
  item.appendChild(more);
  item.addEventListener('click', () => openSession(s.sessionId, projectPath));
  return item;
}

function renderProjectList() {
  const box = $('projList');
  box.textContent = '';
  const sect = $('projSect');
  // 搜索态：跨项目平铺匹配会话（标题/项目名/路径过滤，命中即显示、不再截断）
  if (sessQuery.trim()) {
    sect.textContent = '搜索结果';
    const hits = allSessions.filter(sessMatches);
    const q = sessQuery.trim().toLowerCase();
    const remoteHits = [];
    for (const h of remoteHosts) {
      if (!h.online) continue;
      for (const pr of h.projects ?? []) {
        for (const s of pr.sessions ?? []) {
          if (String(s.title ?? '').toLowerCase().includes(q) ||
              String(pr.name ?? '').toLowerCase().includes(q) ||
              String(h.host ?? '').toLowerCase().includes(q)) remoteHits.push([h, s]);
        }
      }
    }
    if (!hits.length && !remoteHits.length) {
      box.appendChild(el('div', 'sysline', `没有匹配「${sessQuery.trim()}」的会话`));
      return;
    }
    for (const s of hits) box.appendChild(sessRow(s, s._gpath || s.workspacePath));
    if (remoteHits.length) {
      const head = el('div', 'archsect');
      head.appendChild(el('span', '', '▸'));
      head.appendChild(el('b', '', `远程 · 只读（${remoteHits.length}）`));
      box.appendChild(head);
      for (const [h, s] of remoteHits.slice(0, 20)) box.appendChild(remoteRow(h, s));
    }
    return;
  }
  sect.textContent = '项目 / 会话';
  // 分组与排序一律以服务端 groups 为准（官方任务索引口径：项目按 position、任务按
  // cli_updated_at DESC；已删除的项目/会话、归档在数据源里就被过滤）。
  // 页面禁止再分组、再排序——此前"按最近会话时间自排"就是排序乱掉的根源。
  const groups = allGroups ?? [];
  // 远程组排前（用户决策 2026-11-03），其后本地项目按服务端官方顺序
  renderRemoteSection(box);
  if (!groups.length) { box.appendChild(el('div', 'sysline', '还没有项目和会话')); }
  for (const g of groups) {
    const p = String(g.path ?? '');
    const gkey = String(g.key ?? p);
    const isCur = p === curWs;
    const sessions = g.sessions ?? [];
    const collapsed = projCollapsed.has(gkey);
    // 置顶区（对照桌面 ProjectSidebar 独立"已置顶"分区）：📌 图标、无工作区切换、
    // 无新建按钮；服务端已把 pinned 会话从普通分组剔除，这里只渲染
    if (g.kind === 'pinned') {
      const row = el('div', 'wsrow pinrow');
      row.appendChild(collapseTwist(collapsed, sessions.length > 0, () => {
        if (projCollapsed.has(gkey)) projCollapsed.delete(gkey); else projCollapsed.add(gkey);
        saveCollapsedSet('zcode.collapsed', projCollapsed);
        renderProjectList();
      }));
      const fi = el('span', 'mi'); fi.innerHTML = PIN_SVG; row.appendChild(fi);
      row.appendChild(el('div', 'plabel', g.label || '已置顶'));
      if (sessions.length) row.appendChild(el('span', 'cnt', String(sessions.length)));
      box.appendChild(row);
      if (collapsed || !sessions.length) continue;
      const kids = el('div', 'gkids');
      const expanded = !!projExpanded.get(gkey);
      const list = expanded ? sessions : sessions.slice(0, 3);
      for (const s of list) kids.appendChild(sessRow(s, s.workspacePath));
      if (sessions.length > list.length) {
        const more = el('button', 'morebtn', `显示更多（还有 ${sessions.length - list.length} 条）`);
        more.addEventListener('click', () => { projExpanded.set(gkey, true); renderProjectList(); });
        kids.appendChild(more);
      } else if (expanded && sessions.length > 3) {
        const less = el('button', 'morebtn', '收起');
        less.addEventListener('click', () => { projExpanded.set(gkey, false); renderProjectList(); });
        kids.appendChild(less);
      }
      box.appendChild(kids);
      continue;
    }
    const row = el('div', 'wsrow' + (isCur ? ' cur' : ''));
    // ▾/▸ 折叠整组（持久化）；行身点击仍是"切到该项目"，＋ 是"建到该项目"
    row.appendChild(collapseTwist(collapsed, sessions.length > 0, () => {
      if (projCollapsed.has(gkey)) projCollapsed.delete(gkey); else projCollapsed.add(gkey);
      saveCollapsedSet('zcode.collapsed', projCollapsed);
      renderProjectList();
    }));
    const fi = el('span', 'mi'); fi.innerHTML = FOLDER_SVG; row.appendChild(fi);
    row.appendChild(el('div', 'plabel', g.label || projName(p)));
    // 条数锚点：头行右侧显示总数，配合下方导轨线子树，层级一眼可辨
    if (sessions.length) row.appendChild(el('span', 'cnt', String(sessions.length)));
    // 项目行内「＋」：一键把新会话建到这个项目
    const add = el('button', 'wsadd', '＋');
    add.title = '在此项目新建会话';
    add.addEventListener('click', (ev) => { ev.stopPropagation(); openSession(null, p); });
    row.appendChild(add);
    if (isCur) { const d = el('span', 'dot'); row.appendChild(d); }
    row.addEventListener('click', () => switchWorkspace(p));
    box.appendChild(row);
    // 折叠态：整棵子树不渲染。展开态：平铺最近 3 条，「显示更多」展开全量（官方交互）；
    // 会话整体收进 .gkids（右缩 + 竖向导轨），不再与项目头齐宽平铺
    if (collapsed || !sessions.length) continue;
    const kids = el('div', 'gkids');
    const expanded = !!projExpanded.get(gkey);
    const list = expanded ? sessions : sessions.slice(0, 3);
    for (const s of list) kids.appendChild(sessRow(s, p || s.workspacePath));

      const more = el('button', 'morebtn', `显示更多（还有 ${sessions.length - list.length} 条）`);
      more.addEventListener('click', () => { projExpanded.set(gkey, true); renderProjectList(); });
      kids.appendChild(more);
    } else if (expanded && sessions.length > 3) {
      const less = el('button', 'morebtn', '收起');
      less.addEventListener('click', () => { projExpanded.set(gkey, false); renderProjectList(); });
      kids.appendChild(less);
    }
    box.appendChild(kids);
  }
}

// 远程项目组（官方任务栏同款层级：主机 → 远程项目 → 工作会话，点开只读浏览）。
// 排本地项目之前——用户决策 2026-11-03「远程项目默认优先排前」。

// 远程会话行：与 sessRow 同款视觉，点开走只读浏览，无 ⋯ 菜单（归档/删除归桌面）
function remoteRow(h, s) {
  const running = !!s.busy;
  const item = el('div', 'sess' + (remoteView && remoteView.sessionId === s.sessionId ? ' cur' : ''));
  if (running) {
    const sp = el('span', 'busy'); sp.innerHTML = SVG.spin; sp.title = '远程任务运行中'; item.appendChild(sp);
  }

  item.appendChild(el('span', 'time' + (running ? ' running' : ''), running ? '运行中' : fmtRel(s.updatedAt)));

// ── 会话管理 ──

// ── 新建会话：先明确落点项目 ──
// 此前「新会话」直接落到 curWs（localStorage 记忆值，错了服务端还静默回退到
// 默认项目）——用户没机会选项目，建成后界面上也看不到属于哪个项目空间
// （抽屉里要等首回合落库才出现这一条）。现在：多项目时先弹项目选择；
// 建成后按服务端返回的真实落点提示并校正 curWs；空会话的 hero 也带项目名。
function projectChoices() {
  const seen = new Set(); const out = [];
  // 同一项目可能以 E:\a 与 E:/a、带/不带尾分隔符等形态出现（config 与会话
  // 记录来源不一）：分隔符方向归一 + 剥尾分隔符 + 忽略大小写去重
  const clean = (p) => String(p ?? '').trim().replace(/\//g, '\\').replace(/\\{2,}/g, '\\').replace(/\\+$/, '');
  const push = (p) => {
    const path = clean(p);
    if (!path) return;
    const k = path.toLowerCase();
    if (seen.has(k)) return;
    seen.add(k); out.push(path);
  };
  push(curWs);
  for (const s of allSessions) push(s.workspacePath);
  // 服务端分组里的空项目（0 会话）也要能建进去——官方任务栏照样显示它
  for (const g of allGroups ?? []) push(g.path);
  for (const w of workspaces) push(w.path);
  return out;
}
function renderNewSessionMenu(anchor) {
  const pop = $('newMenu');
  pop.textContent = '';
  pop.appendChild(el('div', 'phead', '新会话建到哪个项目'));
  const choices = projectChoices();
  // 同名不同目录的项目（如 DTXY 与 .qwenpaw 下各有一个 TongYi-Lite）：
  // 标题带父目录消歧，完整路径在副行——否则"选中了哪个"全靠猜
  const baseCount = new Map();
  for (const p of choices) {
    const b = projName(p).toLowerCase();
    baseCount.set(b, (baseCount.get(b) ?? 0) + 1);
  }
  for (const p of choices) {
    const base = projName(p);
    const dup = (baseCount.get(base.toLowerCase()) ?? 0) > 1;
    const parent = p.replace(/[\\/]+$/, '').split(/[\\/]/).slice(-2)[0] ?? '';
    const title = (dup && parent ? `${base} · ${parent}` : base) + (p === curWs ? '（当前）' : '');
    pop.appendChild(popRow({
      title,
      desc: p,
      onClick: () => { closePops(); openSession(null, p); },
    }));
  }
}
function newSessionFlow(anchor) {
  const choices = projectChoices();
  if (choices.length <= 1) { openSession(null, choices[0] ?? curWs); return; }
  togglePop($('newMenu'), anchor, () => renderNewSessionMenu(anchor));
}

function setSessionTitle(t) {
  $('sessTitle').textContent = t || '未命名会话';
}

let openSeq = 0; // openSession 代际号：引擎 resume 可达分钟级，快速切换会话时
                 // 慢响应后到会把别的会话的消息渲染进来（串台），过期结果直接丢弃
// ── 会话切换过渡：点击即给反馈 ──
// openSession 的 POST /api/sessions 要挂载会话 + 拉全量历史，可能数秒；
// 没有过渡层时抽屉停在原地，用户以为"点了没反应"。
// openSeq 防串台纪律：只有最新一次 openSession 负责过渡层的展示与收起。
const switchingEl = $('switching');
const switchingText = $('switchingText');
function showSwitching(text) {
  switchingText.textContent = text;
  switchingEl.classList.add('on');
}
function hideSwitching() {
  switchingEl.classList.remove('on');
}

// ── 远程会话只读浏览（官方任务栏点远程任务 = 同等体验：能看、不能在手机续跑）──
async function openRemoteSession(h, s) {
  const mySeq = ++openSeq;
  $('drawer').classList.remove('open');
  closePops();
  showSwitching('打开远程会话…');
  try {
    const r = await api(`remote/messages?host=${encodeURIComponent(h.hostId)}&sessionId=${encodeURIComponent(s.sessionId)}&limit=200`);
    if (mySeq !== openSeq) return; // 已有更新的打开/切换请求接管
    if (r.error) throw new Error(String(r.error));
    stopRemoteFollow();
    abandonTurn(); // 旧会话回合静默抛弃：结算卡不追画进远程只读视图（见 abandonTurn）
    remoteView = { hostId: h.hostId, sessionId: s.sessionId, title: s.title || '未命名会话', host: h.host, username: h.username };
    // 本地会话状态整体退出：curSession=null 后轮询/队列/任务计划自动静默，SSE 手动关
    curSession = null;
    if (es) { es.close(); es = null; }
    lastSseEventAt = Date.now();
    lastActivity = Date.now();
    finishedSince = 0;
    setSessionTitle(`${s.title || '未命名会话'}（远程 · 只读）`);
    setActivity(s.busy ? '远程回合运行中' : '');
    histLimit = 0; histTotal = 0; // 远程只读视图整包渲染，不挂「加载更早」
    renderHistory(r.messages ?? [], { keepThinkOpen: !!s.busy });
    setComposerEnabled(false);
    hideSwitching();
    toast(`远程会话 · ${h.username}@${h.host}（只读）`);
    renderProjectList();
    if (s.busy) startRemoteFollow(h, s);
  } catch (e) {
    if (mySeq !== openSeq) return;
    hideSwitching();
    $('drawer').classList.add('open');
    toast(`打开远程会话失败：${e?.message ?? e}`);
  }
}

// 运行中的远程会话：每 5s 重拉一次消息跟随输出（服务器端 3s 消息缓存 + 单飞兜底）
function startRemoteFollow(h, s) {
  stopRemoteFollow();
  remoteFollowTimer = setInterval(async () => {
    if (!remoteView || remoteView.sessionId !== s.sessionId) { stopRemoteFollow(); return; }
    try {
      const r = await api(`remote/messages?host=${encodeURIComponent(h.hostId)}&sessionId=${encodeURIComponent(s.sessionId)}&limit=200`);
      if (r.error) return;
      const msgs = r.messages ?? [];
      const fp = fingerprint(msgs);
      if (fp !== lastFingerprint) renderHistory(msgs, { keepThinkOpen: true });
    } catch { /* 下轮再试 */ }
  }, 5000);
}
function stopRemoteFollow() {
  if (remoteFollowTimer) { clearInterval(remoteFollowTimer); remoteFollowTimer = null; }
}
function setComposerEnabled(on) {
  const c = $('composer');
  if (!c) return;
  c.disabled = !on;
  c.placeholder = on ? '继续输入以排队后续修改' : '远程会话只读 · 请在桌面端继续该会话';
}

async function openSession(sessionId, wsPath) {
  const mySeq = ++openSeq;
  if (curSession) rememberScroll(curSession); // 离场前记阅读位（restoreScroll 在渲染后恢复）
  // 切会话/新建：静默抛弃当前回合（幽灵卡根因修复，见 abandonTurn）——
  // 旧会话回合的改动卡/产出卡/结束线不会再跟画进新会话视图
  abandonTurn();
  // 从远程只读视图切回本地会话：恢复输入、停远程跟随
  stopRemoteFollow();
  remoteView = null;
  setComposerEnabled(true);
  // 即时反馈：收抽屉/弹层 + 显示过渡层（成功失败都会收起，见下）
  const drawerWasOpen = $('drawer').classList.contains('open');
  $('drawer').classList.remove('open');
  closePops();
  showSwitching(sessionId ? '切换会话…' : '创建新会话…');
  try {
    // 打开已有会话：不传 workspace（引擎沿用会话自身所属项目，避免改绑）；
    // 新会话：落点为指定项目/当前项目。
    if (wsPath) {
      curWs = wsPath;
      try { localStorage.setItem('zcode.ws', curWs); } catch { /* 忽略 */ }
    }
    const body = sessionId ? { sessionId } : { sessionId: null, workspace: curWs };
    const r = await api('sessions', { method: 'POST', body: JSON.stringify(body) });
    if (mySeq !== openSeq) return; // 已有更新的打开请求，本次结果作废（防串台）
    curSession = r.sessionId;
    // 记录本页面最后查看的会话：下次启动优先恢复它（连续性，见 boot）
    try { localStorage.setItem('zcode.lastSession', curSession); } catch { /* 忽略 */ }
    // 项目归属以服务端返回的真实落点为准（新建时可能因白名单回退）：
    // 校正 curWs，后续"新会话建到哪个项目"的选择器与提示都基于它
    if (!sessionId && r.workspacePath) {
      curWs = r.workspacePath;
      try { localStorage.setItem('zcode.ws', curWs); } catch { /* 忽略 */ }
    }
    // 计时基准全部按新会话重置，避免上一会话的静默/收尾状态串线
    lastSseEventAt = Date.now();
    lastActivity = Date.now();
    finishedSince = 0;
    setSessionTitle(r.title);
    // 切换会话：清掉上一个会话残留的运行文案（运行态在下面按新会话实况恢复）
    setActivity('');
    // 会话设置（模型/思考档位/权限模式）：快照里直接带出，立即同步底行按钮
    if (r.settings && !r.settings.unavailable) {
      sessionSettings = r.settings;
      curMode = r.settings.mode?.current ?? curMode;
    }
    syncComposerChrome();
    refreshSettings(false); // 异步补齐上下文环数据（projection 为 0 时走 goal 回退）
    // 运行态判断提前到 renderHistory 之前：全量重绘要据此决定是否保留
    // "最新思考展开"（忙碌回合的思考要跟着输出，不能折叠）
    const st = String(r.status ?? '').toLowerCase();
    const running = r.busy === true || st === 'running' || st === 'busy' || st === 'executing';
    // 外部（桌面端）驱动的回合：引擎 status 恒为 idle，但从存储里
    // 最后一条消息未以 step-finish 收尾可推断出"运行中"
    const foreignRunning = !running && turnLooksRunning(r.messages ?? []);
    // 首屏历史已由服务端共享库直查截到最近 40 条（server HISTORY_INIT_PAGE），
    // histTotal 决定顶部要不要挂「加载更早」
    histLimit = r.messages?.length ? Math.max(r.messages.length, 40) : 40;
    histTotal = Number(r.total ?? (r.messages ?? []).length);
    renderHistory(r.messages ?? [], { keepThinkOpen: running || foreignRunning });
    if (sessionId && restoreScroll(curSession)) { /* 非贴底阅读位已恢复（覆盖强滚底） */ }
    // 恢复会话时对齐运行态：服务端 ring 为空（重启过）也能正确显示"运行中"。
    // 归属核对：切会话的 await 窗口里，旧会话在途事件可能把 busy 又拉起来
    // （turnSession 还指着旧会话）——那种 busy 不算数，必须按新会话实况重判
    const busyHere = busy && turnSession === curSession;
    if (running && !busyHere) {
      busySource = 'sse';
      busySince = r.busySince ?? Date.now();
      setBusy(true, { keepCollections: true }); // 保留 renderHistory 从存储重建的当轮计数
      notifyTaskState(true);
      startLiveTimers();
    } else if (foreignRunning && !busyHere) {
      busySource = 'inferred';
      busySince = Date.now();
      lastActivity = Date.now();
      setBusy(true, { keepCollections: true });
      notifyTaskState(true);
      startLiveTimers();
    } else if (busy && !running && !foreignRunning) {
      // 目标空闲而 busy 还挂着（切换期串进来的野态）：静默复位，结算闸拦住补画；
      // 目标在跑且 busyHere 已成立时不进这里——运行态原样保留
      busySource = null;
      setBusy(false);
    }
    // 只收新事件：历史已渲染，避免全量重放导致文本重复
    connectStream(curSession, r.lastSeq ?? -1);
    refreshQueue(curSession); // 排队消息（预备任务）随会话对齐
    curTodos = []; todoOpen = false; renderTodoBar(); refreshTodos(); // 任务计划随会话对齐
    queueEditId = null; // 编辑取回的原条目属于旧会话：清空替换追踪
    hideSwitching(); // 历史已渲染：过渡层在此收起（同帧呈现新会话内容）
    if (sessionId) toast('已恢复会话');
    else toast('新会话 · 项目：' + projName(curWs));
    renderProjectList();
    loadAllSessions();
    loadPlan();
  } catch (e) {
    if (mySeq !== openSeq) return; // 已被更新的打开请求接管：UI 由它负责
    hideSwitching();
    const msg = String(e?.message ?? e);
    // 会话已不存在（被清理/数据库重置）：清掉失效记忆并自动切换到其他会话，
    // 否则轮询会在这个死会话上 1.2s 一次无限打转（2026-10-04 实测）
    if (sessionId && /not found|not active/i.test(msg)) {
      allSessions = allSessions.filter((s) => s.sessionId !== sessionId);
      try { localStorage.removeItem('zcode.lastSession'); } catch { /* 忽略 */ }
      const fb = allSessions.find((s) => s.busy) ?? allSessions[0];
      if (fb && mySeq === openSeq) {
        toast('该会话已不存在，已切换到其他会话');
        await openSession(fb.sessionId, fb.workspacePath);
        return;
      }
    }
    // 打开失败：恢复抽屉让用户另选（过渡层已收起）
    if (drawerWasOpen) $('drawer').classList.add('open');
    toast(`打开会话失败：${msg}`);
  }
}

// ── 启动：自动恢复最近会话（优先运行中的会话，刷新后进度不丢）──

(async function boot() {
  try {
    const state = await api('state');
    // 输入卡模型名（官方：GLM-5.3-Flash ▾）
    const model = String(state.model ?? '');
    const mm = model.match(/\/([^$/]+)(?:\$|$)/);
    $('modelName').textContent = mm ? mm[1] : (model || 'ZCode');
    // 权限模式初始色（会话打开后以会话设置为准）
    curMode = String(state.mode ?? '');
    syncModeUi();
    await loadWorkspaces();
    await loadAllSessions();
    loadRemoteProjects(); // 远程组异步加载：SSH 慢也不能拖启动（失败保旧快照静默）
    // 校正 localStorage 里的项目：已不存在时回落到最近会话的项目
    const knownPaths = new Set([
      ...allSessions.map((s) => s.workspacePath ?? ''),
      ...(allGroups ?? []).map((g) => String(g.path ?? '')),
      ...workspaces.map((w) => String(w.path ?? '')),
    ]);
    if (!knownPaths.has(curWs)) {
      curWs = allSessions[0]?.workspacePath ?? workspaces[0]?.path ?? '';
      try { localStorage.setItem('zcode.ws', curWs); } catch { /* 忽略 */ }
    }
    // 优先级：运行中的会话（任务进度必须可见，最高优先）>
    // 上次本页面查看的会话（连续性）> 最近一个（跨项目兜底）
    let lastSid = '';
    try { lastSid = localStorage.getItem('zcode.lastSession') ?? ''; } catch { /* 忽略 */ }
    const target =
      allSessions.find((s) => s.busy) ??
      allSessions.find((s) => s.sessionId === lastSid) ??
      allSessions[0];
    if (target) await openSession(target.sessionId, target.workspacePath);
    // 目标会话打开失败（如已被清理）：清掉失效记忆并回退到最近会话
    if (curSession !== (target?.sessionId ?? '')) {
      try { localStorage.removeItem('zcode.lastSession'); } catch { /* 忽略 */ }
      const fallback = allSessions.find((s) => s.sessionId !== target?.sessionId);
      if (fallback) await openSession(fallback.sessionId, fallback.workspacePath);
    }
    if (!curSession) $('drawer').classList.add('open');
    const pb = $('pageBuild');
    if (pb) pb.textContent = '页面版本 ' + PAGE_BUILD;
    startPolling();
  } catch (e) {
    toast(`初始化失败：${e.message}`);
    $('drawer').classList.add('open');
  }
})();
</script>
</body>
</html>
